<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixa de Intangível — Glorioso Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --gold:         #be8c4a; --gold-soft:    #dcc89a; --gold-deep:   #7a6244;
    --gold-tint:    rgba(190,140,74,.12); --gold-ring: rgba(190,140,74,.22);
    --ink-1:        #1a1410; --ink-2:        #3a2e1c; --ink-4:       rgba(26,20,16,.55);
    --cream-page:   #f9f7f2; --cream-canvas: #f5f2eb; --cream-card:  #fdfbf6;
    --cream-inset:  #ece6d8; --tbl-head:     #e7e5de;
    --dark:         #1a1410; --dark-2:       #231d16;
    --on-dark:      #f3eee2; --on-dark-d:    rgba(243,238,226,.45); --on-dark-m:rgba(243,238,226,.28);
    --pos:          #166534; --pos-t:        #dcf0e4;
    --neg:          #b91c1c; --neg-t:        #fce8e8;
    --warn:         #b88a2a; --amber:        #d97706;
    --div:          rgba(26,20,16,.08); --div-m:rgba(26,20,16,.13);
    --sh-h:         0 1px 0 rgba(40,32,22,.04);
    --sh-l:         0 1px 0 rgba(40,32,22,.04),0 4px 12px -8px rgba(40,32,22,.10);
    --r-xs:4px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream-page);color:var(--ink-1);line-height:1.5;min-height:100vh;font-size:15px}

/* HERO */
.page-hero{background:var(--dark);border-radius:var(--r-lg);margin:16px 24px 0;padding:clamp(20px,3vw,32px) clamp(20px,3vw,36px);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--on-dark-d);margin-bottom:8px}
.hero-title{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.6rem,4.5vw,2.8rem);font-weight:700;line-height:1.08;letter-spacing:-.025em;color:var(--on-dark)}
.hero-title em{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;color:var(--gold)}
.hero-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--on-dark-d);letter-spacing:.04em;margin-top:10px}
.hero-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:4px}
.hero-btn{padding:9px 18px;border-radius:var(--r-pill);border:1px solid rgba(243,238,226,.18);background:rgba(243,238,226,.07);color:var(--on-dark);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.hero-btn:hover{background:rgba(243,238,226,.13)}
.ptax-chip{display:flex;align-items:center;gap:7px;padding:6px 14px;background:rgba(243,238,226,.07);border:1px solid rgba(243,238,226,.13);border-radius:var(--r-pill);font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--on-dark-d)}
.ptax-chip strong{font-weight:600;color:var(--on-dark)}
.ptax-refresh{border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--on-dark-m);padding:0;transition:color .15s}
.ptax-refresh:hover{color:var(--gold)}

/* PAGE BODY */
.page-body{padding:20px 24px 32px}
.section-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.add-player-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--r-pill);border:1.5px dashed var(--gold-deep);background:transparent;color:var(--gold-deep);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .15s;margin-bottom:20px}
.add-player-btn:hover{background:var(--gold-tint);border-color:var(--gold)}

/* PLAYER CARD */
.player-card{background:var(--cream-card);border:1px solid var(--div);border-radius:var(--r-md);box-shadow:var(--sh-h);overflow:hidden;margin-bottom:16px;transition:box-shadow .18s}
.player-card:hover{box-shadow:var(--sh-l)}
.player-head{background:var(--dark);padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.player-num{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--on-dark-m);flex-shrink:0}
.player-name-inp{flex:1;min-width:180px;background:rgba(243,238,226,.08);border:1px solid rgba(243,238,226,.14);border-radius:var(--r-xs);padding:7px 10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--on-dark);outline:none;transition:border-color .15s,background .15s}
.player-name-inp:focus{border-color:var(--gold);background:rgba(243,238,226,.13)}
.player-name-inp::placeholder{color:var(--on-dark-m)}
.remove-btn{border:none;background:rgba(185,28,28,.15);color:#f87171;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:var(--r-xs);cursor:pointer;transition:background .15s;margin-left:auto}
.remove-btn:hover{background:rgba(185,28,28,.28)}

/* DATES ROW */
.dates-row{display:flex;gap:16px;padding:14px 18px;border-bottom:1px solid var(--div);flex-wrap:wrap;align-items:flex-end;background:var(--cream-canvas)}
.date-group{display:flex;flex-direction:column;gap:5px}
.date-label{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-deep)}
.date-inp{background:var(--cream-card);border:1px solid var(--div-m);border-radius:var(--r-sm);padding:7px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--ink-1);outline:none;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.date-inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-ring)}
.dates-sep{color:var(--ink-4);align-self:flex-end;padding-bottom:9px;font-size:13px}
.dates-divider{width:1px;background:var(--div);align-self:stretch;flex-shrink:0;margin:0 4px}

/* ITEMS TABLE */
.items-section{padding:14px 18px}
.items-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.items-title{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)}
.add-item-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--div-m);border-radius:var(--r-pill);background:transparent;color:var(--gold-deep);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .12s}
.add-item-btn:hover{background:var(--gold-tint);border-color:var(--gold)}
.items-col-header{display:grid;grid-template-columns:1fr 150px 100px 90px 1fr 24px;gap:6px;margin-bottom:6px;padding:0 2px}
.col-h{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}

/* ITEM ROW */
.item-row{display:grid;grid-template-columns:1fr 150px 100px 90px 1fr 24px;gap:6px;margin-bottom:6px;align-items:center}
.field-wrap{display:flex;align-items:center;background:var(--cream-card);border:1px solid var(--div-m);border-radius:var(--r-sm);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.field-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-ring)}
.field-pfx{padding:7px 8px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;color:var(--gold-deep);background:var(--cream-inset);border-right:1px solid var(--div);white-space:nowrap;flex-shrink:0}
.field-inp{background:transparent;border:none;outline:none;padding:7px 8px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:400;color:var(--ink-1);width:100%;min-width:0}
.label-inp{background:var(--cream-card);border:1px solid var(--div-m);border-radius:var(--r-sm);padding:7px 9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--ink-1);outline:none;width:100%;transition:border-color .15s,box-shadow .15s;min-width:0}
.label-inp:focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-ring)}
.cur-toggle{display:flex;background:var(--cream-inset);border:1px solid var(--div);border-radius:var(--r-xs);overflow:hidden;flex-shrink:0}
.cur-btn{flex:1;padding:6px 0;border:none;background:transparent;color:var(--ink-4);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.06em;cursor:pointer;transition:all .12s;min-width:28px}
.cur-btn.active{background:var(--dark);color:var(--gold-soft)}
.rate-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-4);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remove-item-btn{width:24px;height:24px;border:none;background:transparent;color:var(--ink-4);font-size:14px;cursor:pointer;border-radius:var(--r-xs);transition:all .12s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.remove-item-btn:hover{background:var(--neg-t);color:var(--neg)}

/* SALE ROW */
.sale-section{padding:12px 18px;border-top:1px solid var(--div);background:var(--cream-canvas);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sale-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);white-space:nowrap}
.sale-brl{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-2);margin-left:4px}

/* RESULTS */
.results-section{border-top:2px solid var(--div-m);background:var(--cream-card)}
.results-inner{padding:16px 18px}
.results-header{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.results-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-4);margin-bottom:12px}
.results-meta strong{color:var(--ink-2)}

/* AMORT TABLE */
.amort-tbl{width:100%;border-collapse:collapse;margin-bottom:14px}
.amort-tbl th{padding:7px 10px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);background:var(--tbl-head);border-bottom:2px solid var(--div-m)}
.amort-tbl th:first-child{text-align:left}
.amort-tbl td{padding:8px 10px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--div)}
.amort-tbl td:first-child{text-align:left;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--ink-1)}
.amort-tbl tr:last-child td{border-bottom:none}
.amort-tbl .total-tr td{background:var(--tbl-head);border-top:2px solid var(--div-m);font-weight:500}
.amort-tbl .total-tr td:first-child{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep)}
.td-neg{color:var(--neg)!important}
.td-amber{color:var(--amber)!important}
.td-gold{color:var(--gold-deep)!important;font-weight:600!important}
.td-warn{color:var(--warn)!important}
.td-pos{color:var(--pos)!important}

/* SUMMARY ROW */
.summary-row{display:flex;gap:0;border-top:1px solid var(--div);margin-top:12px;padding-top:14px}
.sum-box{flex:1;padding:0 16px;text-align:center;border-right:1px solid var(--div)}
.sum-box:first-child{padding-left:0;text-align:left}
.sum-box:last-child{border-right:none}
.sum-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px}
.sum-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:var(--ink-2)}
.sum-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-4);margin-top:2px}

/* GAIN CARD */
.gain-card{background:var(--dark);border-radius:var(--r-sm);padding:14px 16px;margin-top:14px}
.gain-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--on-dark-m);margin-bottom:10px}
.gain-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:5px}
.gain-row .gl{color:var(--on-dark-d)}
.gain-row .gv{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(243,238,226,.7)}
.gain-sep{border:none;border-top:1px solid rgba(243,238,226,.08);margin:8px 0}
.gain-main{display:flex;justify-content:space-between;align-items:baseline}
.gain-main .gl{font-size:13px;font-weight:600;color:var(--on-dark)}
.gain-main .gv{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500}
.gv-pos{color:#86efac!important}
.gv-neg{color:#f87171!important}
.gv-gold{color:var(--gold-soft)!important}

/* TOTALS BAND */
.totals-band{background:var(--dark);border-radius:var(--r-lg);padding:20px 28px;margin-bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.tb-item{padding:0 20px;text-align:center}
.tb-item+.tb-item{border-left:1px solid rgba(243,238,226,.08)}
.tb-item:first-child{padding-left:0;text-align:left}
.tb-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--on-dark-m);margin-bottom:6px}
.tb-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;color:var(--on-dark);line-height:1.1}
.tb-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--on-dark-m);margin-top:4px}
.tb-neg{color:#f9a0a0}.tb-pos{color:#86efac}.tb-gold{color:var(--gold-soft)}.tb-amber{color:#fcd34d}

/* EMPTY STATE */
.empty-results{padding:24px 18px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-4);letter-spacing:.06em;text-align:center}

/* FOOTER */
.footer{text-align:center;padding:20px 24px;font-size:11.5px;color:var(--ink-4);border-top:1px solid var(--div)}

/* UTILS */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--cream-canvas)}
::-webkit-scrollbar-thumb{background:var(--cream-inset);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-soft)}

@media(max-width:900px){
    .item-row,.items-col-header{grid-template-columns:1fr 130px 90px 70px 1fr 24px}
    .totals-band{grid-template-columns:repeat(2,1fr)}
    .tb-item+.tb-item{border-left:none}
    .tb-item:nth-child(2n+1){padding-left:0;text-align:left}
    .summary-row{flex-wrap:wrap}
    .sum-box{flex:1 1 40%;border-right:none;padding:0 0 10px}
}
@media(max-width:640px){
    .item-row,.items-col-header{grid-template-columns:1fr 110px 88px 60px 1fr 24px}
    .page-hero,.page-body{margin-left:12px;margin-right:12px}
}
@media(max-width:560px){
    .item-row,.items-col-header{grid-template-columns:1fr 100px 84px 1fr 24px}
    .col-h.col-rate,.rate-badge{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════════════
// HISTORICAL PTAX (fonte: xlsx Cotações, cotação mensal de fechamento)
// ═══════════════════════════════════════════════════════════════════
const FX_HIST = {
    '2024-01':{USD:4.9526,EUR:5.3567},'2024-02':{USD:4.9716,EUR:5.3708},
    '2024-03':{USD:5.0153,EUR:5.4120},'2024-04':{USD:5.1934,EUR:5.5382},
    '2024-05':{USD:5.2443,EUR:5.6853},'2024-06':{USD:5.5925,EUR:5.9912},
    '2024-07':{USD:5.6500,EUR:6.1161},'2024-08':{USD:5.6103,EUR:6.1977},
    '2024-09':{USD:5.4482,EUR:6.0677},'2024-10':{USD:5.7867,EUR:6.2977},
    '2024-11':{USD:5.9730,EUR:6.3164},'2024-12':{USD:6.1840,EUR:6.4023},
    '2025-01':{USD:5.8410,EUR:6.0524},'2025-02':{USD:5.8852,EUR:6.1059},
    '2025-03':{USD:5.7047,EUR:6.1708},'2025-04':{USD:5.6740,EUR:6.4269},
    '2025-05':{USD:5.7224,EUR:6.4932},'2025-06':{USD:5.4321,EUR:6.4023},
    '2025-07':{USD:5.6008,EUR:6.3933},'2025-08':{USD:5.4299,EUR:6.3443},
    '2025-09':{USD:5.3224,EUR:6.2447},'2025-10':{USD:5.3739,EUR:6.1983},
    '2025-11':{USD:5.3363,EUR:6.1874},'2025-12':{USD:5.4770,EUR:6.4327},
    '2026-01':{USD:5.2571,EUR:6.2286},'2026-02':{USD:5.1300,EUR:6.0601},
    '2026-03':{USD:5.1813,EUR:5.9851},'2026-04':{USD:4.9539,EUR:5.8109},
};
let LIVE_FX = {USD:null,EUR:null,date:''};

async function fetchLivePTAX() {
    try {
        const r = await fetch('https://economia.awesomeapi.com.br/json/last/EUR-BRL,USD-BRL');
        const j = await r.json();
        if (j.EURBRL) LIVE_FX.EUR = parseFloat(j.EURBRL.bid);
        if (j.USDBRL) LIVE_FX.USD = parseFloat(j.USDBRL.bid);
        if (j.EURBRL?.create_date) {
            const d = j.EURBRL.create_date.split(' ')[0];
            LIVE_FX.date = d;
            const ym = d.substring(0,7);
            // Add live rate for current month if not in history
            if (!FX_HIST[ym]) FX_HIST[ym] = {USD:LIVE_FX.USD, EUR:LIVE_FX.EUR};
        }
    } catch(e) { console.warn('PTAX fetch error:', e); }
    updatePTAXChip();
}

function updatePTAXChip() {
    const el = document.getElementById('ptax-chip');
    if (!el) return;
    const fEUR = LIVE_FX.EUR ? LIVE_FX.EUR.toFixed(4) : '—';
    const fUSD = LIVE_FX.USD ? LIVE_FX.USD.toFixed(4) : '—';
    el.innerHTML = `
        <span>EUR</span><strong>${fEUR}</strong>
        <span style="color:var(--div)">|</span>
        <span>USD</span><strong>${fUSD}</strong>
        ${LIVE_FX.date ? `<span style="font-size:9px">${fmtD(LIVE_FX.date)}</span>` : ''}
        <button class="ptax-refresh" title="Atualizar PTAX" onclick="fetchLivePTAX()">↻</button>`;
}

function getRate(currency, ym) {
    if (currency === 'BRL') return {rate:1, src:'BRL'};
    if (ym && FX_HIST[ym]) return {rate:FX_HIST[ym][currency], src:`PTAX ${ym}`};
    if (ym) {
        const keys = Object.keys(FX_HIST).sort();
        for (const k of [...keys].reverse()) {
            if (k <= ym) return {rate:FX_HIST[k][currency], src:`PTAX ${k}*`};
        }
    }
    if (LIVE_FX[currency]) return {rate:LIVE_FX[currency], src:'PTAX live'};
    return {rate:1, src:'?'};
}

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let _pid = 0, _iid = 0;

function newItem(label='Transfer Fee', currency='BRL') {
    return {id:++_iid, label, amount:null, currency};
}
function newPlayer() {
    const p = {
        id:++_pid, name:'', start:'', end:'', exit:'',
        saleAmount:null, saleCurrency:'BRL',
        items:[newItem('Transfer Fee'), newItem('Intermediação'), newItem('Luva')],
    };
    return p;
}

let S = {players:[]};

function saveLocal() {
    try { localStorage.setItem('gbai_v2', JSON.stringify({S,_pid,_iid})); } catch(e) {}
}
function loadLocal() {
    try {
        const d = JSON.parse(localStorage.getItem('gbai_v2') || 'null');
        if (d?.S?.players?.length) { S=d.S; _pid=d._pid||_pid; _iid=d._iid||_iid; return true; }
    } catch(e) {}
    return false;
}

// ═══════════════════════════════════════════════════════════════════
// CALC
// ═══════════════════════════════════════════════════════════════════
function monthsInc(start, end) {
    return (end.getFullYear()-start.getFullYear())*12 + end.getMonth()-start.getMonth()+1;
}
function ym(dateStr) { return dateStr ? dateStr.substring(0,7) : ''; }
function pDate(s) { const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }

function calcPlayer(p) {
    if (!p.start || !p.end) return null;
    const startD = pDate(p.start), endD = pDate(p.end);
    if (endD <= startD) return null;

    const contractMonths = monthsInc(startD, endD);
    const startYM = ym(p.start);

    let exitMonths = null, exitD = null;
    if (p.exit) {
        exitD = pDate(p.exit);
        exitMonths = Math.max(0, Math.min(contractMonths, monthsInc(startD, exitD)));
    }

    const itemResults = p.items.map(it => {
        const amt = it.amount ?? 0;
        const {rate, src} = getRate(it.currency, startYM);
        const totalBRL   = amt * rate;
        const monthlyBRL = contractMonths > 0 ? totalBRL / contractMonths : 0;
        const amortBRL   = exitMonths !== null ? monthlyBRL * exitMonths : 0;
        const residBRL   = totalBRL - amortBRL;
        return {...it, rate, src, totalBRL, monthlyBRL, amortBRL, residBRL};
    });

    const totActivated = itemResults.reduce((s,i)=>s+i.totalBRL, 0);
    const totAmort     = itemResults.reduce((s,i)=>s+i.amortBRL, 0);
    const totResid     = itemResults.reduce((s,i)=>s+i.residBRL, 0);

    let saleBRL=0, saleRate=1, saleSrc='', gain=null;
    if (p.saleAmount && exitD) {
        const {rate,src} = getRate(p.saleCurrency, ym(p.exit));
        saleRate=rate; saleSrc=src;
        saleBRL = p.saleAmount * saleRate;
        gain    = saleBRL - totResid;
    }

    const pctAmort = totActivated > 0 ? totAmort/totActivated*100 : 0;

    return {contractMonths,exitMonths,itemResults,totActivated,totAmort,totResid,saleBRL,saleRate,saleSrc,gain,pctAmort};
}

// ═══════════════════════════════════════════════════════════════════
// FORMAT
// ═══════════════════════════════════════════════════════════════════
const N  = v => new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v??0);
const N0 = v => new Intl.NumberFormat('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}).format(v??0);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtD = s => { if(!s||!s.includes('-'))return s||''; const[y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const curSym = c => c==='EUR'?'€':c==='USD'?'US$':'R$';

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function renderAll() {
    document.getElementById('app').innerHTML = buildApp();
    bindEvents();
}

function refreshResults(pid) {
    const p = S.players.find(x=>x.id===pid);
    const el = document.getElementById(`res-${pid}`);
    if (!p || !el) return;
    el.innerHTML = hResults(p);
}

function refreshTotals() {
    const el = document.getElementById('totals-band');
    if (el) el.outerHTML = hTotalsBand();
}

function buildApp() {
    return `
        ${hHero()}
        <div class="page-body">
            <div class="section-eyebrow">Atletas</div>
            <div id="players-list">
                ${S.players.map(p=>hPlayerCard(p)).join('')}
            </div>
            <button class="add-player-btn" id="add-player-btn">＋ Adicionar atleta</button>
            <div id="totals-band">${hTotalsBand()}</div>
        </div>
        <div class="footer">Glorioso Finance · Baixa de Ativo Intangível · Amortização linear mensal · PTAX: cotações históricas BACEN</div>
    `;
}

function hHero() {
    return `
        <div class="page-hero">
            <div class="hero-left">
                <div class="hero-eyebrow">Glorioso Finance · Departamento Financeiro</div>
                <h1 class="hero-title">Baixa de <em>Intangível</em></h1>
                <div class="hero-sub">Amortização mensal de custo de aquisição de atletas · Ganho econômico na transferência</div>
            </div>
            <div class="hero-right">
                <div id="ptax-chip" class="ptax-chip">
                    <span>EUR</span><strong>—</strong>
                    <span style="color:var(--div)">|</span>
                    <span>USD</span><strong>—</strong>
                    <button class="ptax-refresh" title="Atualizar PTAX" onclick="fetchLivePTAX()">↻</button>
                </div>
                <button class="hero-btn" onclick="window.print()">Imprimir</button>
            </div>
        </div>`;
}

function hPlayerCard(p) {
    return `
    <div class="player-card" id="card-${p.id}">
        <div class="player-head">
            <span class="player-num">Atleta</span>
            <input class="player-name-inp" type="text"
                data-pid="${p.id}" data-field="name"
                value="${esc(p.name)}" placeholder="Nome do atleta">
            <button class="remove-btn" data-pid="${p.id}" data-action="remove-player">× Remover</button>
        </div>

        <div class="dates-row">
            <div class="date-group">
                <span class="date-label">Início da vigência</span>
                <input class="date-inp" type="date" data-pid="${p.id}" data-field="start" value="${p.start}">
            </div>
            <span class="dates-sep">→</span>
            <div class="date-group">
                <span class="date-label">Fim da vigência</span>
                <input class="date-inp" type="date" data-pid="${p.id}" data-field="end" value="${p.end}">
            </div>
            <div class="dates-divider"></div>
            <div class="date-group">
                <span class="date-label">Data de saída do atleta</span>
                <input class="date-inp" type="date" data-pid="${p.id}" data-field="exit" value="${p.exit}">
            </div>
        </div>

        <div class="items-section">
            <div class="items-header">
                <span class="items-title">Custo de aquisição</span>
                <button class="add-item-btn" data-pid="${p.id}" data-action="add-item">＋ Item</button>
            </div>
            <div class="items-col-header">
                <span class="col-h">Classificação</span>
                <span class="col-h" style="text-align:right">Valor</span>
                <span class="col-h" style="text-align:center">Moeda</span>
                <span class="col-h col-rate" style="text-align:center">Cotação</span>
                <span class="col-h" style="text-align:right">Total BRL</span>
                <span></span>
            </div>
            <div id="items-${p.id}">
                ${p.items.map(it=>hItemRow(p.id, it)).join('')}
            </div>
        </div>

        <div class="sale-section">
            <span class="sale-label">Receita da venda</span>
            <div class="field-wrap" style="width:180px">
                <span class="field-pfx">${curSym(p.saleCurrency)}</span>
                <input class="field-inp" type="number" min="0" step="100000"
                    data-pid="${p.id}" data-field="saleAmount"
                    value="${p.saleAmount??''}" placeholder="0,00">
            </div>
            <div class="cur-toggle" style="width:96px">
                <button class="cur-btn${p.saleCurrency==='BRL'?' active':''}" data-pid="${p.id}" data-field="saleCurrency" data-v="BRL">R$</button>
                <button class="cur-btn${p.saleCurrency==='EUR'?' active':''}" data-pid="${p.id}" data-field="saleCurrency" data-v="EUR">EUR</button>
                <button class="cur-btn${p.saleCurrency==='USD'?' active':''}" data-pid="${p.id}" data-field="saleCurrency" data-v="USD">USD</button>

        <div class="results-section">
            <div id="res-${p.id}">${hResults(p)}</div>
        </div>
    </div>`;
}

function hItemRow(pid, it) {
    const p = S.players.find(x=>x.id===pid);
    const startYM = p ? ym(p.start) : '';
    const {rate,src} = getRate(it.currency, startYM);
    const amt = it.amount ?? 0;
    const totalBRL = amt * rate;
    const sym = curSym(it.currency);
    return `
    <div class="item-row" id="irow-${it.id}">
        <input class="label-inp" type="text" data-pid="${pid}" data-iid="${it.id}" data-field="label"
            value="${esc(it.label)}" placeholder="Ex: Transfer Fee" list="item-labels">
        <div class="field-wrap">
            <input class="field-inp" type="number" min="0" step="50000"
                data-pid="${pid}" data-iid="${it.id}" data-field="amount"
                value="${it.amount??''}" placeholder="0"
                style="text-align:right">
        </div>
        <div class="cur-toggle">
            <button class="cur-btn${it.currency==='BRL'?' active':''}" data-pid="${pid}" data-iid="${it.id}" data-field="itemCur" data-v="BRL">R$</button>
            <button class="cur-btn${it.currency==='EUR'?' active':''}" data-pid="${pid}" data-iid="${it.id}" data-field="itemCur" data-v="EUR">EUR</button>
            <button class="cur-btn${it.currency==='USD'?' active':''}" data-pid="${pid}" data-iid="${it.id}" data-field="itemCur" data-v="USD">USD</button>
        </div>
        <span class="rate-badge">${it.currency==='BRL'?'—':`${rate.toFixed(4)}<br><span style="font-size:7px;opacity:.7">${src}</span>`}</span>
        <div class="field-wrap" style="background:var(--cream-canvas)">
            <span class="field-pfx">R$</span>
            <input class="field-inp" type="text" readonly
                value="${N(totalBRL)}" style="color:var(--warn);cursor:default;font-size:12px">
        </div>
        <button class="remove-item-btn" data-pid="${pid}" data-iid="${it.id}" data-action="remove-item"
            title="Remover item">×</button>
    </div>`;
}

function hSaleBRL(p) {
    if (!p.saleAmount || !p.exit) return '';
    const {rate} = getRate(p.saleCurrency, ym(p.exit));
    const brl = p.saleAmount * rate;
    return p.saleCurrency !== 'BRL' ? `= R$ ${N(brl)}` : '';
}

function hResults(p) {
    const c = calcPlayer(p);
    if (!c || !p.start || !p.end) {
        return `<div class="empty-results">Preencha a vigência do contrato para ver os resultados</div>`;
    }

    const exitLabel = c.exitMonths !== null
        ? `Saída em <strong>${c.exitMonths}</strong> de <strong>${c.contractMonths}</strong> meses (${N0(c.pctAmort)}% amortizado)`
        : `<strong>${c.contractMonths}</strong> meses de contrato — preencha a data de saída`;

    const itemRows = c.itemResults.map(it => {
        if (!it.amount) return '';
        const sym = curSym(it.currency);
        return `
        <tr>
            <td>${esc(it.label)}
                ${it.currency!=='BRL'?`<div style="font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--ink-4);margin-top:2px">${sym} ${N(it.amount)} × ${it.rate.toFixed(4)} (${esc(it.src)})</div>`:''}
            </td>
            <td class="td-warn">R$ ${N(it.totalBRL)}</td>
            <td class="td-amber">R$ ${N(it.monthlyBRL)}<span style="font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--ink-4)">/mês</span></td>
            ${c.exitMonths!==null ? `
            <td class="td-neg">R$ ${N(it.amortBRL)}</td>
            <td class="td-gold">R$ ${N(it.residBRL)}</td>
            ` : '<td colspan="2" style="color:var(--ink-4);font-size:11px">— data de saída não definida —</td>'}
        </tr>`;
    }).join('');

    const hasItems = c.itemResults.some(i=>i.amount);

    return `
    <div class="results-inner">
        <div class="results-header">Amortização</div>
        <div class="results-meta">${exitLabel}</div>
        ${hasItems ? `
        <table class="amort-tbl">
            <thead>
                <tr>
                    <th style="text-align:left">Item</th>
                    <th>Total ativado</th>
                    <th>Mensal</th>
                    ${c.exitMonths!==null?'<th>Amortizado</th><th>Baixa (residual)</th>':'<th colspan="2"></th>'}
                </tr>
            </thead>
            <tbody>
                ${itemRows}
            </tbody>
            <tfoot>
                <tr class="total-tr">
                    <td>Total</td>
                    <td class="td-warn">R$ ${N(c.totActivated)}</td>
                    <td class="td-amber">R$ ${N(c.totActivated / c.contractMonths)}/mês</td>
                    ${c.exitMonths!==null ? `
                    <td class="td-neg">R$ ${N(c.totAmort)}</td>
                    <td class="td-gold">R$ ${N(c.totResid)}</td>
                    ` : '<td colspan="2"></td>'}
                </tr>
            </tfoot>
        </table>
        ` : `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-4);margin-bottom:12px">Insira os valores dos itens acima</div>`}

        ${c.exitMonths !== null ? `
        <div class="summary-row">
            <div class="sum-box">
                <div class="sum-eyebrow">Total ativado</div>
                <div class="sum-val" style="color:var(--warn)">R$ ${N(c.totActivated)}</div>
                <div class="sum-sub">${c.contractMonths} meses de contrato</div>
            </div>
            <div class="sum-box">
                <div class="sum-eyebrow">Amortização acum.</div>
                <div class="sum-val" style="color:var(--neg)">R$ ${N(c.totAmort)}</div>
                <div class="sum-sub">${c.exitMonths} meses · ${N0(c.pctAmort)}% do total</div>
            </div>
            <div class="sum-box">
                <div class="sum-eyebrow">Baixa do intangível</div>
                <div class="sum-val" style="color:var(--gold-deep)">R$ ${N(c.totResid)}</div>
                <div class="sum-sub">valor residual na saída</div>
            </div>
        </div>
        ` : ''}

        ${c.gain !== null ? `
        <div class="gain-card">
            <div class="gain-eyebrow">Resultado econômico da transferência</div>
            <div class="gain-row">
                <span class="gl">Receita bruta da venda</span>
                <span class="gv">
                    ${p.saleCurrency!=='BRL'?`${curSym(p.saleCurrency)} ${N(p.saleAmount)} × ${c.saleRate.toFixed(4)} (${esc(c.saleSrc)}) = `:``}
                    R$ ${N(c.saleBRL)}
                </span>
            </div>
            <div class="gain-row">
                <span class="gl">Baixa do ativo intangível</span>
                <span class="gv">(−) R$ ${N(c.totResid)}</span>
            </div>
            <div class="gain-sep"></div>
            <div class="gain-main">
                <span class="gl">${c.gain>=0?'Ganho econômico-financeiro':'Perda econômica'}</span>
                <span class="gv ${c.gain>=0?'gv-pos':'gv-neg'}">${c.gain>=0?'+':''}R$ ${N(c.gain)}</span>
            </div>
        </div>
        ` : (c.exitMonths!==null && hasItems ? `<div style="padding-top:10px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-4);letter-spacing:.06em">Insira o valor de venda para calcular o resultado econômico</div>` : '')}
    </div>`;
}

function hTotalsBand() {
    const active = S.players.filter(p => { const c=calcPlayer(p); return c&&c.totActivated>0; });
    if (active.length === 0) return `<div id="totals-band"></div>`;
    const calcs = active.map(p=>calcPlayer(p));
    const totAct  = calcs.reduce((s,c)=>s+c.totActivated, 0);
    const totAmort = calcs.filter(c=>c.exitMonths!==null).reduce((s,c)=>s+c.totAmort, 0);
    const totResid = calcs.filter(c=>c.exitMonths!==null).reduce((s,c)=>s+c.totResid, 0);
    const totGain  = calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+c.gain, 0);
    const hasExit  = calcs.some(c=>c.exitMonths!==null);
    const hasGain  = calcs.some(c=>c.gain!==null);

    return `
    <div id="totals-band" class="totals-band">
        <div class="tb-item">
            <div class="tb-eyebrow">Total Ativado</div>
            <div class="tb-value">R$ ${N(totAct)}</div>
            <div class="tb-sub">${active.length} atleta${active.length>1?'s':''}</div>
        </div>
        ${hasExit?`
        <div class="tb-item">
            <div class="tb-eyebrow">Total Amortizado</div>
            <div class="tb-value tb-neg">R$ ${N(totAmort)}</div>
            <div class="tb-sub">acumulado até saída</div>
        </div>
        <div class="tb-item">
            <div class="tb-eyebrow">Baixa Total</div>
            <div class="tb-value tb-gold">R$ ${N(totResid)}</div>
            <div class="tb-sub">valor residual</div>
        </div>
        `:`<div class="tb-item"></div><div class="tb-item"></div>`}
        ${hasGain?`
        <div class="tb-item">
            <div class="tb-eyebrow">Ganho Econômico Total</div>
            <div class="tb-value ${totGain>=0?'tb-pos':'tb-neg'}">${totGain>=0?'+':''}R$ ${N(totGain)}</div>
            <div class="tb-sub">receita − baixa</div>
        </div>
        `:`<div class="tb-item"></div>`}
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════════
function bindEvents() {
    document.getElementById('add-player-btn')?.addEventListener('click', () => {
        S.players.push(newPlayer()); saveLocal(); renderAll();
    });

    document.addEventListener('click', e => {
        const t = e.target.closest('[data-action]');
        if (!t) return;
        const action = t.dataset.action;
        const pid = +t.dataset.pid;
        const iid = +t.dataset.iid;

        if (action === 'remove-player') {
            if (S.players.length === 1) {
                S.players = [newPlayer()]; saveLocal(); renderAll(); return;
            }
            S.players = S.players.filter(p=>p.id!==pid);
            saveLocal(); renderAll();
        }
        if (action === 'add-item') {
            const p = S.players.find(x=>x.id===pid);
            if (p) { p.items.push(newItem('')); saveLocal(); renderAll(); }
        }
        if (action === 'remove-item') {
            const p = S.players.find(x=>x.id===pid);
            if (p) {
                p.items = p.items.filter(i=>i.id!==iid);
                if (p.items.length===0) p.items.push(newItem(''));
                saveLocal(); renderAll();
            }
        }
    });

    document.addEventListener('click', e => {
        const t = e.target.closest('[data-field="itemCur"]');
        if (!t) return;
        const pid = +t.dataset.pid, iid = +t.dataset.iid;
        const p = S.players.find(x=>x.id===pid);
        const it = p?.items.find(i=>i.id===iid);
        if (!it) return;
        it.currency = t.dataset.v;
        saveLocal();
        // Re-render just the item row and results
        const row = document.getElementById(`irow-${iid}`);
        if (row) { const tmp=document.createElement('div'); tmp.innerHTML=hItemRow(pid,it); row.replaceWith(tmp.firstElementChild); }
        refreshResults(pid);
        refreshTotals();
    });

    document.addEventListener('click', e => {
        const t = e.target.closest('[data-field="saleCurrency"]');
        if (!t) return;
        const pid = +t.dataset.pid;
        const p = S.players.find(x=>x.id===pid);
        if (!p) return;
        p.saleCurrency = t.dataset.v;
        saveLocal();
        // Update toggle buttons
        document.querySelectorAll(`[data-field="saleCurrency"][data-pid="${pid}"]`).forEach(b=>{
            b.classList.toggle('active', b.dataset.v===p.saleCurrency);
        });
        // Update prefix
        const pfx = document.querySelector(`[data-pid="${pid}"][data-field="saleAmount"]`)?.previousElementSibling;
        if (pfx) pfx.textContent = curSym(p.saleCurrency);
        // Update BRL display
        const brlEl = document.getElementById(`sale-brl-${pid}`);
        if (brlEl) brlEl.textContent = hSaleBRL(p);
        refreshResults(pid);
        refreshTotals();
    });

    document.addEventListener('input', e => {
        const t = e.target;
        const field = t.dataset.field;
        if (!field) return;
        const pid = +t.dataset.pid;
        const iid = t.dataset.iid ? +t.dataset.iid : null;
        const p = S.players.find(x=>x.id===pid);
        if (!p) return;

        if (iid) {
            const it = p.items.find(i=>i.id===iid);
            if (!it) return;
            if (field==='label')  { it.label  = t.value; }
            if (field==='amount') { it.amount = t.value===''?null:parseFloat(t.value); }
        } else {
            if (field==='name')       p.name       = t.value;
            if (field==='start')      p.start      = t.value;
            if (field==='end')        p.end        = t.value;
            if (field==='exit')       p.exit       = t.value;
            if (field==='saleAmount') p.saleAmount = t.value===''?null:parseFloat(t.value);
        }

        saveLocal();

        if (field === 'amount' && iid) {
            // Update the BRL readonly field in the same row without full re-render
            const it = p.items.find(i=>i.id===iid);
            if (it) {
                const {rate} = getRate(it.currency, ym(p.start));
                const brl = (it.amount??0) * rate;
                const row = document.getElementById(`irow-${iid}`);
                const brlInp = row?.querySelector('input[readonly]');
                if (brlInp) brlInp.value = N(brl);
            }
        }

        // Refresh sale BRL label
        if (field==='saleAmount'||field==='exit') {
            const brlEl = document.getElementById(`sale-brl-${pid}`);
            if (brlEl) brlEl.textContent = hSaleBRL(p);
        }

        // Refresh item rows if start date changes (rates change)
        if (field==='start') {
            const container = document.getElementById(`items-${pid}`);
            if (container) container.innerHTML = p.items.map(it=>hItemRow(pid,it)).join('');
        }

        refreshResults(pid);
        refreshTotals();
    });

    document.addEventListener('change', e => {
        const t = e.target;
        const field = t.dataset.field;
        if (!['start','end','exit'].includes(field)) return;
        const pid = +t.dataset.pid;
        const p = S.players.find(x=>x.id===pid);
        if (!p) return;
        p[field] = t.value;
        saveLocal();
        if (field==='start') {
            const container = document.getElementById(`items-${pid}`);
            if (container) container.innerHTML = p.items.map(it=>hItemRow(pid,it)).join('');
        }
        const brlEl = document.getElementById(`sale-brl-${pid}`);
        if (brlEl) brlEl.textContent = hSaleBRL(p);
        refreshResults(pid);
        refreshTotals();
    });
}

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
async function init() {
    if (!loadLocal()) S.players = [newPlayer()];
    renderAll();
    await fetchLivePTAX();
}

init();
