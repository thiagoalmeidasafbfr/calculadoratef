<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora TEF — Glorioso Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── DESIGN TOKENS ── */
        :root {
            --gold:          #be8c4a;
            --gold-soft:     #dcc89a;
            --gold-deep:     #7a6244;
            --gold-tint:     rgba(190,140,74,0.12);
            --gold-ring:     rgba(190,140,74,0.22);
            --ink-primary:   #1a1410;
            --ink-secondary: #3a2e1c;
            --ink-4:         rgba(26,20,16,0.55);
            --cream-page:    #f9f7f2;
            --cream-canvas:  #f5f2eb;
            --cream-card:    #fdfbf6;
            --cream-inset:   #ece6d8;
            --tbl-head:      #e7e5de;
            --on-dark:       #f3eee2;
            --on-dark-dim:   rgba(243,238,226,0.45);
            --on-dark-muted: rgba(243,238,226,0.28);
            --var-pos:       #166534;
            --var-pos-tint:  #dcf0e4;
            --var-neg:       #b91c1c;
            --var-neg-tint:  #fce8e8;
            --warn:          #b88a2a;
            --divider:       rgba(26,20,16,0.08);
            --divider-mid:   rgba(26,20,16,0.13);
            --shadow-hair:   0 1px 0 rgba(40,32,22,0.04);
            --shadow-lift:   0 1px 0 rgba(40,32,22,0.04), 0 4px 12px -8px rgba(40,32,22,0.10);
            --r-xs: 4px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--cream-page);
            color: var(--ink-primary);
            line-height: 1.5;
            min-height: 100vh;
            font-size: 15px;
        }

        /* ── PAGE HERO ── */
        .page-hero {
            background: var(--ink-primary);
            border-radius: var(--r-lg);
            margin: 16px 24px 0;
            padding: clamp(20px, 3vw, 32px) clamp(20px, 3vw, 36px);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .hero-left {}
        .hero-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--on-dark-dim);
            margin-bottom: 8px;
        }
        .hero-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(1.6rem, 4.5vw, 3rem);
            font-weight: 700;
            line-height: 1.08;
            letter-spacing: -0.025em;
            color: var(--on-dark);
        }
        .hero-title em {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 600;
            color: var(--gold);
        }
        .hero-sub {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--on-dark-dim);
            letter-spacing: 0.04em;
            margin-top: 10px;
        }
        .hero-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 4px;
        }
        .hero-btn {
            padding: 9px 18px;
            border-radius: var(--r-pill);
            border: 1px solid rgba(243,238,226,0.18);
            background: rgba(243,238,226,0.07);
            color: var(--on-dark);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s;
        }
        .hero-btn:hover { background: rgba(243,238,226,0.13); }

        /* ── WRAPPER ── */
        .page-body { padding: 20px 24px 32px; }

        /* ── SECTION LABEL ── */
        .section-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
        }

        /* ── CONFIG STRIP ── */
        .config-strip {
            background: var(--cream-card);
            border: 1px solid var(--divider);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-hair);
            padding: 18px 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
        }
        .config-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .config-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold-deep);
            white-space: nowrap;
        }
        .aliq-slider {
            -webkit-appearance: none;
            width: 200px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--gold) 0%, var(--gold) var(--pct, 25%), var(--cream-inset) var(--pct, 25%), var(--cream-inset) 100%);
            outline: none;
            cursor: pointer;
        }
        .aliq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--cream-card);
            border: 2px solid var(--gold);
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(40,32,22,0.18);
        }
        .aliq-slider::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--cream-card);
            border: 2px solid var(--gold);
            cursor: pointer;
        }
        .field-wrap {
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--cream-card);
            border: 1px solid var(--divider-mid);
            border-radius: var(--r-sm);
            overflow: hidden;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-ring);
        }
        .field-prefix {
            padding: 8px 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            color: var(--gold-deep);
            background: var(--cream-inset);
            border-right: 1px solid var(--divider);
            white-space: nowrap;
            letter-spacing: 0.05em;
        }
        .field-inp {
            background: transparent;
            border: none;
            outline: none;
            padding: 8px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-primary);
            min-width: 0;
        }
        .aliq-big {
            font-size: 22px;
            font-weight: 500;
            width: 72px;
            text-align: right;
            color: var(--gold-deep);
        }
        .field-suffix {
            padding: 8px 10px 8px 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--ink-4);
        }
        .config-divider {
            width: 1px;
            height: 32px;
            background: var(--divider);
            flex-shrink: 0;
        }
        .config-fx { margin-left: auto; }

        /* ── PLAYER GRID ── */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 20px;
            align-items: start;
        }

        /* ── PLAYER CARD ── */
        .player-card {
            background: var(--cream-card);
            border: 1px solid var(--divider);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-hair);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.18s;
        }
        .player-card:hover { box-shadow: var(--shadow-lift); }

        .player-head {
            background: var(--ink-primary);
            padding: 12px 14px 11px;
        }
        .player-num {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--on-dark-muted);
            margin-bottom: 6px;
        }
        .player-name-inp {
            width: 100%;
            background: rgba(243,238,226,0.08);
            border: 1px solid rgba(243,238,226,0.14);
            border-radius: var(--r-xs);
            padding: 7px 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--on-dark);
            outline: none;
            transition: border-color 0.15s, background 0.15s;
        }
        .player-name-inp:focus {
            border-color: var(--gold);
            background: rgba(243,238,226,0.13);
        }
        .player-name-inp::placeholder { color: var(--on-dark-muted); }

        .player-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }

        /* value field */
        .f-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold-deep);
            display: block;
            margin-bottom: 5px;
        }
        .gross-field { margin-bottom: 14px; }
        .gross-field .field-inp { font-size: 15px; font-weight: 500; width: 100%; }

        /* deductions */
        .ded-block {
            border-top: 1px solid var(--divider);
            padding-top: 12px;
            margin-bottom: 14px;
        }
        .ded-block-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-4);
            margin-bottom: 10px;
        }
        .ded-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 7px;
        }
        .ded-chk {
            width: 14px; height: 14px;
            accent-color: var(--gold);
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
        }
        .ded-name {
            font-size: 11px;
            color: var(--ink-secondary);
            cursor: help;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .ded-row.off .ded-name { color: var(--ink-4); }
        .ded-mode-toggle {
            display: flex;
            background: var(--cream-inset);
            border: 1px solid var(--divider);
            border-radius: var(--r-xs);
            overflow: hidden;
            flex-shrink: 0;
        }
        .ded-mode-btn {
            padding: 3px 7px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--ink-4);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            line-height: 1.4;
        }
        .ded-mode-btn.active {
            background: var(--ink-primary);
            color: var(--gold-soft);
        }
        .ded-row.off .ded-mode-toggle { opacity: 0.30; pointer-events: none; }
        .ded-value-wrap {
            display: flex;
            align-items: center;
            background: var(--cream-canvas);
            border: 1px solid var(--divider);
            border-radius: var(--r-xs);
            overflow: hidden;
            transition: border-color 0.15s;
            flex-shrink: 0;
        }
        .ded-value-wrap:focus-within { border-color: var(--gold); }
        .ded-row.off .ded-value-wrap { opacity: 0.30; pointer-events: none; }
        .ded-prefix {
            padding: 3px 5px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            color: var(--gold-deep);
            background: var(--cream-inset);
            border-right: 1px solid var(--divider);
        }
        .ded-value-inp {
            background: transparent;
            border: none;
            outline: none;
            padding: 3px 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 400;
            color: var(--ink-primary);
            text-align: right;
            width: 68px;
        }

        /* Results */
        .results-block { border-top: 1px solid var(--divider); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }

        /* value summary lines */
        .vsummary { margin-bottom: 4px; }
        .vrow {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .vrow .vl { color: var(--ink-4); }
        .vrow .vv {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
        }
        .vrow.ded-line .vl { font-size: 11px; color: var(--ink-4); padding-left: 10px; }
        .vrow.ded-line .vv { font-size: 11px; color: var(--var-neg); }
        .v-gross { color: var(--warn); }
        .v-ded   { color: var(--var-neg); }
        .v-net   { color: var(--var-pos); font-size: 13px !important; }
        .vsep { border: none; border-top: 1px dashed var(--divider); margin: 7px 0; }

        /* scenario cards */
        .scard {
            border-radius: var(--r-sm);
            padding: 11px 12px;
        }
        .scard-c1   { background: var(--var-neg-tint); border: 1px solid rgba(185,28,28,0.14); }
        .scard-c2   { background: var(--var-pos-tint); border: 1px solid rgba(22,101,52,0.14); }
        .scard-sav  { background: var(--gold-tint);    border: 1px solid rgba(190,140,74,0.22); }

        .sc-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 8.5px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .sc-eyebrow-c1  { color: var(--var-neg); }
        .sc-eyebrow-c2  { color: var(--var-pos); }
        .sc-eyebrow-sav { color: var(--gold-deep); }

        .sc-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11.5px;
            margin-bottom: 4px;
        }
        .sc-line .sl { color: var(--ink-4); }
        .sc-line .sv {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            font-weight: 400;
            color: var(--ink-secondary);
        }
        .sc-sep { border: none; border-top: 1px solid rgba(26,20,16,0.07); margin: 6px 0; }
        .sc-line.main .sl { font-weight: 600; color: var(--ink-secondary); font-size: 12px; }
        .sc-line.main .sv { font-size: 13px; font-weight: 500; }
        .sv-c1  { color: var(--var-neg) !important; }
        .sv-c2  { color: var(--var-pos) !important; }
        .sv-sav { color: var(--gold-deep) !important; font-size: 14px !important; font-weight: 600 !important; }

        .player-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 12px;
            font-size: 12px;
            color: var(--ink-4);
            text-align: center;
            font-style: italic;
        }

        /* ── TOTALS BAND ── */
        .totals-band {
            background: var(--ink-primary);
            border-radius: var(--r-lg);
            padding: 20px 28px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0;
        }
        .tb-item {
            padding: 0 20px;
            text-align: center;
        }
        .tb-item + .tb-item { border-left: 1px solid rgba(243,238,226,0.08); }
        .tb-item:first-child { padding-left: 0; text-align: left; }
        .tb-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 8.5px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--on-dark-muted);
            margin-bottom: 6px;
        }
        .tb-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 500;
            color: var(--on-dark);
            line-height: 1.1;
        }
        .tb-sub {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            color: var(--on-dark-muted);
            margin-top: 4px;
        }
        .tb-value-neg  { color: #f9a0a0; }
        .tb-value-pos  { color: #86efac; }
        .tb-value-gold { color: var(--gold-soft); }

        /* ── SUMMARY TABLE ── */
        .summary-section {
            background: var(--cream-card);
            border: 1px solid var(--divider);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-hair);
            padding: 20px 24px;
            margin-bottom: 24px;
            overflow-x: auto;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }
        .summary-table th {
            padding: 9px 14px;
            background: var(--tbl-head);
            text-align: right;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 8.5px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gold-deep);
            border-bottom: 2px solid var(--divider-mid);
            white-space: nowrap;
        }
        .summary-table th:first-child { text-align: left; border-radius: var(--r-xs) 0 0 0; }
        .summary-table th:last-child  { border-radius: 0 var(--r-xs) 0 0; }
        .summary-table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--divider);
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--ink-secondary);
            white-space: nowrap;
        }
        .summary-table td:first-child {
            text-align: left;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-primary);
        }
        .summary-table tr:last-child td { border-bottom: none; }
        .summary-table tbody tr:hover td { background: var(--cream-inset); }
        .summary-table .total-row td {
            background: var(--tbl-head);
            border-top: 2px solid var(--divider-mid);
            font-weight: 500;
            color: var(--ink-primary);
        }
        .summary-table .total-row td:first-child {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold-deep);
        }
        .td-neg  { color: var(--var-neg) !important; }
        .td-pos  { color: var(--var-pos) !important; }
        .td-gold { color: var(--gold-deep) !important; font-weight: 600 !important; }
        .td-warn { color: var(--warn) !important; }

        /* chip */
        .chip {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: var(--r-xs);
        }
        .chip-pos { background: var(--var-pos-tint); color: var(--var-pos); }
        .chip-neg { background: var(--var-neg-tint); color: var(--var-neg); }
        .chip-gold { background: var(--gold-tint); color: var(--gold-deep); }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            padding: 20px 24px;
            font-size: 11.5px;
            color: var(--ink-4);
            border-top: 1px solid var(--divider);
        }

        /* ── CURRENCY TOGGLE ── */
        .cur-toggle {
            display: flex;
            background: rgba(243,238,226,0.08);
            border: 1px solid rgba(243,238,226,0.14);
            border-radius: var(--r-xs);
            overflow: hidden;
            margin-top: 8px;
        }
        .cur-btn {
            flex: 1;
            padding: 5px 0;
            border: none;
            background: transparent;
            color: rgba(243,238,226,0.4);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.15s;
        }
        .cur-btn.active {
            background: rgba(243,238,226,0.12);
            color: var(--on-dark);
        }

        /* ── NOTE / COMMENT ── */
        .ded-note-btn {
            width: 18px; height: 18px;
            border: none; background: transparent;
            cursor: pointer; padding: 0;
            color: var(--ink-4);
            font-size: 11px;
            border-radius: 3px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.15s;
        }
        .ded-note-btn:hover { color: var(--gold); }
        .ded-note-btn.has-note { color: var(--gold-deep); }
        .ded-comment-area {
            display: none;
            padding: 5px 0 2px 21px;
        }
        .ded-comment-area.open { display: block; }
        .ded-comment-ta {
            width: 100%; height: 48px;
            background: var(--cream-canvas);
            border: 1px solid var(--divider);
            border-radius: var(--r-xs);
            padding: 5px 8px;
            font-family: 'Inter', sans-serif;
            font-size: 11px; line-height: 1.4;
            color: var(--ink-secondary);
            resize: none; outline: none;
        }
        .ded-comment-ta:focus { border-color: var(--gold); }

        /* ── PTAX chip ── */
        .ptax-chip {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px;
            background: var(--cream-canvas);
            border: 1px solid var(--divider);
            border-radius: var(--r-pill);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px; color: var(--gold-deep);
        }
        .ptax-chip strong { font-weight: 600; color: var(--ink-primary); }
        .ptax-refresh {
            border: none; background: transparent; cursor: pointer;

// ================================================================
// PTAX (EUR/BRL — Banco Central do Brasil)
// ================================================================
async function fetchPTAX() {
    const tryDate = async (d) => {
        const mm   = String(d.getMonth() + 1).padStart(2, '0');
        const dd   = String(d.getDate()).padStart(2, '0');
        const yyyy = d.getFullYear();
        const dateStr = `${mm}-${dd}-${yyyy}`;
        const url = `https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoMoedaDia(moeda=@moeda,dataCotacao=@dataCotacao)?@moeda='EUR'&@dataCotacao='${dateStr}'&$top=1&$format=json&$select=cotacaoVenda`;
        const res  = await fetch(url);
        const json = await res.json();
        if (json.value && json.value.length > 0) {
            return { rate: json.value[0].cotacaoVenda, dateStr: `${dd}/${mm}/${yyyy}` };
        }
        return null;
    };
    const today = new Date();
    for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        try {
            const result = await tryDate(d);
            if (result) {
                S.ptax     = result.rate;
                S.ptaxDate = result.dateStr;
                updatePTAXChip();
                return;
            }
        } catch(e) { /* try previous day */ }
    }
}

function updatePTAXChip() {
    const chip = document.getElementById('ptax-chip');

    if (S.ptax) {

            <button class="ptax-refresh" title="Atualizar PTAX" onclick="fetchPTAX()">↻</button>

    } else {
        chip.innerHTML = `<span>PTAX EUR/BRL</span><span style="color:var(--ink-4)">—</span><button class="ptax-refresh" title="Atualizar PTAX" onclick="fetchPTAX()">↻</button>`;
    }
}

            solidarity:    { on: false, mode: 'pct', rate: null, value: null, comment: '', label: 'Solidariedade FIFA', tip: 'Art. 21 RSTP — distribuído aos clubes formadores' },
            agenteBuyer:   { on: false, mode: 'pct', rate: null, value: null, comment: '', label: 'Agente Comprador',   tip: 'Comissão do agente do clube comprador' },
            outros1:       { on: false, mode: 'pct', rate: null, value: null, comment: '', label: 'Outras taxas 1',     tip: 'Deduções adicionais' },
            outros2:       { on: false, mode: 'pct', rate: null, value: null, comment: '', label: 'Outras taxas 2',     tip: 'Deduções adicionais' },
        }

// ================================================================
// CALC
// ================================================================
function calcPlayer(p) {
    const grossLocal = p.gross ?? 0;
    const ptax       = S.ptax || 1;
    const grossBRL   = p.currency === 'EUR' ? grossLocal * ptax : grossLocal;

    let totalDedLocal = 0;
    const dedBreak = {};
    for (const [k, d] of Object.entries(p.deds)) {
        let vLocal = 0;
        if (d.on) {
            vLocal = d.mode === 'pct'
                ? grossLocal * (d.rate  ?? 0) / 100
                : (d.value ?? 0);
        }
        dedBreak[k]    = vLocal;
        totalDedLocal += vLocal;
    }

    const netLocal    = grossLocal - totalDedLocal;
    const totalDedBRL = p.currency === 'EUR' ? totalDedLocal * ptax : totalDedLocal;
    const netBRL      = grossBRL - totalDedBRL;
    const taxC1       = grossBRL * S.aliq / 100;
    const taxC2       = netBRL   * S.aliq / 100;

    return {
        grossLocal, grossBRL,
        netLocal,   netBRL,
        totalDedLocal, totalDedBRL,
        dedBreak,
        taxC1, taxC2,
        savings:    taxC1 - taxC2,
        netFinalC1: grossBRL - taxC1,
        netFinalC2: netBRL   - taxC2,
    };
}

// ================================================================

let _fk = null, _fsel = [0, 0];
function saveFocus() {
    const el = document.activeElement;
    if (!el || el === document.body) { _fk = null; return; }
    _fk = JSON.stringify(el.dataset);
    try { _fsel = [el.selectionStart, el.selectionEnd]; } catch(e) { _fsel = [0,0]; }
}
function restoreFocus() {
    if (!_fk) return;
    const ds = JSON.parse(_fk);
    const parts = Object.entries(ds).map(([k,v]) => `[data-${k}="${CSS.escape(v)}"]`).join('');
    if (!parts) return;
    const el = document.querySelector(parts);
    if (el) { el.focus(); try { el.setSelectionRange(_fsel[0], _fsel[1]); } catch(e){} }
}

// ── Totals band ──
function hTotalsBand(active) {
    const cs  = active.map(p => calcPlayer(p));

    const ded = cs.reduce((s,c) => s+c.totalDedBRL,  0);
    const net = cs.reduce((s,c) => s+c.netBRL,       0);
    const t1  = cs.reduce((s,c) => s+c.taxC1,        0);
    const t2  = cs.reduce((s,c) => s+c.taxC2,        0);
    const sav = cs.reduce((s,c) => s+c.savings,      0);
    return `
        <div class="totals-band">
            <div class="tb-item">
                <div class="tb-eyebrow">Total Bruto</div>
                <div class="tb-value">R$ ${N(g)}</div>
                <div class="tb-sub">${active.length} atleta${active.length>1?'s':''}</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Total Deduções</div>
                <div class="tb-value tb-value-neg">R$ ${N(ded)}</div>
                <div class="tb-sub">${g>0?P(ded/g*100):'—'} do bruto</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Total Líquido</div>
                <div class="tb-value">R$ ${N(net)}</div>
                <div class="tb-sub">${g>0?P(net/g*100):'—'} do bruto</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Tributos — C1 Bruto</div>
                <div class="tb-value tb-value-neg">R$ ${N(t1)}</div>
                <div class="tb-sub">Alíq. ${P(S.aliq)} s/ bruto</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Tributos — C2 Líquido</div>
                <div class="tb-value tb-value-pos">R$ ${N(t2)}</div>
                <div class="tb-sub">Alíq. ${P(S.aliq)} s/ líquido</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Economia Total</div>
                <div class="tb-value tb-value-gold">R$ ${N(sav)}</div>
                <div class="tb-sub">${t1>0?P(sav/t1*100):'—'} de redução</div>
            </div>
        </div>
    `;
}

// ── Summary table ──
function hSummary(active) {
    const rows = active.map(p => {
        const c = calcPlayer(p);
        const savSign = c.savings >= 0 ? '+' : '';
        return `
            <tr>
                <td>${esc(p.name)}</td>
                <td class="td-warn">R$ ${N(c.grossBRL)}</td>
                <td class="td-neg">−R$ ${N(c.totalDedBRL)}</td>
                <td>R$ ${N(c.netBRL)}</td>
                <td class="td-neg">R$ ${N(c.taxC1)}</td>
                <td class="td-neg">${P(S.aliq)}</td>
                <td class="td-pos">R$ ${N(c.taxC2)}</td>
                <td class="td-pos">${P(S.aliq)}</td>
                <td class="td-gold">${savSign}R$ ${N(c.savings)}</td>
            </tr>
        `;
    }).join('');

    const cs  = active.map(p => calcPlayer(p));
    const g   = cs.reduce((s,c) => s+c.grossBRL,    0);
    const ded = cs.reduce((s,c) => s+c.totalDedBRL,  0);
    const net = cs.reduce((s,c) => s+c.netBRL,       0);
    const t1  = cs.reduce((s,c) => s+c.taxC1,        0);
    const t2  = cs.reduce((s,c) => s+c.taxC2,        0);
    const sav = cs.reduce((s,c) => s+c.savings,      0);

    return `
        <div class="summary-section">
            <div class="section-eyebrow">Resumo Comparativo</div>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th style="text-align:left">Atleta</th>
                        <th>Valor Bruto (R$)</th>
                        <th>Deduções (R$)</th>
                        <th>Valor Líquido (R$)</th>
                        <th>Tributo C1</th>
                        <th>Alíq. C1</th>
                        <th>Tributo C2</th>
                        <th>Alíq. C2</th>
                        <th>Economia (R$)</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows}
                    <tr class="total-row">
                        <td>Total</td>
                        <td class="td-warn">R$ ${N(g)}</td>
                        <td class="td-neg">−R$ ${N(ded)}</td>
                        <td>R$ ${N(net)}</td>
                        <td class="td-neg">R$ ${N(t1)}</td>
                        <td class="td-neg">${P(S.aliq)}</td>
                        <td class="td-pos">R$ ${N(t2)}</td>
                        <td class="td-pos">${P(S.aliq)}</td>
                        <td class="td-gold">+R$ ${N(sav)}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    `;
}

// ================================================================
// EVENTS
// ================================================================
function bindEvents() {
    const slider = document.getElementById('aliq-slider');
    const inp    = document.getElementById('aliq-inp');

    if (slider) slider.addEventListener('input', e => {
        S.aliq = parseFloat(e.target.value) || 0;
        if (inp) inp.value = S.aliq;
        updateSlider(slider);
        renderResults(); saveState();
    });
    if (inp) inp.addEventListener('input', e => {
        const raw = e.target.value;
        S.aliq = raw === '' ? 0 : (parseFloat(raw) || 0);
        if (slider) { slider.value = S.aliq; updateSlider(slider); }
        renderResults(); saveState();
    });

    document.querySelectorAll('[data-field="name"]').forEach(el => {
        el.addEventListener('input', e => { S.players[+e.target.dataset.pi].name = e.target.value; });
        el.addEventListener('blur', () => { render(); saveState(); });
    });

    document.querySelectorAll('[data-field="gross"]').forEach(el => {
        el.addEventListener('input', e => {
            const raw = e.target.value;
            S.players[+e.target.dataset.pi].gross = raw === '' ? null : parseFloat(raw);
            renderResults(); saveState();
        });
    });

    document.querySelectorAll('[data-field="playerCurrency"]').forEach(el => {
        el.addEventListener('click', e => {
            S.players[+e.target.dataset.pi].currency = e.target.dataset.v;
            render(); saveState();
        });
    });

    document.querySelectorAll('[data-field="dedOn"]').forEach(el => {
        el.addEventListener('change', e => {
            S.players[+e.target.dataset.pi].deds[e.target.dataset.dk].on = e.target.checked;
            render(); saveState();
        });
    });

    document.querySelectorAll('[data-field="dedMode"]').forEach(el => {
        el.addEventListener('click', e => {
            S.players[+e.target.dataset.pi].deds[e.target.dataset.dk].mode = e.target.dataset.v;
            render(); saveState();
        });
    });

    document.querySelectorAll('[data-field="dedRate"]').forEach(el => {
        el.addEventListener('input', e => {
            const raw = e.target.value;
            S.players[+e.target.dataset.pi].deds[e.target.dataset.dk].rate = raw === '' ? null : parseFloat(raw);
            renderResults(); saveState();
        });
    });

    document.querySelectorAll('[data-field="dedValue"]').forEach(el => {
        el.addEventListener('input', e => {
            const raw = e.target.value;
            S.players[+e.target.dataset.pi].deds[e.target.dataset.dk].value = raw === '' ? null : parseFloat(raw);
            renderResults(); saveState();
        });
    });

    document.querySelectorAll('[data-field="dedNoteToggle"]').forEach(el => {
        el.addEventListener('click', e => {
            const pi = e.currentTarget.dataset.pi;
            const dk = e.currentTarget.dataset.dk;
            const area = document.getElementById(`ded-note-${pi}-${dk}`);
            if (area) {
                area.classList.toggle('open');
                if (area.classList.contains('open')) area.querySelector('textarea')?.focus();
            }
        });
    });

    document.querySelectorAll('[data-field="dedComment"]').forEach(el => {
        el.addEventListener('input', e => {
            const pi = +e.target.dataset.pi;
            const dk = e.target.dataset.dk;
            S.players[pi].deds[dk].comment = e.target.value;
            const btn = document.querySelector(`[data-field="dedNoteToggle"][data-pi="${pi}"][data-dk="${dk}"]`);
            if (btn) {
                btn.classList.toggle('has-note', !!e.target.value);
                btn.title = e.target.value ? e.target.value : 'Adicionar comentário';
            }
            saveState();
        });
    });

    // JS tooltip for note buttons with comments
    const tooltip = document.getElementById('_tooltip');
    if (tooltip) {
        document.querySelectorAll('.ded-note-btn.has-note').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                const pi = +btn.dataset.pi;
                const dk = btn.dataset.dk;
                const comment = S.players[pi]?.deds[dk]?.comment;
                if (!comment) return;
                tooltip.textContent = comment;
                tooltip.style.display = 'block';
            });
            btn.addEventListener('mousemove', e => {
                tooltip.style.left = (e.clientX + 14) + 'px';
                tooltip.style.top  = (e.clientY - 8)  + 'px';
            });
            btn.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });
        });
    }
}

function updateSlider(slider) {
    const pct = ((+slider.value - +slider.min) / (+slider.max - +slider.min) * 100).toFixed(1);
    slider.style.setProperty('--pct', pct + '%');
}

// ================================================================
// INIT
// ================================================================
async function init() {
    initDB();
    const tasks = [fetchPTAX()];
    if (_db) {
        setStatus('loading');
        tasks.push(loadState());
    } else {
        setStatus('offline');
    }
    await Promise.all(tasks);
    render();
}

init();
</script>
