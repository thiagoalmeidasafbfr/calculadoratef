<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora TEF — Tributação em Transferências de Atletas</title>
    <style>
        :root {
            --green-dark: #0b3d2e;
            --green: #155c42;
            --green-mid: #1e7a57;
            --accent: #4ade80;
            --bg: #090e18;
            --surface: #101826;
            --surface2: #192233;
            --surface3: #243040;
            --surface4: #2e3c50;
            --text: #f1f5f9;
            --text2: #cbd5e1;
            --text3: #94a3b8;
            --text4: #64748b;
            --border: #1e3048;
            --border2: #2a3f56;
            --red: #f87171;
            --orange: #fb923c;
            --purple: #c4b5fd;
            --radius: 10px;
            --radius-sm: 7px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
            padding: 18px 28px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-icon { font-size: 36px; line-height: 1; }
        .header h1 { font-size: 20px; font-weight: 700; color: #fff; }
        .header-sub { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 2px; }

        /* ALIQUOTA BAR */
        .aliq-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
        }
        .aliq-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            white-space: nowrap;
        }
        .aliq-control {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .aliq-slider {
            -webkit-appearance: none;
            width: 220px;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--pct, 50%), var(--surface3) var(--pct, 50%), var(--surface3) 100%);
            outline: none;
            cursor: pointer;
        }
        .aliq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 3px solid var(--bg);
            box-shadow: 0 0 0 2px var(--accent);
        }
        .aliq-inp-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            padding: 7px 12px;
        }
        .aliq-inp {
            background: transparent;
            border: none;
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            width: 70px;
            text-align: right;
            outline: none;
        }
        .aliq-unit { font-size: 18px; font-weight: 700; color: var(--accent); }
        .aliq-hint { font-size: 11px; color: var(--text4); }

        /* FX */
        .fx-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .fx-label { font-size: 12px; color: var(--text3); white-space: nowrap; }
        .fx-inp {
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            width: 90px;
            text-align: right;
            outline: none;
        }
        .fx-inp:focus { border-color: var(--accent); }

        /* LAYOUT */
        .container { max-width: 1700px; margin: 0 auto; padding: 20px 24px; }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .section-title::before {
            content: '';
            display: block;
            width: 3px; height: 13px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* PLAYER GRID */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .player-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .player-head {
            background: linear-gradient(135deg, var(--green-dark), var(--green));
            padding: 12px 14px;
            border-bottom: 2px solid var(--accent);
        }
        .player-num { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.4); letter-spacing: 0.8px; margin-bottom: 5px; text-transform: uppercase; }
        .player-name-inp {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            width: 100%;
            outline: none;
        }
        .player-name-inp:focus { border-color: var(--accent); background: rgba(255,255,255,0.15); }
        .player-name-inp::placeholder { color: rgba(255,255,255,0.25); }

        .player-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }

        /* Value input */
        .field-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .money-wrap {
            display: flex;
            align-items: center;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-bottom: 14px;
        }
        .money-prefix {
            padding: 9px 11px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            background: var(--surface3);
            border-right: 1px solid var(--border2);
        }
        .money-inp {
            flex: 1;
            background: transparent;
            border: none;
            padding: 9px 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            min-width: 0;
            outline: none;
        }
        .money-wrap:focus-within { border-color: var(--accent); }

        /* Deductions */
        .ded-section { border-top: 1px solid var(--border); padding-top: 12px; margin-bottom: 14px; }
        .ded-title { font-size: 10px; font-weight: 700; color: var(--text4); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }

        .ded-row {
            display: grid;
            grid-template-columns: 16px 1fr 60px 14px;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }
        .ded-check { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; margin: 0; }
        .ded-name { font-size: 11px; color: var(--text2); }
        .ded-row.off .ded-name { color: var(--text4); }
        .ded-inp {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            text-align: right;
            width: 100%;
            outline: none;
        }
        .ded-inp:focus { border-color: var(--accent); }
        .ded-row.off .ded-inp { opacity: 0.3; pointer-events: none; }
        .ded-unit { font-size: 11px; color: var(--text4); }

        /* Results */
        .results { border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }

        /* value summary */
        .val-lines { margin-bottom: 4px; }
        .vl {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            margin-bottom: 4px;
        }
        .vl .ll { color: var(--text3); }
        .vl .lv { font-weight: 700; }
        .sep { border: none; border-top: 1px dashed var(--border2); margin: 8px 0; }

        /* scenario boxes */
        .sbox {
            border-radius: var(--radius-sm);
            padding: 11px 12px;
        }
        .sbox-c1 { background: rgba(251,146,60,0.07); border: 1px solid rgba(251,146,60,0.2); }
        .sbox-c2 { background: rgba(74,222,128,0.06); border: 1px solid rgba(74,222,128,0.2); }
        .sbox-diff { background: rgba(196,181,253,0.05); border: 1px solid rgba(196,181,253,0.2); }

        .sc-title {
            font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 8px;
        }
        .sc-title-c1 { color: var(--orange); }
        .sc-title-c2 { color: var(--accent); }
        .sc-title-diff { color: var(--purple); }

        .sl {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .sl .l { color: var(--text3); }
        .sl .v { font-weight: 600; color: var(--text2); }
        .sl.big .l { font-weight: 700; color: var(--text); font-size: 12px; }
        .sl.big .v { font-size: 13px; }
        .v-c1 { color: var(--orange) !important; }
        .v-c2 { color: var(--accent) !important; }
        .v-diff { color: var(--purple) !important; font-size: 14px !important; }
        .sc-sep { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 6px 0; }

        .empty { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 12px; font-size: 11px; color: var(--text4); text-align: center; }

        /* TOTALS BAR */
        .totals-bar {
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
            border: 1px solid rgba(74,222,128,0.25);
            border-radius: var(--radius);
            padding: 18px 24px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
        }
        .tb { text-align: center; }
        .tb + .tb { border-left: 1px solid rgba(255,255,255,0.08); }
        .tb-l { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; }
        .tb-v { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.1; }
        .tb-s { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 3px; }
        .tb-v-orange { color: var(--orange); }
        .tb-v-green { color: var(--accent); }
        .tb-v-purple { color: #c4b5fd; }

        /* SUMMARY TABLE */
        .summary-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
            overflow-x: auto;
        }
        .summary-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 16px; }
        .summary-table th {
            padding: 9px 14px;
            text-align: right;
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text3);
            background: var(--surface2);
            border-bottom: 2px solid var(--border2);
            white-space: nowrap;
        }
        .summary-table th:first-child { text-align: left; }
        .summary-table td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            text-align: right;
            color: var(--text2);
            white-space: nowrap;
        }
        .summary-table td:first-child { text-align: left; font-weight: 600; color: var(--text); }
        .summary-table tr:last-child td { border-bottom: none; }
        .summary-table tbody tr:hover td { background: var(--surface2); }
        .summary-table .total-row td {
            font-weight: 700; color: var(--text);
            background: var(--surface2);
            border-top: 2px solid rgba(74,222,128,0.35);
        }

        .footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text4); border-top: 1px solid var(--border); }

        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--surface4); border-radius: 3px; }

        @media (max-width: 1400px) { .players-grid { grid-template-columns: repeat(3, 1fr); } .totals-bar { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px)  { .players-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px)  { .players-grid { grid-template-columns: 1fr; } .totals-bar { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<div id="app"></div>

<script>
// ================================================================
// STATE
// ================================================================
const S = {
    aliq: 5,       // % — alíquota global
    fxRate: 5.80,  // EUR → BRL
    players: Array.from({ length: 5 }, (_, i) => ({
        name: `Jogador ${i + 1}`,
        gross: 0,
        deds: {
            intermediacao: { on: false, rate: 5,  label: 'Intermediação',      tip: 'Comissão do agente/intermediário' },
            sellon:        { on: false, rate: 0,  label: 'Sell-on Fee',        tip: 'Cláusula de revenda — % para o clube anterior' },
            solidarity:    { on: false, rate: 5,  label: 'Solidariedade FIFA', tip: 'Art. 21 RSTP — 5% distribuído aos clubes formadores' },
            agenteBuyer:   { on: false, rate: 0,  label: 'Agente Comprador',   tip: 'Comissão do agente do clube comprador' },
            outros1:       { on: false, rate: 0,  label: 'Outras taxas 1',     tip: 'Deduções adicionais' },
            outros2:       { on: false, rate: 0,  label: 'Outras taxas 2',     tip: 'Deduções adicionais' },
        }
    }))
};

// ================================================================
// CALC
// ================================================================
function calcPlayer(p) {
    const gross = p.gross || 0;
    let totalDed = 0;
    const dedBreak = {};
    for (const [k, d] of Object.entries(p.deds)) {
        const v = d.on ? gross * d.rate / 100 : 0;
        dedBreak[k] = v;
        totalDed += v;
    }
    const net = gross - totalDed;
    const taxC1 = gross * S.aliq / 100;
    const taxC2 = net   * S.aliq / 100;
    return {
        gross, net, totalDed, dedBreak,
        taxC1, taxC2,
        savings: taxC1 - taxC2,
        netFinalC1: gross - taxC1,
        netFinalC2: net   - taxC2,
    };
}

// ================================================================
// FORMAT
// ================================================================
const N  = v => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v || 0);
const P  = v => (v || 0).toFixed(2).replace('.', ',') + '%';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ================================================================
// FOCUS
// ================================================================
let _fk = null, _fsel = [0,0];
function saveFocus() {
    const el = document.activeElement;
    if (!el || el === document.body) { _fk = null; return; }
    _fk = JSON.stringify(el.dataset);
    try { _fsel = [el.selectionStart, el.selectionEnd]; } catch(e) { _fsel = [0,0]; }
}
function restoreFocus() {
    if (!_fk) return;
    const ds = JSON.parse(_fk);
    const sel = Object.entries(ds).map(([k,v]) => `[data-${k}="${CSS.escape(v)}"]`).join('');
    if (!sel) return;
    const el = document.querySelector(sel);
    if (el) { el.focus(); try { el.setSelectionRange(_fsel[0], _fsel[1]); } catch(e){} }
}

// ================================================================
// RENDER
// ================================================================
function render() {
    saveFocus();
    document.getElementById('app').innerHTML = buildHTML();
    bindEvents();
    restoreFocus();
}

function buildHTML() {
    const active = S.players.filter(p => p.gross > 0);
    return `
        ${hHeader()}
        ${hAliqBar()}
        <div class="container">
            <div class="section-title">Simulação por Atleta</div>
            <div class="players-grid">${S.players.map((p,i) => hCard(p,i)).join('')}</div>
            ${active.length ? hTotalsBar(active) : ''}
            ${active.length ? hSummary(active) : ''}
        </div>
        <div class="footer">Calculadora TEF · Para fins de planejamento tributário · Consulte um especialista fiscal antes de tomar decisões</div>
    `;
}

function hHeader() {
    return `
        <header class="header">
            <div class="header-left">
                <div class="header-icon">⚽</div>
                <div>
                    <h1>Calculadora TEF</h1>
                    <div class="header-sub">Tributação Específica em Transferências de Atletas de Futebol</div>
                </div>
            </div>
        </header>
    `;
}

function hAliqBar() {
    const min = 0, max = 20;
    const pct = ((S.aliq - min) / (max - min) * 100).toFixed(1);
    return `
        <div class="aliq-bar">
            <span class="aliq-label">Alíquota</span>
            <div class="aliq-control">
                <input class="aliq-slider" type="range" id="aliq-slider"
                    min="${min}" max="${max}" step="0.1" value="${S.aliq}"
                    style="--pct:${pct}%">
                <div class="aliq-inp-wrap">
                    <input class="aliq-inp" type="number" id="aliq-inp"
                        min="${min}" max="${max}" step="0.1" value="${S.aliq}">
                    <span class="aliq-unit">%</span>
                </div>
            </div>
            <span class="aliq-hint">Ajuste a alíquota para calcular os dois cenários</span>
            <div class="fx-wrap">
                <span class="fx-label">💱 EUR → BRL</span>
                <input class="fx-inp" type="number" id="fx-inp" value="${S.fxRate}" min="0" step="0.01">
                <span style="font-size:12px;color:var(--text4)">R$/€</span>
            </div>
        </div>
    `;
}

function hCard(p, pi) {
    const c = calcPlayer(p);
    return `
        <div class="player-card">
            <div class="player-head">
                <div class="player-num">Atleta ${pi + 1}</div>
                <input class="player-name-inp" type="text" data-pi="${pi}" data-field="name"
                    value="${esc(p.name)}" placeholder="Nome do atleta">
            </div>
            <div class="player-body">
                <div class="field-label">Valor de Transferência (Bruto)</div>
                <div class="money-wrap">
                    <span class="money-prefix">€</span>
                    <input class="money-inp" type="number" data-pi="${pi}" data-field="gross"
                        value="${p.gross || ''}" placeholder="0,00" min="0" step="500000">
                </div>

                <div class="ded-section">
                    <div class="ded-title">Deduções</div>
                    ${Object.entries(p.deds).map(([dk, d]) => `
                        <div class="ded-row${d.on ? '' : ' off'}">
                            <input class="ded-check" type="checkbox"
                                data-pi="${pi}" data-dk="${dk}" data-field="dedOn" ${d.on?'checked':''}>
                            <span class="ded-name" title="${esc(d.tip)}">${esc(d.label)}</span>
                            <input class="ded-inp" type="number"
                                data-pi="${pi}" data-dk="${dk}" data-field="dedRate"
                                value="${d.rate}" min="0" max="100" step="0.1" ${d.on?'':'tabindex="-1"'}>
                            <span class="ded-unit">%</span>
                        </div>
                    `).join('')}
                </div>

                ${p.gross > 0 ? hResults(c, p) : `<div class="empty">Insira o valor de transferência para calcular</div>`}
            </div>
        </div>
    `;
}

function hResults(c, p) {
    const { gross, net, totalDed, dedBreak, taxC1, taxC2, savings, netFinalC1, netFinalC2 } = c;
    const activeDeds = Object.entries(p.deds).filter(([k,d]) => d.on && dedBreak[k] > 0);

    return `
        <div class="results">
            <!-- Resumo dos valores -->
            <div class="val-lines">
                <div class="vl"><span class="ll">Valor Bruto</span><span class="lv" style="color:var(--orange)">€ ${N(gross)}</span></div>
                ${activeDeds.map(([k,d]) => `
                    <div class="vl" style="font-size:10.5px;padding-left:8px;">
                        <span class="ll" style="color:var(--text4)">(−) ${esc(d.label)}</span>
                        <span class="lv" style="color:var(--red);font-size:11px;font-weight:600">€ ${N(dedBreak[k])}</span>
                    </div>
                `).join('')}
                ${activeDeds.length ? `<div class="vl"><span class="ll">Total Deduções</span><span class="lv" style="color:var(--red)">€ ${N(totalDed)}</span></div>` : ''}
                <hr class="sep">
                <div class="vl">
                    <span class="ll" style="font-weight:700;color:var(--text2)">Valor Líquido</span>
                    <span class="lv" style="color:var(--accent);font-size:13px">€ ${N(net)}</span>
                </div>
            </div>

            <!-- Cenário 1 -->
            <div class="sbox sbox-c1">
                <div class="sc-title sc-title-c1">🔴 Cenário 1 — Tributação sobre o Bruto</div>
                <div class="sl"><span class="l">Base de cálculo</span><span class="v">€ ${N(gross)}</span></div>
                <div class="sl"><span class="l">Alíquota</span><span class="v">${P(S.aliq)}</span></div>
                <div class="sc-sep"></div>
                <div class="sl big"><span class="l">Tributo</span><span class="v v-c1">€ ${N(taxC1)}</span></div>
                <div class="sl"><span class="l">Líquido após tributo</span><span class="v">€ ${N(netFinalC1)}</span></div>
            </div>

            <!-- Cenário 2 -->
            <div class="sbox sbox-c2">
                <div class="sc-title sc-title-c2">🟢 Cenário 2 — Tributação sobre o Líquido</div>
                <div class="sl"><span class="l">Base de cálculo</span><span class="v">€ ${N(net)}</span></div>
                <div class="sl"><span class="l">Alíquota</span><span class="v">${P(S.aliq)}</span></div>
                <div class="sc-sep"></div>
                <div class="sl big"><span class="l">Tributo</span><span class="v v-c2">€ ${N(taxC2)}</span></div>
                <div class="sl"><span class="l">Líquido após tributo + deduções</span><span class="v">€ ${N(netFinalC2)}</span></div>
            </div>

            <!-- Diferença -->
            <div class="sbox sbox-diff">
                <div class="sc-title sc-title-diff">💡 Economia Tributária</div>
                <div class="sl"><span class="l">Tributo C1</span><span class="v" style="color:var(--orange)">€ ${N(taxC1)}</span></div>
                <div class="sl"><span class="l">Tributo C2</span><span class="v" style="color:var(--accent)">€ ${N(taxC2)}</span></div>
                <div class="sc-sep"></div>
                <div class="sl big"><span class="l">Economia</span><span class="v v-diff">${savings>=0?'+':''}€ ${N(savings)}</span></div>
                <div class="sl"><span class="l">Redução</span><span class="v" style="color:var(--purple)">${taxC1 > 0 ? P(savings/taxC1*100) : '—'}</span></div>
            </div>
        </div>
    `;
}

function hTotalsBar(active) {
    const cs = active.map(p => calcPlayer(p));
    const g   = cs.reduce((s,c) => s+c.gross, 0);
    const ded = cs.reduce((s,c) => s+c.totalDed, 0);
    const net = cs.reduce((s,c) => s+c.net, 0);
    const t1  = cs.reduce((s,c) => s+c.taxC1, 0);
    const t2  = cs.reduce((s,c) => s+c.taxC2, 0);
    const sav = cs.reduce((s,c) => s+c.savings, 0);
    return `
        <div class="totals-bar">
            <div class="tb">
                <div class="tb-l">Total Bruto</div>
                <div class="tb-v">€ ${N(g)}</div>
                <div class="tb-s">${active.length} atleta${active.length>1?'s':''} · R$ ${N(g*S.fxRate)}</div>
            </div>
            <div class="tb">
                <div class="tb-l">Total Deduções</div>
                <div class="tb-v" style="color:#fca5a5;font-size:15px">€ ${N(ded)}</div>
                <div class="tb-s">${g>0?P(ded/g*100):'—'} do bruto</div>
            </div>
            <div class="tb">
                <div class="tb-l">Total Líquido</div>
                <div class="tb-v">€ ${N(net)}</div>
                <div class="tb-s">${g>0?P(net/g*100):'—'} do bruto</div>
            </div>
            <div class="tb">
                <div class="tb-l">Tributos — C1 (Bruto)</div>
                <div class="tb-v tb-v-orange">€ ${N(t1)}</div>
                <div class="tb-s">Alíq. ${P(S.aliq)} s/ bruto</div>
            </div>
            <div class="tb">
                <div class="tb-l">Tributos — C2 (Líquido)</div>
                <div class="tb-v tb-v-green">€ ${N(t2)}</div>
                <div class="tb-s">Alíq. ${P(S.aliq)} s/ líquido</div>
            </div>
            <div class="tb">
                <div class="tb-l">Economia Total</div>
                <div class="tb-v tb-v-purple">€ ${N(sav)}</div>
                <div class="tb-s">${t1>0?P(sav/t1*100):'—'} de redução</div>
            </div>
        </div>
    `;
}

function hSummary(active) {
    const rows = active.map(p => {
        const c = calcPlayer(p);
        return `
            <tr>
                <td>${esc(p.name)}</td>
                <td>€ ${N(c.gross)}</td>
                <td style="color:var(--red)">−€ ${N(c.totalDed)}</td>
                <td>€ ${N(c.net)}</td>
                <td style="color:var(--orange)">€ ${N(c.taxC1)}</td>
                <td style="color:var(--orange)">${P(S.aliq)}</td>
                <td style="color:var(--accent)">€ ${N(c.taxC2)}</td>
                <td style="color:var(--accent)">${P(S.aliq)}</td>
                <td style="color:var(--purple);font-weight:700">+€ ${N(c.savings)}</td>
                <td style="color:var(--text3)">R$ ${N(c.gross*S.fxRate)}</td>
            </tr>
        `;
    }).join('');

    const cs  = active.map(p => calcPlayer(p));
    const g   = cs.reduce((s,c) => s+c.gross, 0);
    const ded = cs.reduce((s,c) => s+c.totalDed, 0);
    const net = cs.reduce((s,c) => s+c.net, 0);
    const t1  = cs.reduce((s,c) => s+c.taxC1, 0);
    const t2  = cs.reduce((s,c) => s+c.taxC2, 0);
    const sav = cs.reduce((s,c) => s+c.savings, 0);

    return `
        <div class="summary-section">
            <div class="section-title">Resumo Comparativo</div>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th style="text-align:left">Atleta</th>
                        <th>Valor Bruto (€)</th>
                        <th>Deduções (€)</th>
                        <th>Valor Líquido (€)</th>
                        <th>Tributo C1 — Bruto</th>
                        <th>Alíquota C1</th>
                        <th>Tributo C2 — Líquido</th>
                        <th>Alíquota C2</th>
                        <th>Economia (€)</th>
                        <th>Bruto (R$)</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows}
                    <tr class="total-row">
                        <td>TOTAL</td>
                        <td>€ ${N(g)}</td>
                        <td style="color:var(--red)">−€ ${N(ded)}</td>
                        <td>€ ${N(net)}</td>
                        <td style="color:var(--orange)">€ ${N(t1)}</td>
                        <td style="color:var(--orange)">${P(S.aliq)}</td>
                        <td style="color:var(--accent)">€ ${N(t2)}</td>
                        <td style="color:var(--accent)">${P(S.aliq)}</td>
                        <td style="color:var(--purple);font-weight:800">+€ ${N(sav)}</td>
                        <td style="color:var(--text3)">R$ ${N(g*S.fxRate)}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    `;
}

// ================================================================
// EVENTS
// ================================================================
function bindEvents() {
    // Alíquota slider
    const slider = document.getElementById('aliq-slider');
    const inp    = document.getElementById('aliq-inp');
    if (slider) slider.addEventListener('input', e => {
        S.aliq = parseFloat(e.target.value) || 0;
        inp.value = S.aliq;
        updateSliderGradient(slider);
        render();
    });
    if (inp) inp.addEventListener('input', e => {
        S.aliq = parseFloat(e.target.value) || 0;
        slider.value = S.aliq;
        updateSliderGradient(slider);
        render();
    });

    // FX
    const fx = document.getElementById('fx-inp');
    if (fx) fx.addEventListener('input', e => { S.fxRate = parseFloat(e.target.value) || 1; render(); });

    // Player name
    document.querySelectorAll('[data-field="name"]').forEach(el => {
        el.addEventListener('input', e => { S.players[+e.target.dataset.pi].name = e.target.value; });
        el.addEventListener('blur', () => render());
    });

    // Player gross
    document.querySelectorAll('[data-field="gross"]').forEach(el => {
        el.addEventListener('input', e => { S.players[+e.target.dataset.pi].gross = parseFloat(e.target.value) || 0; render(); });
    });

    // Ded toggle
    document.querySelectorAll('[data-field="dedOn"]').forEach(el => {
        el.addEventListener('change', e => {
            S.players[+e.target.dataset.pi].deds[e.target.dataset.dk].on = e.target.checked;
            render();
        });
    });

    // Ded rate
    document.querySelectorAll('[data-field="dedRate"]').forEach(el => {
        el.addEventListener('input', e => {
            S.players[+e.target.dataset.pi].deds[e.target.dataset.dk].rate = parseFloat(e.target.value) || 0;
            render();
        });
    });
}

function updateSliderGradient(slider) {
    const min = +slider.min, max = +slider.max, val = +slider.value;
    const pct = ((val - min) / (max - min) * 100).toFixed(1);
    slider.style.setProperty('--pct', pct + '%');
}

// ================================================================
// INIT
// ================================================================
render();
</script>
</body>
</html>
