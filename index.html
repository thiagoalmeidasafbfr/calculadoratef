<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixa de Intangível — Glorioso Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:          #be8c4a;
            --gold-soft:     #dcc89a;
            --gold-deep:     #7a6244;
            --gold-tint:     rgba(190,140,74,0.12);
            --gold-ring:     rgba(190,140,74,0.22);
            --ink-primary:   #1a1410;
            --ink-secondary: #3a2e1c;
            --ink-4:         rgba(26,20,16,0.55);
            --cream-page:    #f9f7f2;
            --cream-canvas:  #f5f2eb;
            --cream-card:    #fdfbf6;
            --cream-inset:   #ece6d8;
            --tbl-head:      #e7e5de;
            --on-dark:       #f3eee2;
            --on-dark-dim:   rgba(243,238,226,0.45);
            --on-dark-muted: rgba(243,238,226,0.28);
            --var-pos:       #166534;
            --var-pos-tint:  #dcf0e4;
            --var-neg:       #b91c1c;
            --var-neg-tint:  #fce8e8;
            --warn:          #b88a2a;
            --amber:         #d97706;
            --divider:       rgba(26,20,16,0.08);
            --divider-mid:   rgba(26,20,16,0.13);
            --shadow-hair:   0 1px 0 rgba(40,32,22,0.04);
            --shadow-lift:   0 1px 0 rgba(40,32,22,0.04), 0 4px 12px -8px rgba(40,32,22,0.10);
            --r-xs: 4px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--cream-page);
            color: var(--ink-primary);
            line-height: 1.5;
            min-height: 100vh;
            font-size: 15px;
        }

        /* ── HERO ── */
        .page-hero {
            background: var(--ink-primary);
            border-radius: var(--r-lg);
            margin: 16px 24px 0;
            padding: clamp(20px,3vw,32px) clamp(20px,3vw,36px);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .hero-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px; font-weight: 500; letter-spacing: 0.18em;
            text-transform: uppercase; color: var(--on-dark-dim); margin-bottom: 8px;
        }
        .hero-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(1.6rem,4.5vw,3rem); font-weight: 700;
            line-height: 1.08; letter-spacing: -0.025em; color: var(--on-dark);
        }
        .hero-title em {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic; font-weight: 600; color: var(--gold);
        }
        .hero-sub {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px; color: var(--on-dark-dim);
            letter-spacing: 0.04em; margin-top: 10px;
        }
        .hero-right {
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap; padding-bottom: 4px;
        }
        .hero-btn {
            padding: 9px 18px; border-radius: var(--r-pill);
            border: 1px solid rgba(243,238,226,0.18);
            background: rgba(243,238,226,0.07); color: var(--on-dark);
            font-family: 'IBM Plex Mono', monospace; font-size: 10px;
            font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
            cursor: pointer; transition: background 0.15s;
        }
        .hero-btn:hover { background: rgba(243,238,226,0.13); }

        /* ── LAYOUT ── */
        .page-body { padding: 20px 24px 32px; }
        .section-eyebrow {
            font-family: 'IBM Plex Mono', monospace; font-size: 9px;
            font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--gold); margin-bottom: 12px;
        }

        /* ── CONFIG STRIP ── */
        .config-strip {
            background: var(--cream-card); border: 1px solid var(--divider);
            border-radius: var(--r-md); box-shadow: var(--shadow-hair);
            padding: 18px 22px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
        }
        .config-label {
            font-family: 'IBM Plex Mono', monospace; font-size: 9px;
            font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--gold-deep); white-space: nowrap;
        }
        .field-wrap {
            display: flex; align-items: center;
            background: var(--cream-card); border: 1px solid var(--divider-mid);
            border-radius: var(--r-sm); overflow: hidden;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field-wrap:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-ring); }
        .field-prefix {
            padding: 8px 10px; font-family: 'IBM Plex Mono', monospace;
            font-size: 10px; font-weight: 500; color: var(--gold-deep);
            background: var(--cream-inset); border-right: 1px solid var(--divider);
            white-space: nowrap; letter-spacing: 0.05em;
        }
        .field-inp {
            background: transparent; border: none; outline: none;
            padding: 8px 10px; font-family: 'JetBrains Mono', monospace;
            font-size: 13px; font-weight: 500; color: var(--ink-primary);
        }
        .info-chip {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px; background: var(--cream-canvas);
            border: 1px solid var(--divider); border-radius: var(--r-pill);
            font-family: 'IBM Plex Mono', monospace; font-size: 10px;
            color: var(--gold-deep);
        }
        .info-chip strong { font-weight: 600; color: var(--ink-primary); }

        /* ── PLAYER GRID ── */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px; margin-bottom: 20px; align-items: start;
        }

        /* ── PLAYER CARD ── */
        .player-card {
            background: var(--cream-card); border: 1px solid var(--divider);
            border-radius: var(--r-md); box-shadow: var(--shadow-hair);
            overflow: hidden; display: flex; flex-direction: column;
            transition: box-shadow 0.18s;
        }
        .player-card:hover { box-shadow: var(--shadow-lift); }
        .player-head { background: var(--ink-primary); padding: 12px 14px 12px; }
        .player-num {
            font-family: 'IBM Plex Mono', monospace; font-size: 9px;
            font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--on-dark-muted); margin-bottom: 4px;
        }
        .player-name {
            font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
            color: var(--on-dark);
        }
        .player-contract {
            font-family: 'IBM Plex Mono', monospace; font-size: 9px;
            color: var(--on-dark-dim); margin-top: 6px; letter-spacing: 0.04em;
        }
        .player-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

        /* ── ACTIVATED BLOCK ── */
        .act-block {
            background: var(--cream-canvas); border: 1px solid var(--divider);
            border-radius: var(--r-sm); padding: 10px 12px;
        }
        .act-block-title {
            font-family: 'IBM Plex Mono', monospace; font-size: 8.5px;
            font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase;
            color: var(--ink-4); margin-bottom: 8px;
        }
        .act-row {
            display: flex; justify-content: space-between; align-items: baseline;
            font-size: 11.5px; margin-bottom: 3px;
        }
        .act-row .al { color: var(--ink-4); }
        .act-row .av {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            font-weight: 500; color: var(--ink-secondary);
        }
        .act-total {
            border-top: 1px solid var(--divider); margin-top: 6px; padding-top: 6px;
            display: flex; justify-content: space-between; align-items: baseline;
        }
        .act-total .al {
            font-family: 'IBM Plex Mono', monospace; font-size: 8px;
            font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--gold-deep);
        }
        .act-total .av {
            font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
            font-weight: 500; color: var(--warn);
        }
        .fx-note {
            font-family: 'IBM Plex Mono', monospace; font-size: 8px;
            color: var(--ink-4); margin-top: 4px; letter-spacing: 0.03em;
        }

        /* ── AMORT BLOCK ── */
        .amort-block {
            border-top: 1px solid var(--divider); padding-top: 12px;
        }
        .amort-row {
            display: flex; justify-content: space-between; align-items: baseline;
            font-size: 12px; margin-bottom: 6px;
        }
        .amort-row .rl { color: var(--ink-4); font-size: 11px; }
        .amort-row .rv {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            color: var(--ink-secondary);
        }
        .amort-row .rv-neg { color: var(--var-neg) !important; }
        .amort-row .rv-amber { color: var(--amber) !important; }
        .amort-sep { border: none; border-top: 1px dashed var(--divider); margin: 8px 0; }

        /* ── BAIXA HIGHLIGHT ── */
        .baixa-card {
            background: var(--ink-primary); border-radius: var(--r-sm);
            padding: 12px 14px;
        }
        .baixa-eyebrow {
            font-family: 'IBM Plex Mono', monospace; font-size: 8.5px;
            font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--on-dark-muted); margin-bottom: 8px;
        }
        .baixa-row {
            display: flex; justify-content: space-between; align-items: baseline;
            font-size: 11.5px; margin-bottom: 4px;
        }
        .baixa-row .bl { color: var(--on-dark-dim); }
        .baixa-row .bv {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            color: rgba(243,238,226,0.7);
        }
        .baixa-sep { border: none; border-top: 1px solid rgba(243,238,226,0.08); margin: 7px 0; }
        .baixa-main {
            display: flex; justify-content: space-between; align-items: baseline;
        }
        .baixa-main .bl {
            font-weight: 600; color: var(--on-dark); font-size: 12px;
        }
        .baixa-main .bv {
            font-family: 'JetBrains Mono', monospace; font-size: 16px;
            font-weight: 500; color: var(--gold-soft) !important;
        }

        /* ── DAILY RATE ── */
        .daily-tag {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: 'IBM Plex Mono', monospace; font-size: 9px;
            color: var(--ink-4); letter-spacing: 0.04em;
        }
        .daily-val {
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            font-weight: 500; color: var(--gold-deep);
        }

        /* ── TOTALS BAND ── */
        .totals-band {
            background: var(--ink-primary); border-radius: var(--r-lg);
            padding: 20px 28px; margin-bottom: 20px;
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
        }
        .tb-item { padding: 0 20px; text-align: center; }
        .tb-item + .tb-item { border-left: 1px solid rgba(243,238,226,0.08); }
        .tb-item:first-child { padding-left: 0; text-align: left; }
        .tb-eyebrow {
            font-family: 'IBM Plex Mono', monospace; font-size: 8.5px;
            font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase;
            color: var(--on-dark-muted); margin-bottom: 6px;
        }
        .tb-value {
            font-family: 'JetBrains Mono', monospace; font-size: 15px;
            font-weight: 500; color: var(--on-dark); line-height: 1.1;
        }
        .tb-sub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--on-dark-muted); margin-top: 4px; }
        .tb-value-neg  { color: #f9a0a0; }
        .tb-value-pos  { color: #86efac; }
        .tb-value-gold { color: var(--gold-soft); }
        .tb-value-amber { color: #fcd34d; }

        /* ── SUMMARY TABLE ── */
        .summary-section {
            background: var(--cream-card); border: 1px solid var(--divider);
            border-radius: var(--r-md); box-shadow: var(--shadow-hair);
            padding: 20px 24px; margin-bottom: 24px; overflow-x: auto;
        }
        .summary-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        .summary-table th {
            padding: 9px 14px; background: var(--tbl-head);
            text-align: right; font-family: 'IBM Plex Mono', monospace;
            font-size: 8.5px; font-weight: 500; letter-spacing: 0.15em;
            text-transform: uppercase; color: var(--gold-deep);
            border-bottom: 2px solid var(--divider-mid); white-space: nowrap;
        }
        .summary-table th:first-child { text-align: left; border-radius: var(--r-xs) 0 0 0; }
        .summary-table th:last-child  { border-radius: 0 var(--r-xs) 0 0; }
        .summary-table td {
            padding: 10px 14px; border-bottom: 1px solid var(--divider);
            text-align: right; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; color: var(--ink-secondary); white-space: nowrap;
        }
        .summary-table td:first-child {
            text-align: left; font-family: 'Inter', sans-serif;
            font-size: 13px; font-weight: 600; color: var(--ink-primary);
        }
        .summary-table tr:last-child td { border-bottom: none; }
        .summary-table tbody tr:hover td { background: var(--cream-inset); }
        .summary-table .total-row td {
            background: var(--tbl-head); border-top: 2px solid var(--divider-mid);
            font-weight: 500; color: var(--ink-primary);
        }
        .summary-table .total-row td:first-child {
            font-family: 'IBM Plex Mono', monospace; font-size: 10px;
            font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--gold-deep);
        }
        .td-neg  { color: var(--var-neg) !important; }
        .td-pos  { color: var(--var-pos) !important; }
        .td-gold { color: var(--gold-deep) !important; font-weight: 600 !important; }
        .td-warn { color: var(--warn) !important; }
        .td-amber { color: var(--amber) !important; }

        /* ── FOOTER ── */
        .footer {
            text-align: center; padding: 20px 24px;
            font-size: 11.5px; color: var(--ink-4);
            border-top: 1px solid var(--divider);
        }

        /* ── UTILS ── */
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--cream-canvas); }
        ::-webkit-scrollbar-thumb { background: var(--cream-inset); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-soft); }

        @media (max-width: 1400px) {
            .players-grid  { grid-template-columns: repeat(2, 1fr); }
            .totals-band   { grid-template-columns: repeat(3, 1fr); }
            .tb-item + .tb-item { border-left: none; }
            .tb-item:nth-child(3n+1) { padding-left: 0; text-align: left; }
        }
        @media (max-width: 700px) {
            .players-grid  { grid-template-columns: 1fr; }
            .totals-band   { grid-template-columns: repeat(2, 1fr); }
            .page-hero, .page-body { margin-left: 12px; margin-right: 12px; }
        }
    </style>
</head>

<script>
// Contract periods supplied by the user
// totalBRL = sum of all activated amounts converted to BRL using
//   the cotações sheet rate for each item's lançamento month
const PLAYERS = [
    {
        name: 'Matheus Martins',
        contractStart: '2024-07-29',
        contractEnd:   '2028-12-31',
        contractDays:  1616,
        totalBRL:      65156079.49,
        fxLines: [
            // EUR installments at different activation dates
            { moeda: 'EUR', local: 2047502.00, brl:  2047502.00 * 6.0677, rateKey: '2024-09', rate: 6.0677 },
            { moeda: 'EUR', local: 2047502.00, brl:  2047502.00 * 6.4269, rateKey: '2025-04', rate: 6.4269 },
            { moeda: 'EUR', local: 2047502.00, brl:  2047502.00 * 6.2447, rateKey: '2025-09', rate: 6.2447 },
            // Two future installments (2026-04 & 2026-09 → using 2026-04 rate)
            { moeda: 'EUR', local: 4095004.00, brl:  4095004.00 * 5.8109, rateKey: '2026-04', rate: 5.8109 },
            { moeda: 'BRL', local: 2991666.52, brl:  2991666.52,          rateKey: null,       rate: 1      },
        ],
    },
    {
        name: 'Danilo',
        contractStart: '2025-07-18',
        contractEnd:   '2029-07-31',
        contractDays:  1474,
        totalBRL:      166225800.00,
        fxLines: [
            { moeda: 'EUR', local: 26000000.00, brl: 26000000.00 * 6.3933, rateKey: '2025-07', rate: 6.3933 },
        ],
    },
    {
        name: 'Montoro',
        contractStart: '2025-06-01',
        contractEnd:   '2029-12-31',
        contractDays:  1674,
        totalBRL:      51985197.00,
        fxLines: [
            { moeda: 'USD', local: 9570000.00, brl: 9570000.00 * 5.4321, rateKey: '2025-06', rate: 5.4321 },
        ],
    },
    {
        name: 'Vitinho',
        contractStart: '2024-08-30',
        contractEnd:   '2029-08-28',
        contractDays:  1824,
        totalBRL:      53343600.00,
        fxLines: [
            { moeda: 'EUR', local: 8000000.00, brl: 8000000.00 * 6.0677, rateKey: '2024-09', rate: 6.0677 },
            { moeda: 'BRL', local: 4802000.00, brl: 4802000.00,           rateKey: null,      rate: 1      },
        ],
    },
];

const TODAY_STR      = '2026-05-22';
const DEFAULT_SALE   = '2026-07-15';

// ─── State ───────────────────────────────────────────────────────
let S = { saleDate: DEFAULT_SALE };

// ─── Utils ───────────────────────────────────────────────────────
function parseDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
}
function daysBetween(a, b) {
    return Math.round((b - a) / 86400000);
}
const N  = v => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v ?? 0);
const N0 = v => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v ?? 0);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = s => { const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };

// ─── Calculation ─────────────────────────────────────────────────
function calcPlayer(p) {
    const start = parseDate(p.contractStart);
    const end   = parseDate(p.contractEnd);
    const today = parseDate(TODAY_STR);
    const sale  = parseDate(S.saleDate);

    const contractDays      = daysBetween(start, end);
    const dailyAmort        = p.totalBRL / contractDays;
    const daysToToday       = Math.max(0, daysBetween(start, today));
    const daysToSale        = Math.max(0, daysBetween(start, sale));
    const daysTodayToSale   = Math.max(0, daysBetween(today, sale));
    const amortToToday      = daysToToday     * dailyAmort;
    const amortRemaining    = daysTodayToSale * dailyAmort;
    const totalAmortAtSale  = daysToSale      * dailyAmort;
    const baixa             = p.totalBRL - totalAmortAtSale;

    return {
        contractDays, dailyAmort, daysToToday, daysToSale, daysTodayToSale,
        amortToToday, amortRemaining, totalAmortAtSale, baixa,
        pct: p.totalBRL > 0 ? (totalAmortAtSale / p.totalBRL * 100) : 0,
    };
}

// ─── Render ──────────────────────────────────────────────────────
function render() {
    document.getElementById('app').innerHTML = buildHTML();
    bindEvents();
}

function buildHTML() {
    return `
        ${hHero()}
        <div class="page-body">
            ${hConfig()}
            <div class="section-eyebrow">Amortização por Atleta</div>
            <div class="players-grid">${PLAYERS.map((p,i) => hCard(p,i)).join('')}</div>
            ${hTotalsBand()}
            ${hSummary()}
        </div>
        <div class="footer">
            Glorioso Finance · Baixa de Ativo Intangível · Referência: ${fmtDate(S.saleDate)} ·
            Amortização linear / pro-rata die · Taxas de câmbio: PTAX histórico (cotações mensais)
        </div>
    `;
}

function hHero() {
    return `
        <div class="page-hero">
            <div class="hero-left">
                <div class="hero-eyebrow">Glorioso Finance · Departamento Financeiro</div>
                <h1 class="hero-title">Baixa de <em>Intangível</em></h1>
                <div class="hero-sub">Amortização acumulada e valor residual na data de transferência dos atletas</div>
            </div>
            <div class="hero-right">
                <button class="hero-btn" onclick="window.print()">Imprimir</button>
            </div>
        </div>
    `;
}

function hConfig() {
    return `
        <div class="config-strip">
            <div class="config-label">Data da Venda</div>
            <div class="field-wrap">
                <span class="field-prefix">Data</span>
                <input class="field-inp" type="date" id="sale-date-inp"
                    value="${S.saleDate}" min="2025-01-01" max="2030-12-31">
            </div>
            <div class="info-chip" style="margin-left:auto">
                <span>Referência hoje</span>
                <strong>${fmtDate(TODAY_STR)}</strong>
            </div>
            <div class="info-chip">
                <span>Venda</span>
                <strong id="sale-date-display">${fmtDate(S.saleDate)}</strong>
            </div>
        </div>
    `;
}

function hCard(p, pi) {
    const c = calcPlayer(p);
    const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const sd = parseDate(p.contractStart);
    const ed = parseDate(p.contractEnd);
    const periodStr = `${sd.getDate()} ${months[sd.getMonth()]} ${sd.getFullYear()} → ${ed.getDate()} ${months[ed.getMonth()]} ${ed.getFullYear()}`;

    // FX lines grouped by currency
    const byMoeda = {};
    for (const fl of p.fxLines) {
        if (!byMoeda[fl.moeda]) byMoeda[fl.moeda] = { local: 0, brl: 0, rates: [] };
        byMoeda[fl.moeda].local += fl.local;
        byMoeda[fl.moeda].brl   += fl.brl;
        if (fl.rate !== 1) byMoeda[fl.moeda].rates.push(fl.rate);
    }

    const fxRows = Object.entries(byMoeda).map(([moeda, v]) => {
        const sym  = moeda === 'EUR' ? '€' : moeda === 'USD' ? 'US$' : 'R$';
        const note = v.rates.length > 0
            ? (v.rates.length === 1
                ? `cotação ${v.rates[0].toFixed(4)}`
                : `cotações múltiplas: ${[...new Set(v.rates)].map(r => r.toFixed(4)).join(' / ')}`)
            : '';
        if (moeda === 'BRL') {
            return `
                <div class="act-row">
                    <span class="al">BRL</span>
                    <span class="av">R$ ${N(v.brl)}</span>
                </div>`;
        }
        return `
            <div class="act-row">
                <span class="al">${moeda} ${sym} ${N(v.local)}</span>
                <span class="av">R$ ${N(v.brl)}</span>
            </div>
            ${note ? `<div class="fx-note">↳ ${note}</div>` : ''}`;
    }).join('');

    return `
        <div class="player-card">
            <div class="player-head">
                <div class="player-num">Atleta ${pi + 1}</div>
                <div class="player-name">${esc(p.name)}</div>
                <div class="player-contract">${periodStr} · ${N0(c.contractDays)} dias</div>
            </div>
            <div class="player-body">
                <div class="act-block">
                    <div class="act-block-title">Ativo ativado</div>
                    ${fxRows}
                    <div class="act-total">
                        <span class="al">Total ativado</span>
                        <span class="av">R$ ${N(p.totalBRL)}</span>
                    </div>
                </div>

                <div class="amort-block">
                    <div class="amort-row">
                        <span class="rl">Amort. diária</span>
                        <span class="rv rv-amber">R$ ${N(c.dailyAmort)}/dia</span>
                    </div>
                    <div class="amort-row">
                        <span class="rl">Já amortizado até ${fmtDate(TODAY_STR)}</span>
                        <span class="rv rv-neg">(−) R$ ${N(c.amortToToday)}</span>
                    </div>
                    <div class="amort-row">
                        <span class="rl">Amort. até ${fmtDate(S.saleDate)} (+${c.daysTodayToSale}d)</span>
                        <span class="rv rv-neg">(−) R$ ${N(c.amortRemaining)}</span>
                    </div>
                    <hr class="amort-sep">
                    <div class="amort-row">
                        <span class="rl">Total amort. na venda (${N0(c.pct)}%)</span>
                        <span class="rv rv-neg">(−) R$ ${N(c.totalAmortAtSale)}</span>
                    </div>
                </div>

                <div class="baixa-card">
                    <div class="baixa-eyebrow">Baixa do ativo intangível</div>
                    <div class="baixa-row">
                        <span class="bl">Ativado</span>
                        <span class="bv">R$ ${N(p.totalBRL)}</span>
                    </div>
                    <div class="baixa-row">
                        <span class="bl">Amort. acum.</span>
                        <span class="bv">(−) R$ ${N(c.totalAmortAtSale)}</span>
                    </div>
                    <div class="baixa-sep"></div>
                    <div class="baixa-main">
                        <span class="bl">Valor residual</span>
                        <span class="bv">R$ ${N(c.baixa)}</span>
                    </div>
                </div>

                <div class="daily-tag">
                    ${N0(c.daysToToday)} dias amortizados · ${N0(c.daysToSale)} até a venda
                </div>
            </div>
        </div>
    `;
}

function hTotalsBand() {
    const cs = PLAYERS.map(p => calcPlayer(p));
    const totAtivado  = PLAYERS.reduce((s,p) => s + p.totalBRL,         0);
    const totJaAmort  = cs.reduce((s,c) => s + c.amortToToday,    0);
    const totRemAmort = cs.reduce((s,c) => s + c.amortRemaining,  0);
    const totAmortSale= cs.reduce((s,c) => s + c.totalAmortAtSale,0);
    const totBaixa    = cs.reduce((s,c) => s + c.baixa,           0);

    return `
        <div class="totals-band">
            <div class="tb-item">
                <div class="tb-eyebrow">Total Ativado</div>
                <div class="tb-value">R$ ${N(totAtivado)}</div>
                <div class="tb-sub">${PLAYERS.length} atletas</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Já Amortizado</div>
                <div class="tb-value tb-value-neg">R$ ${N(totJaAmort)}</div>
                <div class="tb-sub">até ${fmtDate(TODAY_STR)}</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">A Amortizar</div>
                <div class="tb-value tb-value-amber">R$ ${N(totRemAmort)}</div>
                <div class="tb-sub">até ${fmtDate(S.saleDate)}</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Total Amort. na Venda</div>
                <div class="tb-value tb-value-neg">R$ ${N(totAmortSale)}</div>
                <div class="tb-sub">acumulado</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Baixa Total</div>
                <div class="tb-value tb-value-gold">R$ ${N(totBaixa)}</div>
                <div class="tb-sub">valor residual</div>
            </div>
        </div>
    `;
}

function hSummary() {
    const rows = PLAYERS.map(p => {
        const c = calcPlayer(p);
        return `
            <tr>
                <td>${esc(p.name)}</td>
                <td>${fmtDate(p.contractStart)}</td>
                <td>${fmtDate(p.contractEnd)}</td>
                <td class="td-warn">R$ ${N(p.totalBRL)}</td>
                <td class="td-neg">R$ ${N(c.amortToToday)}</td>
                <td class="td-amber">R$ ${N(c.amortRemaining)}</td>
                <td class="td-neg">R$ ${N(c.totalAmortAtSale)}</td>
                <td>${N0(c.pct)}%</td>
                <td class="td-gold">R$ ${N(c.baixa)}</td>
            </tr>
        `;
    }).join('');

    const cs = PLAYERS.map(p => calcPlayer(p));
    const totAtivado  = PLAYERS.reduce((s,p) => s + p.totalBRL,          0);
    const totJaAmort  = cs.reduce((s,c) => s + c.amortToToday,     0);
    const totRemAmort = cs.reduce((s,c) => s + c.amortRemaining,   0);
    const totAmortSale= cs.reduce((s,c) => s + c.totalAmortAtSale, 0);
    const totBaixa    = cs.reduce((s,c) => s + c.baixa,            0);
    const pctMedia    = totAtivado > 0 ? (totAmortSale / totAtivado * 100) : 0;

    return `
        <div class="summary-section">
            <div class="section-eyebrow">Resumo — Baixa na Data da Venda (${fmtDate(S.saleDate)})</div>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th style="text-align:left">Atleta</th>
                        <th>Início do Contrato</th>
                        <th>Fim do Contrato</th>
                        <th>Total Ativado (R$)</th>
                        <th>Amort. já incorrida</th>
                        <th>Amort. até venda</th>
                        <th>Total Amort. Acum.</th>
                        <th>% Amort.</th>
                        <th>Baixa (Valor Residual)</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows}
                    <tr class="total-row">
                        <td>Total</td>
                        <td>—</td>
                        <td>—</td>
                        <td class="td-warn">R$ ${N(totAtivado)}</td>
                        <td class="td-neg">R$ ${N(totJaAmort)}</td>
                        <td class="td-amber">R$ ${N(totRemAmort)}</td>
                        <td class="td-neg">R$ ${N(totAmortSale)}</td>
                        <td>${N0(pctMedia)}%</td>
                        <td class="td-gold">R$ ${N(totBaixa)}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    `;
}

// ─── Events ──────────────────────────────────────────────────────
function bindEvents() {
    const inp = document.getElementById('sale-date-inp');
    if (inp) {
        inp.addEventListener('change', e => {
            if (e.target.value) {
                S.saleDate = e.target.value;
                render();
            }
        });
    }
}

// ─── Init ────────────────────────────────────────────────────────
render();
</script>

<div id="app"></div>

</body>
</html>
