// ═══════════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════════
function bindEvents() {
  if(bindEvents._done) return;   // delegação: registrar listeners uma única vez
  bindEvents._done=true;

  // ── Tooltip flutuante (Custos Venda etc.) ──
  let _tipEl=null, _tipFor=null;
  const ensureTipEl=()=>{
    if (_tipEl) return _tipEl;
    _tipEl=document.createElement('div');
    _tipEl.className='float-tip';
    document.body.appendChild(_tipEl);
    return _tipEl;
  };
  const positionTip=(tip,target)=>{
    const r=target.getBoundingClientRect();
    const m=8, vw=window.innerWidth, vh=window.innerHeight;
    tip.style.left='0px'; tip.style.top='0px';   // reset p/ medir
    const tw=tip.offsetWidth, th=tip.offsetHeight;
    let left=r.right-tw;
    if (left<m) left=Math.min(r.left, vw-tw-m);
    if (left<m) left=m;
    let top=r.bottom+6;
    if (top+th>vh-m) top=Math.max(m, r.top-th-6);
    tip.style.left=`${left}px`;
    tip.style.top=`${top}px`;
  };
  const showTip=(target)=>{
    const src=target.querySelector(':scope > .cell-tip');
    if(!src){ hideTip(); return; }
    const tip=ensureTipEl();
    tip.innerHTML=src.innerHTML;
    tip.style.display='block';
    positionTip(tip,target);
    requestAnimationFrame(()=>tip.classList.add('show'));
    _tipFor=target;
  };
  const hideTip=()=>{
    if(!_tipEl) return;
    _tipEl.classList.remove('show');
    _tipEl.style.display='none';
    _tipFor=null;
  };
  document.addEventListener('mouseover', e => {
    const target=e.target.closest?.('.has-tip');
    if (target===_tipFor) return;
    if (target) showTip(target); else hideTip();
  });
  document.addEventListener('mouseout', e => {
    const target=e.target.closest?.('.has-tip');
    if (!target || target!==_tipFor) return;
    if (e.relatedTarget && target.contains(e.relatedTarget)) return;
    hideTip();
  });
  window.addEventListener('scroll', hideTip, true);

  // Navegação entre páginas — descarta o atleta em edição se sair sem salvar
  document.addEventListener('click', e => {
    const nav=e.target.closest('[data-nav]');
    if(nav){
      if (DRAFT && view==='edit' && nav.dataset.nav!=='edit') DRAFT=null;
      view=nav.dataset.nav;
      renderAll();
    }
  });

  // Drag-and-drop para reordenar deduções
  const _drag = {pid:null, key:null, srcEl:null};
  document.addEventListener('mousedown', e => {
    const h=e.target.closest('.drag-handle');
    if(!h) return;
    const wrap=h.closest('.dedu-wrap');
    if(wrap){ wrap.setAttribute('draggable','true'); }
  });
  document.addEventListener('mouseup', e => {
    document.querySelectorAll('.dedu-wrap[draggable="true"]').forEach(w=>{ if(!w.classList.contains('is-dragging')) w.removeAttribute('draggable'); });
  });
  document.addEventListener('dragstart', e => {
    const wrap=e.target.closest?.('.dedu-wrap[draggable="true"]');
    if(!wrap||!wrap.dataset.dedKey) return;
    _drag.pid=+wrap.dataset.pid; _drag.key=wrap.dataset.dedKey; _drag.srcEl=wrap;
    wrap.classList.add('is-dragging');
    try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',_drag.key); }catch(_){ }
  });
  document.addEventListener('dragover', e => {
    if(!_drag.key) return;
    const wrap=e.target.closest?.('.dedu-wrap[data-ded-key]');
    if(!wrap||+wrap.dataset.pid!==_drag.pid) return;
    e.preventDefault();
    document.querySelectorAll('.dedu-wrap.drop-target-before,.dedu-wrap.drop-target-after').forEach(el=>el.classList.remove('drop-target-before','drop-target-after'));
    if(wrap===_drag.srcEl) return;
    const r=wrap.getBoundingClientRect();
    const before=e.clientY < r.top + r.height/2;
    wrap.classList.add(before?'drop-target-before':'drop-target-after');
  });
  document.addEventListener('dragleave', e => {
    const wrap=e.target.closest?.('.dedu-wrap');
    if(wrap) wrap.classList.remove('drop-target-before','drop-target-after');
  });
  document.addEventListener('drop', e => {
    if(!_drag.key) return;
    const wrap=e.target.closest?.('.dedu-wrap[data-ded-key]');
    if(!wrap||+wrap.dataset.pid!==_drag.pid) return;
    e.preventDefault();
    const r=wrap.getBoundingClientRect();
    const before=e.clientY < r.top + r.height/2;
    const targetKey=wrap.dataset.dedKey;
    const p=findAny(_drag.pid);
    if(p && targetKey!==_drag.key){
      const ord=getSaleOrder(p);
      const from=ord.indexOf(_drag.key);
      let to=ord.indexOf(targetKey);
      if(from>-1 && to>-1){
        ord.splice(from,1);
        to=ord.indexOf(targetKey);
        if(!before) to++;
        ord.splice(to,0,_drag.key);
        p.saleDeductionOrder=ord;
        saveDraft();
        renderAll();
      }
    }
  });
  document.addEventListener('dragend', e => {
    document.querySelectorAll('.dedu-wrap.is-dragging').forEach(w=>w.classList.remove('is-dragging'));
    document.querySelectorAll('.dedu-wrap.drop-target-before,.dedu-wrap.drop-target-after').forEach(el=>el.classList.remove('drop-target-before','drop-target-after'));
    document.querySelectorAll('.dedu-wrap[draggable="true"]').forEach(w=>w.removeAttribute('draggable'));
    _drag.pid=null; _drag.key=null; _drag.srcEl=null;
  });

  // Popover "Base ▾": toggle + click-outside
  document.addEventListener('click', e => {
    const btn=e.target.closest('[data-action="toggle-base-cfg"]');
    if(btn){
      const pid=+btn.dataset.pid, tag=btn.dataset.tag;
      const pop=document.getElementById(`basepop-${pid}-${tag.replace(':','-')}`);
      const open=pop && pop.style.display!=='none';
      document.querySelectorAll('.base-cfg-pop').forEach(el=>el.style.display='none');
      if(pop && !open) pop.style.display='flex';
      e.stopPropagation();
      return;
    }
    const preset=e.target.closest('[data-action="base-preset"]');
    if(preset){
      const pid=+preset.dataset.pid, tag=preset.dataset.tag, kind=preset.dataset.preset;
      const p=findAny(pid);
      if(p){
        const opts=new Set(availableBases(p,tag).map(o=>o.key));
        let arr=[];
        if(kind==='gross')     arr=[];
        else if(kind==='bruto')arr=opts.has('solidariedade')?['solidariedade']:[];
        else if(kind==='maisValia'){
          arr=[];
          if(opts.has('solidariedade')) arr.push('solidariedade');
          if(opts.has('acquisition'))   arr.push('acquisition');
        }
        setSaleIncl(p,tag,arr);
        saveDraft();
        renderAll();
      }
      e.stopPropagation();
      return;
    }
    if(!e.target.closest('.base-cfg-pop')) {
      document.querySelectorAll('.base-cfg-pop').forEach(el=>el.style.display='none');
    }
  });

  // Checkbox da base — adiciona/remove chave da incl list
  document.addEventListener('change', e => {
    const t=e.target;
    if(!t.dataset.inclTag) return;
    const pid=+t.dataset.pid, tag=t.dataset.inclTag, key=t.dataset.inclKey;
    const p=findAny(pid);
    if(!p) return;
    const arr=getSaleIncl(p,tag).slice();
    const has=arr.includes(key);
    if(t.checked && !has) arr.push(key);
    if(!t.checked && has) arr.splice(arr.indexOf(key),1);
    setSaleIncl(p,tag,arr);
    saveDraft();
    // atualiza summary do botão correspondente
    const btn=document.querySelector(`[data-action="toggle-base-cfg"][data-pid="${pid}"][data-tag="${tag}"]`);
    if(btn) btn.textContent=`${baseSummary(arr)} ▾`;
    // recalcula tags BRL e resultados
    const tags={'sale-brl-':hSaleBRL,'solid-brl-':hSolidariedadeBRL,'sell-on-brl-':hSellOnBRL,'intermed-brl-':hIntermedBRL,'taxes-brl-':hTaxesBRL};
    for(const [pref,fn] of Object.entries(tags)){ const el=document.getElementById(pref+pid); if(el) el.innerHTML=fn(p); }
    for(const ex of (p.saleExtras||[])){ const el=document.getElementById(`extra-brl-${ex.id}`); if(el) el.innerHTML=hSaleExtraBRL(p,ex); }
    refreshResults(pid);
  });

  document.addEventListener('click', e => {
    const t=e.target.closest('[data-action]');
    if(!t) return;
    const {action,pid,iid}={action:t.dataset.action,pid:t.dataset.pid?+t.dataset.pid:null,iid:t.dataset.iid?+t.dataset.iid:null};

    // ── ações globais ──
    if(action==='cut-set'){
      const mode=t.dataset.mode;
      if(mode==='all'){ CUT.date=''; }
      else if(mode==='date'){
        if(!CUT.date){
          const d=new Date(); CUT.date=`${d.getFullYear()}-12-31`;
        }
      }
      renderAll();
      return;
    }
    if(action==='cut-incl'){
      if (pid==null) return;
      const list = CUT.exclude || (CUT.exclude=[]);
      const idx = list.indexOf(pid);
      if (idx>=0) list.splice(idx,1); else list.push(pid);
      const sec=document.getElementById('summary-section');
      if(sec) sec.outerHTML=hSummary();
      return;
    }
    if(action==='cut-incl-all'){
      const mode=t.dataset.mode;
      if (mode==='all') CUT.exclude=[];
      else CUT.exclude=S.players.map(p=>p.id);
      const sec=document.getElementById('summary-section');
      if(sec) sec.outerHTML=hSummary();
      return;
    }
    if(action==='cot-fetch'){
      const cur=document.getElementById('cot-cur')?.value||'EUR';
      const start=document.getElementById('cot-start')?.value||'';
      const end=document.getElementById('cot-end')?.value||'';
      if(!start||!end){ toast('Informe o período','warn'); return; }
      COT={cur,start,end};
      loadBacenSeries(cur,start,end).then(()=>{
        renderAll();
        if(!(FX_DAYS[cur]&&FX_DAYS[cur].length)) toast('Sem dados do BACEN para o período (verifique a rede)','warn');
      });
      return;
    }
    if(action==='add-player'){
      DRAFT = { players:[newPlayer()], editId:null };
      view = 'edit';
      renderAll();
      const card = document.getElementById(`card-${DRAFT.players[0].id}`);
      if(card){
        card.scrollIntoView({behavior:'smooth',block:'start'});
        const nm=card.querySelector('.pcard-name');
        if(nm) nm.focus({preventScroll:true});
      }
      return;
    }
    if(action==='edit-player'){
      const sp = S.players.find(p=>p.id===pid);
      if (!sp) return;
      const clone = JSON.parse(JSON.stringify(sp));
      DRAFT = { players:[clone], editId:sp.id };
      view = 'edit';
      renderAll();
      schedulePrefetch();
      return;
    }
    if(action==='save-edit'){
      if (!DRAFT?.players?.length) { view='dashboard'; renderAll(); return; }
      const draftP = DRAFT.players[0];
      if (isEmptyPlayer(draftP)) { toast('Preencha ao menos um campo antes de salvar.','warn'); return; }
      const clone = JSON.parse(JSON.stringify(draftP));
      if (DRAFT.editId != null) {
        const idx = S.players.findIndex(p=>p.id===DRAFT.editId);
        if (idx>=0) S.players[idx]=clone; else S.players.push(clone);
      } else {
        S.players.push(clone);
      }
      persistSaved();
      DRAFT = null;
      view = 'dashboard';
      renderAll();
      schedulePrefetch();
      toast(`${clone.name||'Atleta'} salvo ✓`);
      return;
    }
    if(action==='cancel-edit'){
      DRAFT = null;
      view = 'dashboard';
      renderAll();
      return;
    }
    if(action==='remove-player'){
      S.players = S.players.filter(p=>p.id!==pid);
      persistSaved();
      renderAll();
      toast('Atleta removido');
      return;
    }
    if(action==='add-item'){
      const p=findAny(pid);
      if(p){p.items.push(newItem(''));saveDraft();renderAll();}
      return;
    }
    if(action==='remove-item'){
      const p=findAny(pid);
      if(p){
        p.items=p.items.filter(i=>i.id!==iid);
        if(!p.items.length) p.items.push(newItem(''));
        saveDraft();renderAll();
      }
      return;
    }
    if(action==='add-sale-extra'){
      const p=findAny(pid);
      if(p){ p.saleExtras=p.saleExtras||[]; p.saleExtras.push(newSaleExtra()); saveDraft(); renderAll(); }
      return;
    }
    if(action==='remove-sale-extra'){
      const p=findAny(pid);
      const eid=t.dataset.eid?+t.dataset.eid:null;
      if(p&&eid){ p.saleExtras=(p.saleExtras||[]).filter(x=>x.id!==eid); saveDraft(); renderAll(); }
      return;
    }
  }, true);

  document.addEventListener('click', e => {
    // Currency and method toggles
    const t=e.target.closest('[data-field="itemCur"],[data-field="saleCur"],[data-field="sellOnMethod"],[data-field="saleIntermedCur"],[data-field="saleIntermedMode"],[data-field="saleIntermedMethod"],[data-field="saleTaxesCur"],[data-field="saleTaxesMode"],[data-field="saleTaxesMethod"],[data-field="saleExtraMode"],[data-field="saleExtraMethod"],[data-field="saleExtraCur"]');
    if(!t) return;
    const pid=+t.dataset.pid, iid=t.dataset.iid?+t.dataset.iid:null;
    const eid=t.dataset.eid?+t.dataset.eid:null;
    const p=findAny(pid);
    if(!p) return;
    const ex=eid?(p.saleExtras||[]).find(x=>x.id===eid):null;
    if(t.dataset.field==='saleExtraMode'&&ex){ ex.mode=t.dataset.v; saveDraft(); renderAll(); return; }
    if(t.dataset.field==='saleExtraMethod'&&ex){
      ex.method=t.dataset.v; saveDraft();
      document.querySelectorAll(`[data-field="saleExtraMethod"][data-eid="${eid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===ex.method));
      const el=document.getElementById(`extra-brl-${eid}`); if(el) el.innerHTML=hSaleExtraBRL(p,ex);
      refreshResults(pid);
      return;
    }
    if(t.dataset.field==='saleExtraCur'&&ex){
      ex.currency=t.dataset.v; saveDraft();
      document.querySelectorAll(`[data-field="saleExtraCur"][data-eid="${eid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===(ex.currency||'BRL')));
      const el=document.getElementById(`extra-brl-${eid}`); if(el) el.innerHTML=hSaleExtraBRL(p,ex);
      refreshResults(pid);
      schedulePrefetch();
      return;
    }
    if(/Cur$/.test(t.dataset.field)) schedulePrefetch();   // mudou moeda → buscar PTAX

    if(t.dataset.field==='saleIntermedMode') {
      p.saleIntermedMode=t.dataset.v;   // troca o layout dos controles → re-render
      saveDraft();
      renderAll();
      return;
    }
    if(t.dataset.field==='saleIntermedMethod') {
      p.saleIntermedMethod=t.dataset.v;
      saveDraft();
      document.querySelectorAll(`[data-field="saleIntermedMethod"][data-pid="${pid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===p.saleIntermedMethod));
      document.getElementById(`intermed-brl-${pid}`).innerHTML=hIntermedBRL(p);
      refreshResults(pid);
    }

    if(t.dataset.field==='itemCur'&&iid) {
      const it=p.items.find(i=>i.id===iid);
      if(!it) return;
      it.currency=t.dataset.v;
      saveDraft();
      refreshItemRow(pid,iid);
      refreshResults(pid);
    }
    if(t.dataset.field==='saleCur') {
      p.saleCurrency=t.dataset.v;
      saveDraft();
      document.querySelectorAll(`[data-field="saleCur"][data-pid="${pid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===p.saleCurrency));
      // moeda da receita muda saleBRL → recalcula todos os tags dependentes
      const tags={
        'sale-brl-':hSaleBRL,'solid-brl-':hSolidariedadeBRL,'sell-on-brl-':hSellOnBRL,
        'intermed-brl-':hIntermedBRL,'taxes-brl-':hTaxesBRL,
      };
      for(const [pref,fn] of Object.entries(tags)){ const el=document.getElementById(pref+pid); if(el) el.innerHTML=fn(p); }
      for(const ex of (p.saleExtras||[])){ const el=document.getElementById(`extra-brl-${ex.id}`); if(el) el.innerHTML=hSaleExtraBRL(p,ex); }
      refreshResults(pid);
    }
    if(t.dataset.field==='sellOnMethod') {
      p.sellOnMethod=t.dataset.v;
      saveDraft();
      document.querySelectorAll(`[data-field="sellOnMethod"][data-pid="${pid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===p.sellOnMethod));
      document.getElementById(`sell-on-brl-${pid}`).innerHTML=hSellOnBRL(p);
      refreshResults(pid);
    }
    if(t.dataset.field==='saleIntermedCur') {
      p.saleIntermedCurrency=t.dataset.v;
      saveDraft();
      document.querySelectorAll(`[data-field="saleIntermedCur"][data-pid="${pid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===(p.saleIntermedCurrency||'BRL')));
      document.getElementById(`intermed-brl-${pid}`).innerHTML=hIntermedBRL(p);
      refreshResults(pid);
    }
    if(t.dataset.field==='saleTaxesMode') {
      p.saleTaxesMode=t.dataset.v;   // troca layout → re-render
      saveDraft();
      renderAll();
      return;
    }
    if(t.dataset.field==='saleTaxesMethod') {
      p.saleTaxesMethod=t.dataset.v;
      saveDraft();
      document.querySelectorAll(`[data-field="saleTaxesMethod"][data-pid="${pid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===p.saleTaxesMethod));
      document.getElementById(`taxes-brl-${pid}`).innerHTML=hTaxesBRL(p);
      refreshResults(pid);
    }
    if(t.dataset.field==='saleTaxesCur') {
      p.saleTaxesCurrency=t.dataset.v;
      saveDraft();
      document.querySelectorAll(`[data-field="saleTaxesCur"][data-pid="${pid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===(p.saleTaxesCurrency||'BRL')));
      document.getElementById(`taxes-brl-${pid}`).innerHTML=hTaxesBRL(p);
      refreshResults(pid);
    }
  });

  document.addEventListener('input', e => {
    const t=e.target;
    const field=t.dataset.field;
    if(!field) return;
    const pid=+t.dataset.pid, iid=t.dataset.iid?+t.dataset.iid:null;
    const eid=t.dataset.eid?+t.dataset.eid:null;
    const p=findAny(pid);
    if(!p) return;

    if(t.dataset.money) maskMoneyInput(t);   // aplica milhar/decimal preservando cursor
    const num = t.dataset.money ? parseMoney(t.value) : (t.value===''?null:parseFloat(t.value));

    if(eid&&['saleExtraLabel','saleExtraVal','saleExtraPct'].includes(field)) {
      const ex=(p.saleExtras||[]).find(x=>x.id===eid);
      if(!ex) return;
      if(field==='saleExtraLabel') ex.label=t.value;
      if(field==='saleExtraVal')   ex.val=num;
      if(field==='saleExtraPct')   ex.pct=num;
      saveDraft();
      const el=document.getElementById(`extra-brl-${eid}`); if(el) el.innerHTML=hSaleExtraBRL(p,ex);
      refreshResults(pid);
      return;
    }
    if(iid) {
      const it=p.items.find(i=>i.id===iid);
      if(!it) return;
      if(field==='label')  it.label =t.value;
      if(field==='amount') it.amount=num;
    } else {
      if(field==='name')            p.name=t.value;
      if(field==='saleAmount')      p.saleAmount=num;
      if(field==='solidariedadePct')p.solidariedadePct=num;
      if(field==='sellOnPct')       p.sellOnPct=num;
      if(field==='saleIntermed')    p.saleIntermed=num;
      if(field==='saleIntermedPct') p.saleIntermedPct=num;
      if(field==='saleTaxes')       p.saleTaxes=num;
      if(field==='saleTaxesPct')    p.saleTaxesPct=num;
      if(field==='salary')          p.salary=num;
      if(field==='imageRights')     p.imageRights=num;
      if(field==='inssPct')         p.inssPct=num;
      if(field==='irpfPct')         p.irpfPct=num;
    }
    saveDraft();

    if(field==='amount'&&iid) {
      // update BRL display in row without full re-render
      const it=p.items.find(i=>i.id===iid);
      if(it){
        const {rate}=getDayRate(it.currency,p.start);
        const brl=(it.amount??0)*rate;
        const row=document.getElementById(`irow-${iid}`);
        const brlSpan=row?.querySelector('.brl-val');
        if(brlSpan) brlSpan.textContent=`R$ ${N(brl)}`;
        // update items total
        const totalAct=p.items.reduce((s,i)=>{const{rate:r}=getDayRate(i.currency,p.start);return s+(i.amount??0)*r;},0);
        const totEl=document.querySelector(`#card-${pid} .items-total-val`);
        if(totEl) totEl.textContent=`R$ ${N(totalAct)}`;
      }
    }
    // a receita afeta sell-on/intermed/taxes em modo %; recalcula todos os tags
    const refreshSaleTags=()=>{
      const sa=document.getElementById(`sale-brl-${pid}`); if(sa) sa.innerHTML=hSaleBRL(p);
      const sd=document.getElementById(`solid-brl-${pid}`); if(sd) sd.innerHTML=hSolidariedadeBRL(p);
      const so=document.getElementById(`sell-on-brl-${pid}`); if(so) so.innerHTML=hSellOnBRL(p);
      const im=document.getElementById(`intermed-brl-${pid}`); if(im) im.innerHTML=hIntermedBRL(p);
      const tx=document.getElementById(`taxes-brl-${pid}`); if(tx) tx.innerHTML=hTaxesBRL(p);
      for(const ex of (p.saleExtras||[])){
        const el=document.getElementById(`extra-brl-${ex.id}`); if(el) el.innerHTML=hSaleExtraBRL(p,ex);
      }
    };
    if(field==='saleAmount') refreshSaleTags();
    if(field==='solidariedadePct') refreshSaleTags();
    if(field==='sellOnPct'){ const so=document.getElementById(`sell-on-brl-${pid}`); if(so) so.innerHTML=hSellOnBRL(p); }
    if(field==='saleIntermed'||field==='saleIntermedPct'){ const im=document.getElementById(`intermed-brl-${pid}`); if(im) im.innerHTML=hIntermedBRL(p); }
    if(field==='saleTaxes'||field==='saleTaxesPct'){ const tx=document.getElementById(`taxes-brl-${pid}`); if(tx) tx.innerHTML=hTaxesBRL(p); }
    if(['salary','imageRights','inssPct','irpfPct'].includes(field)){ const pe=document.getElementById(`payroll-eco-${pid}`); if(pe) pe.innerHTML=hPayrollEco(p); }
    refreshResults(pid);
  });

  document.addEventListener('change', e => {
    const t=e.target;
    // Simulador de encerramento (Dashboard)
    if(t.id==='sim-player'){ SIM.playerId=t.value?+t.value:null; const r=document.getElementById('sim-result'); if(r)r.innerHTML=hSimResult(); return; }
    if(t.id==='sim-exit'){ SIM.exit=t.value; const r=document.getElementById('sim-result'); if(r)r.innerHTML=hSimResult(); return; }
    if(t.id==='cut-date'){ CUT.date=t.value||''; renderAll(); return; }
    const field=t.dataset.field;
    if(!['start','end','exit'].includes(field)) return;
    const pid=+t.dataset.pid;
    const p=findAny(pid);
    if(!p) return;
    p[field]=t.value;
    saveDraft();
    const moEl=document.getElementById(`months-${pid}`);
    if(moEl){ const cc=calcPlayer(p); moEl.innerHTML=cc?`<b>${cc.contractMonths}</b> meses de contrato`:''; }
    if(field==='start') {
      // rates change, rebuild all item rows
      const container=document.getElementById(`items-${pid}`);
      if(container) container.innerHTML=p.items.map(it=>hItemRow(pid,it)).join('');
    }
    const brlEl=document.getElementById(`sale-brl-${pid}`);
    if(brlEl) brlEl.innerHTML=hSaleBRL(p);
    const sdEl=document.getElementById(`solid-brl-${pid}`);
    if(sdEl) sdEl.innerHTML=hSolidariedadeBRL(p);
    const soEl=document.getElementById(`sell-on-brl-${pid}`);
    if(soEl) soEl.innerHTML=hSellOnBRL(p);
    const imEl=document.getElementById(`intermed-brl-${pid}`);
    if(imEl) imEl.innerHTML=hIntermedBRL(p);
    const txEl=document.getElementById(`taxes-brl-${pid}`);
    if(txEl) txEl.innerHTML=hTaxesBRL(p);
    for(const ex of (p.saleExtras||[])){
      const exEl=document.getElementById(`extra-brl-${ex.id}`); if(exEl) exEl.innerHTML=hSaleExtraBRL(p,ex);
    }
    const peEl=document.getElementById(`payroll-eco-${pid}`);
    if(peEl) peEl.innerHTML=hPayrollEco(p);
    refreshResults(pid);
    schedulePrefetch();   // novas datas → buscar PTAX do dia/meses
  });
}

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
async function init() {
  initDB();

  // Carrega salvos + qualquer rascunho migrado do localStorage
  loadLocal();
  view = 'dashboard';
  renderAll();

  const tasks = [fetchLivePTAX()];
  if (_db) {
    setStatus('loading');
    tasks.push(loadFromDB());
  } else {
    setStatus('offline');
  }
  await Promise.all(tasks);
  schedulePrefetch();   // busca PTAX BACEN dos atletas já carregados
}
init();
</script>
</body>
</html>
