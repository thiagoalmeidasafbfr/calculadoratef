<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baixa de Intangível — Glorioso Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --gold:#be8c4a;--gold-soft:#dcc89a;--gold-deep:#7a6244;
  --gold-tint:rgba(190,140,74,.12);--gold-ring:rgba(190,140,74,.22);
  --ink-1:#1a1410;--ink-2:#3a2e1c;--ink-4:rgba(26,20,16,.55);
  --cream-page:#f9f7f2;--cream-canvas:#f5f2eb;--cream-card:#fdfbf6;--cream-inset:#ece6d8;--tbl-head:#e7e5de;
  --dark:#1a1410;--on-dark:#f3eee2;--on-dark-d:rgba(243,238,226,.45);--on-dark-m:rgba(243,238,226,.28);
  --pos:#166534;--pos-t:#dcf0e4;--neg:#b91c1c;--neg-t:#fce8e8;
  --warn:#b88a2a;--amber:#d97706;
  --div:rgba(26,20,16,.08);--div-m:rgba(26,20,16,.13);
  --sh-h:0 1px 0 rgba(40,32,22,.04);--sh-l:0 1px 0 rgba(40,32,22,.04),0 4px 12px -8px rgba(40,32,22,.10);
  --r-xs:4px;--r-sm:8px;--r-md:10px;--r-lg:14px;--r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream-page);color:var(--ink-1);line-height:1.5;min-height:100vh;font-size:14px}

/* ── HERO ─────────────────────────────────────────────── */
.hero{background:var(--dark);border-radius:var(--r-lg);margin:14px 20px 0;padding:22px 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-eyebrow{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--on-dark-d);margin-bottom:6px}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.4rem,4vw,2.4rem);font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--on-dark)}
.hero-title em{font-family:'Space Grotesk',sans-serif;font-style:normal;font-weight:500;color:var(--gold)}
.hero-sub{font-family:'Inter',sans-serif;font-size:9.5px;color:var(--on-dark-d);letter-spacing:.04em;margin-top:8px}
.hero-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:2px}
.hero-btn{padding:7px 14px;border-radius:var(--r-pill);border:1px solid rgba(243,238,226,.18);background:rgba(243,238,226,.07);color:var(--on-dark);font-family:'Inter',sans-serif;font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.hero-btn:hover{background:rgba(243,238,226,.14)}
.ptax-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(243,238,226,.07);border:1px solid rgba(243,238,226,.12);border-radius:var(--r-pill);font-family:'Inter',sans-serif;font-size:9px;color:var(--on-dark-d)}
.ptax-chip strong{font-weight:600;color:var(--on-dark);font-size:9.5px}
.ptax-refresh{border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--on-dark-m);padding:0;transition:color .15s}
.ptax-refresh:hover{color:var(--gold)}

/* ── LAYOUT ───────────────────────────────────────────── */
.page-body{padding:16px 20px 32px}
.sec-eyebrow{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}

/* ── PLAYER GRID ──────────────────────────────────────── */
.players-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.players-grid.cad{grid-template-columns:1fr;max-width:840px;margin-left:auto;margin-right:auto}
.players-grid.dash{grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr))}
.add-player-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-pill);border:1.5px dashed var(--gold-deep);background:transparent;color:var(--gold-deep);font-family:'Inter',sans-serif;font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .15s;margin-bottom:20px}
.add-player-btn:hover{background:var(--gold-tint);border-color:var(--gold)}

/* ── PLAYER CARD ───────────────────────────────────────── */
.pcard{background:var(--cream-card);border:1px solid var(--div);border-radius:var(--r-lg);box-shadow:var(--sh-h);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s}
.pcard:hover{box-shadow:var(--sh-l)}

/* head */
.pcard-head{background:var(--dark);padding:11px 16px;display:flex;align-items:center;gap:12px}
.pcard-idx{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--gold-soft);opacity:.6;flex-shrink:0;min-width:20px}
.pcard-name{flex:1;min-width:0;background:rgba(243,238,226,.07);border:1px solid rgba(243,238,226,.14);border-radius:var(--r-sm);padding:8px 12px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--on-dark);outline:none;transition:border-color .15s,background .15s}
.pcard-name:focus{border-color:var(--gold);background:rgba(243,238,226,.11)}
.pcard-name::placeholder{color:var(--on-dark-m);font-weight:500}
.pcard-remove{border:none;background:transparent;color:var(--on-dark-m);font-size:9px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.pcard-remove:hover{background:rgba(185,28,28,.22);color:#f87171}

/* section scaffold — one rhythm for every block of the form */
.psec{padding:12px 16px;border-top:1px solid var(--div)}
.psec-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:24px}
.psec-title{display:flex;align-items:baseline;gap:8px;min-width:0}
.psec-num{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:var(--gold);letter-spacing:.05em}
.psec-lbl{font-family:'Inter',sans-serif;font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.psec-meta{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.psec-meta b{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;letter-spacing:0;color:var(--warn);text-transform:none}
.psec-hint{font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-4);line-height:1.5}
/* collapsible (Folha) */
.psec-fold>summary{cursor:pointer;list-style:none;margin-bottom:0}
.psec-fold>summary::-webkit-details-marker{display:none}
.psec-fold[open]>summary{margin-bottom:12px}
.psec-fold>summary::after{content:'▾';color:var(--ink-4);font-size:10px;margin-left:8px;transition:transform .15s}
.psec-fold[open]>summary::after{transform:rotate(180deg)}

/* contract dates */
.contract-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.d-group{display:flex;flex-direction:column;gap:5px;min-width:0}
.d-lbl{font-family:'Inter',sans-serif;font-size:8px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4)}
.d-inp{background:var(--cream-canvas);border:1px solid var(--div-m);border-radius:var(--r-sm);padding:7px 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--ink-1);outline:none;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.d-inp:focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-ring)}
.d-arrow{color:var(--ink-4);font-size:13px;padding-bottom:8px}
.d-months{margin-left:auto;font-family:'Inter',sans-serif;font-size:10px;color:var(--ink-4);padding-bottom:8px;white-space:nowrap}
.d-months b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink-2)}

/* items */
.add-item-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border:1px solid var(--div-m);border-radius:var(--r-pill);background:transparent;color:var(--gold-deep);font-family:'Inter',sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .12s}
.add-item-btn:hover{background:var(--gold-tint);border-color:var(--gold)}
.item-row{display:grid;grid-template-columns:minmax(140px,1fr) 150px 104px minmax(104px,150px) 26px;gap:8px;align-items:center;margin-bottom:6px}
.lbl-inp{background:var(--cream-canvas);border:1px solid var(--div);border-radius:var(--r-sm);padding:7px 10px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--ink-1);outline:none;width:100%;min-width:0;transition:border-color .15s}
.lbl-inp:focus{border-color:var(--gold)}
.amt-wrap{display:flex;align-items:center;background:var(--cream-canvas);border:1px solid var(--div);border-radius:var(--r-sm);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.amt-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-ring)}
.amt-inp{background:transparent;border:none;outline:none;padding:7px 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-1);width:100%;text-align:right;min-width:0}
.cur-toggle{display:flex;background:var(--cream-inset);border:1px solid var(--div);border-radius:var(--r-sm);overflow:hidden}
.cur-btn{flex:1;padding:6px 0;border:none;background:transparent;color:var(--ink-4);font-family:'Inter',sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:all .12s;min-width:24px}
.cur-btn.on{background:var(--dark);color:var(--gold-soft)}
.brl-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--warn);text-align:right;white-space:nowrap;padding:0 2px}
.del-item-btn{width:24px;height:24px;border:none;background:transparent;color:var(--ink-4);font-size:14px;cursor:pointer;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.del-item-btn:hover{background:var(--neg-t);color:var(--neg)}
.base-cfg{position:relative;overflow:visible}
.base-cfg-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:6px 8px;border:1px solid var(--div);background:var(--cream-inset);color:var(--ink-2);font-family:'Inter',sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.03em;cursor:pointer;border-radius:var(--r-sm);white-space:nowrap}
.base-cfg-btn:hover{background:var(--gold-tint);border-color:var(--gold-ring)}
.base-cfg-pop{position:absolute;top:calc(100% + 4px);right:0;z-index:50;background:var(--cream,#fff);border:1px solid var(--gold-ring);border-radius:var(--r-sm);padding:8px 10px;min-width:190px;display:flex;flex-direction:column;gap:5px;font-family:'Inter',sans-serif;font-size:10.5px;color:var(--ink-2);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.base-cfg-pop .bcfg-hdr{font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:2px}
.base-cfg-pop label{display:flex;align-items:center;gap:7px;cursor:pointer;line-height:1.25}
.base-cfg-pop input[type=checkbox]{accent-color:var(--gold-deep,#8b6a2a);cursor:pointer}
.bcfg-presets{display:flex;flex-direction:column;gap:4px}
.bcfg-preset{width:100%;padding:6px 8px;border:1px solid var(--div);background:var(--cream-inset);color:var(--ink-2);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:.03em;cursor:pointer;border-radius:var(--r-sm);white-space:nowrap;text-align:left}
.bcfg-preset:hover{background:var(--gold-tint);border-color:var(--gold-ring)}
.bcfg-preset.on{background:var(--dark);color:var(--gold-soft);border-color:var(--dark)}
.bcfg-divider{height:1px;background:var(--div);margin:2px 0}
.items-total-val{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--warn)}

/* sale & deductions — one aligned grid for every row */
.sale-block{display:flex;flex-direction:column;gap:7px}
.dedu-wrap{display:flex;align-items:center;gap:6px}
.dedu-wrap.is-dragging{opacity:.4}
.dedu-wrap.drop-target-before{box-shadow:0 -2px 0 0 var(--gold-ring) inset;border-top:2px solid var(--gold-ring);margin-top:-2px}
.dedu-wrap.drop-target-after{border-bottom:2px solid var(--gold-ring);margin-bottom:-2px}
.dedu-wrap .sale-row{flex:1;min-width:0}
.drag-handle{flex:0 0 18px;width:18px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--ink-4);cursor:grab;font-size:13px;line-height:1;user-select:none;border-radius:var(--r-sm)}
.drag-handle:hover{color:var(--ink-2);background:var(--gold-tint)}
.drag-handle:active{cursor:grabbing}
.dedu-spacer{flex:0 0 18px;width:18px}
.sale-row{display:grid;grid-template-columns:128px minmax(110px,1.1fr) 74px minmax(78px,96px) minmax(96px,118px) minmax(60px,1fr);gap:8px;align-items:center}
.sale-lbl{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;color:var(--ink-2);white-space:normal;overflow:visible;line-height:1.25;word-break:break-word}
.sale-amt,.sale-tg-mode,.sale-tg-sec{width:auto;min-width:0}
.sale-brl-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct-suffix{padding:0 8px 0 2px;font-family:'Inter',sans-serif;font-size:10px;color:var(--ink-4);flex-shrink:0;white-space:nowrap}
.dedu-sub{font-family:'Inter',sans-serif;font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);margin:5px 0 0}

/* folha (collapsible) */
.folha-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.f-lbl{font-family:'Inter',sans-serif;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4)}

/* result equation */
.venda-eq{display:flex;align-items:stretch;flex-wrap:wrap;background:var(--dark);overflow:hidden}
.eq-cell{padding:9px 12px;text-align:center;border-right:1px solid rgba(243,238,226,.07);display:flex;flex-direction:column;justify-content:center;gap:3px}
.eq-cell:last-child{border-right:none;flex:1}
.eq-lbl{font-family:'Inter',sans-serif;font-size:7px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-m);white-space:nowrap}
.eq-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--on-dark);white-space:nowrap}
.eq-op{padding:0 4px;color:var(--on-dark-m);font-size:14px;font-weight:300;align-self:center;flex-shrink:0}
.eq-pos{color:#86efac!important}
.eq-neg{color:#f9a0a0!important}

/* result strip — the payoff, set apart from the inputs */
.pcard-results{border-top:1px solid var(--div-m);background:var(--cream-canvas)}
.results-strip{display:flex}
.rs-box{flex:1;padding:10px 12px;text-align:center;border-right:1px solid var(--div)}
.rs-box:last-child{border-right:none}
.rs-lbl{font-family:'Inter',sans-serif;font-size:7.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4);display:block;margin-bottom:4px}
.rs-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.rs-sub{font-family:'Inter',sans-serif;font-size:8px;color:var(--ink-4);display:block;margin-top:3px;letter-spacing:.03em}
.rs-val-amber{color:var(--amber)!important}
.rs-val-neg{color:var(--neg)!important}
.rs-val-gold{color:var(--gold-deep)!important}
.rs-val-pos{color:var(--pos)!important}
.rs-empty{padding:18px 14px;font-family:'Inter',sans-serif;font-size:10px;color:var(--ink-4);text-align:center;letter-spacing:.02em;background:var(--cream-canvas)}
.eco-note{padding:9px 14px;font-family:'Inter',sans-serif;font-size:9.5px;color:var(--ink-4);letter-spacing:.02em;background:var(--cream-card);border-top:1px solid var(--div);line-height:1.5}
.eco-note strong{color:var(--ink-2);font-weight:600}
.eco-note .eco-tot{color:var(--pos);font-weight:700}

/* ── SUMMARY TABLE ────────────────────────────────────── */
.section-card{background:var(--cream-card);border:1px solid var(--div);border-radius:var(--r-lg);box-shadow:var(--sh-h);padding:20px 22px;margin-bottom:18px;overflow-x:auto}
.stbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.stbl th{padding:8px 12px;text-align:right;font-family:'Inter',sans-serif;font-size:7.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);background:var(--tbl-head);border-bottom:2px solid var(--div-m);white-space:nowrap}
.stbl th:first-child{text-align:left;border-radius:var(--r-xs) 0 0 0}
.stbl th:last-child{border-radius:0 var(--r-xs) 0 0}
.stbl td{padding:9px 12px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-2);border-bottom:1px solid var(--div);white-space:nowrap}
.stbl td:first-child{text-align:left;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--ink-1)}
.stbl tr:last-child td{border-bottom:none}
.stbl tbody tr:hover td{background:var(--cream-inset)}
.stbl .tr-total td{background:var(--tbl-head);border-top:2px solid var(--div-m);font-weight:500}
.stbl .tr-total td:first-child{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep)}
.td-neg{color:var(--neg)!important}
.td-amber{color:var(--amber)!important}
.td-gold{color:var(--gold-deep)!important;font-weight:600!important}
.td-warn{color:var(--warn)!important}
.td-pos{color:var(--pos)!important}
.td-dim{color:var(--ink-4)!important}
.chip-saída{display:inline-block;font-family:'Inter',sans-serif;font-size:7px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-tint);color:var(--gold-deep);border:1px solid var(--gold-ring);padding:1px 5px;border-radius:var(--r-xs);vertical-align:middle;margin-left:4px}
.chip-pos{background:var(--pos-t);color:var(--pos);border-color:rgba(22,101,52,.2)}
.chip-neg{background:var(--neg-t);color:var(--neg);border-color:rgba(185,28,28,.2)}

/* ── MONTHLY VIEW ─────────────────────────────────────── */
.monthly-tbl{border-collapse:collapse;font-size:11px;min-width:100%}
.monthly-tbl th{position:sticky;top:0;z-index:1;padding:7px 10px;text-align:right;font-family:'Inter',sans-serif;font-size:7px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-deep);background:var(--tbl-head);border-bottom:2px solid var(--div-m);white-space:nowrap}
.monthly-tbl th:first-child{text-align:left;min-width:120px;font-size:8.5px;color:var(--ink-2);position:sticky;left:0;z-index:2}
.monthly-tbl th.th-total{background:var(--cream-inset)}
.monthly-tbl td{padding:6px 10px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;border-bottom:1px solid var(--div);white-space:nowrap;color:var(--ink-2)}
.monthly-tbl td:first-child{text-align:left;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;color:var(--ink-1);letter-spacing:0;background:var(--cream-canvas);position:sticky;left:0;border-right:1px solid var(--div)}
.monthly-tbl .td-active{color:var(--amber)}
.monthly-tbl .td-exit{background:rgba(190,140,74,.1);color:var(--gold-deep);font-weight:500}
.monthly-tbl .td-exited{color:var(--div-m)}
.monthly-tbl .td-inactive{color:var(--div-m)}
.monthly-tbl .td-total{background:var(--cream-canvas);font-weight:500;color:var(--ink-2);border-left:1px solid var(--div-m)}
.monthly-tbl .td-total-drop{color:var(--pos)!important;font-weight:600!important}
.monthly-tbl tbody tr:hover td{filter:brightness(.97)}
.monthly-tbl .tr-divider td{background:var(--cream-inset);padding:3px 10px;font-family:'Inter',sans-serif;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--div-m);border-bottom:1px solid var(--div-m)}
.monthly-scroll{overflow:auto;max-height:480px;border:1px solid var(--div);border-radius:var(--r-sm)}
.monthly-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}

const SUPA_URL   = 'https://cqswdemcctdbwqykdoaf.supabase.co';
const SUPA_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxc3dkZW1jY3RkYndxeWtkb2FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NjI5NjIsImV4cCI6MjA5NzMzODk2Mn0.ky31MgxXDCzOemhMRxxAhIdY3_tt4juvB-iT9gj7CXo';
const DB_TABLE   = 'tef_state';
const DB_ROW     = 'baixa_v1';

let _db        = null;
let _saveTimer = null;

function initDB() {
  if (typeof supabase === 'undefined') return;
  _db = supabase.createClient(SUPA_URL, SUPA_KEY);
}

function setStatus(s) {
  const el = document.getElementById('save-status');
  if (!el) return;
  const MAP = {
    loading: ['Carregando…',   'rgba(243,238,226,.38)'],
    saving:  ['Salvando…',     'rgba(243,238,226,.38)'],
    saved:   ['● Salvo',       '#86efac'],

  };

}

  if (!_db) return;
  setStatus('loading');
  const { data, error } = await _db
    .from(DB_TABLE).select('state').eq('id', DB_ROW).maybeSingle();
  if (error) { console.error('Supabase load:', error); setStatus('error'); return; }
  if (data?.state) {
    const d = data.state;
    if (d.S?.players?.length) { S = d.S; _pid = d._pid || _pid; _iid = d._iid || _iid; }
    reconcileCounters();
    saveSavedLocal();   // keep localStorage in sync
    renderAll();
    schedulePrefetch();
  }
  setStatus('saved');
}

function saveToDB() {
  if (!_db) return;
  setStatus('saving');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    const { error } = await _db.from(DB_TABLE).upsert(

      { onConflict: 'id' }

// ═══════════════════════════════════════════════════════════════════
// PTAX HISTÓRICO (xlsx Cotações, cotação mensal de fechamento)
// ═══════════════════════════════════════════════════════════════════
const FX_HIST = {
  '2024-01':{USD:4.9526,EUR:5.3567},'2024-02':{USD:4.9716,EUR:5.3708},
  '2024-03':{USD:5.0153,EUR:5.4120},'2024-04':{USD:5.1934,EUR:5.5382},
  '2024-05':{USD:5.2443,EUR:5.6853},'2024-06':{USD:5.5925,EUR:5.9912},
  '2024-07':{USD:5.6500,EUR:6.1161},'2024-08':{USD:5.6103,EUR:6.1977},
  '2024-09':{USD:5.4482,EUR:6.0677},'2024-10':{USD:5.7867,EUR:6.2977},
  '2024-11':{USD:5.9730,EUR:6.3164},'2024-12':{USD:6.1840,EUR:6.4023},
  '2025-01':{USD:5.8410,EUR:6.0524},'2025-02':{USD:5.8852,EUR:6.1059},
  '2025-03':{USD:5.7047,EUR:6.1708},'2025-04':{USD:5.6740,EUR:6.4269},
  '2025-05':{USD:5.7224,EUR:6.4932},'2025-06':{USD:5.4321,EUR:6.4023},
  '2025-07':{USD:5.6008,EUR:6.3933},'2025-08':{USD:5.4299,EUR:6.3443},
  '2025-09':{USD:5.3224,EUR:6.2447},'2025-10':{USD:5.3739,EUR:6.1983},
  '2025-11':{USD:5.3363,EUR:6.1874},'2025-12':{USD:5.4770,EUR:6.4327},
  '2026-01':{USD:5.2571,EUR:6.2286},'2026-02':{USD:5.1300,EUR:6.0601},
  '2026-03':{USD:5.1813,EUR:5.9851},'2026-04':{USD:4.9539,EUR:5.8109},
};
let LIVE_FX = {USD:null,EUR:null,date:''};

async function fetchLivePTAX() {
  try {
    const r = await fetch('https://economia.awesomeapi.com.br/json/last/EUR-BRL,USD-BRL');
    const j = await r.json();
    if (j.EURBRL) LIVE_FX.EUR = parseFloat(j.EURBRL.bid);
    if (j.USDBRL) LIVE_FX.USD = parseFloat(j.USDBRL.bid);
    if (j.EURBRL?.create_date) {
      const d = j.EURBRL.create_date.split(' ')[0];
      LIVE_FX.date = d;
      const ym = d.substring(0,7);
      if (!FX_HIST[ym]) FX_HIST[ym] = {USD:LIVE_FX.USD, EUR:LIVE_FX.EUR};
    }
  } catch(e) { console.warn('PTAX err:', e); }
  updatePTAXChip();
}

function updatePTAXChip() {
  const el = document.getElementById('ptax-chip');
  if (!el) return;
  const fE = LIVE_FX.EUR ? LIVE_FX.EUR.toFixed(4) : '—';
  const fU = LIVE_FX.USD ? LIVE_FX.USD.toFixed(4) : '—';
  el.innerHTML = `<span>EUR</span><strong>${fE}</strong><span style="opacity:.3">|</span><span>USD</span><strong>${fU}</strong>${LIVE_FX.date?`<span style="font-size:8px">${fmtD(LIVE_FX.date)}</span>`:''}<button class="ptax-refresh" onclick="fetchLivePTAX()">↻</button>`;
}

// ── BACEN PTAX (cotação oficial) ────────────────────────────────────
// FX_BACEN: fechamento mensal real (amortização) · FX_DAYS: série diária (registro)
const FX_BACEN = {};         // 'YYYY-MM' -> {EUR,USD,...}  (última cotação do mês)
const FX_DAYS  = {};         // 'EUR' -> [{d:'YYYY-MM-DD',rate}] asc
const _fxLoaded = {};        // 'EUR' -> {start,end} já buscados
let _fxBusy = 0;
const BACEN_BASE='https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata';
function _bcDate(iso){const[y,m,d]=iso.split('-');return `${m}-${d}-${y}`;}
function _todayISO(){return new Date().toISOString().slice(0,10);}
function _addDaysISO(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}

function updateFxStatus(){
  const el=document.getElementById('fx-status');
  if(el) el.textContent=_fxBusy>0?'PTAX BACEN…':'';
}

// busca a série diária de PTAX (venda) de uma moeda e popula os caches
async function loadBacenSeries(cur,startISO,endISO){
  if(cur==='BRL') return false;
  if(endISO>_todayISO()) endISO=_todayISO();
  if(startISO>endISO) return false;
  const cov=_fxLoaded[cur];
  if(cov && startISO>=cov.start && endISO<=cov.end) return false;
  const s=cov?(startISO<cov.start?startISO:cov.start):startISO;
  const e=cov?(endISO>cov.end?endISO:cov.end):endISO;
  const url=`${BACEN_BASE}/CotacaoMoedaPeriodo(moeda=@moeda,dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)`
    +`?@moeda='${cur}'&@dataInicial='${_bcDate(s)}'&@dataFinalCotacao='${_bcDate(e)}'`
    +`&$top=100000&$format=json&$select=cotacaoVenda,dataHoraCotacao`;
  _fxBusy++; updateFxStatus();
  let changed=false;
  try{
    const r=await fetch(url); const j=await r.json();
    const byDay={};
    for(const x of (j.value||[])){ if(x.cotacaoVenda>0) byDay[x.dataHoraCotacao.slice(0,10)]=x.cotacaoVenda; }
    const arr=Object.keys(byDay).sort().map(d=>({d,rate:byDay[d]}));
    if(arr.length){
      FX_DAYS[cur]=arr;
      const byMonth={};
      for(const {d,rate} of arr) byMonth[d.slice(0,7)]=rate;   // asc → última do mês
      for(const ym in byMonth){ (FX_BACEN[ym]=FX_BACEN[ym]||{})[cur]=byMonth[ym]; }
      _fxLoaded[cur]={start:s,end:e};
      changed=true;
    }
  }catch(err){ console.warn('BACEN err',cur,err); }
  _fxBusy--; updateFxStatus();
  return changed;
}

// cotação de FECHAMENTO MENSAL (amortização): BACEN > tabela local > live
function getRate(currency, ym) {
  if (currency==='BRL') return {rate:1,src:'BRL'};
  if (ym && FX_BACEN[ym]?.[currency]) return {rate:FX_BACEN[ym][currency],src:`BACEN ${ym}`};
  if (ym){
    const bk=Object.keys(FX_BACEN).filter(k=>FX_BACEN[k][currency]).sort();
    for(const k of [...bk].reverse()){ if(k<=ym) return {rate:FX_BACEN[k][currency],src:`BACEN ${k}*`}; }
  }
  if (ym && FX_HIST[ym]) return {rate:FX_HIST[ym][currency],src:`tabela ${ym}`};
  if (ym) {
    const keys = Object.keys(FX_HIST).sort();
    for (const k of [...keys].reverse()) { if (k<=ym) return {rate:FX_HIST[k][currency],src:`tabela ${k}*`}; }
  }
  if (LIVE_FX[currency]) return {rate:LIVE_FX[currency],src:'live'};
  return {rate:1,src:'?'};
}

// cotação do DIA EXATO (registro do custo/venda): última PTAX em/antes da data
function getDayRate(currency, isoDate) {
  if (currency==='BRL') return {rate:1,src:'BRL'};
  const arr=FX_DAYS[currency];
  if (isoDate && arr && arr.length){
    let hit=null;
    for(const x of arr){ if(x.d<=isoDate) hit=x; else break; }
    if(hit) return {rate:hit.rate,src:`BACEN ${hit.d}`};
  }
  return getRate(currency, ymStr(isoDate||''));   // fallback até a série carregar
}

// agenda a busca das cotações necessárias e re-renderiza quando chegam
let _fxPrefetchTimer=null;
function schedulePrefetch(){ clearTimeout(_fxPrefetchTimer); _fxPrefetchTimer=setTimeout(prefetchRates,250); }
async function prefetchRates(){
  const players=[...S.players,...S.players];
  const curs=new Set(); let minISO=null,maxISO=null;
  const note=iso=>{ if(!iso)return; if(!minISO||iso<minISO)minISO=iso; if(!maxISO||iso>maxISO)maxISO=iso; };
  for(const p of players){
    if(!p.start) continue;
    for(const it of p.items) if(it.amount && it.currency!=='BRL') curs.add(it.currency);
    if(p.saleAmount && p.saleCurrency!=='BRL') curs.add(p.saleCurrency);
    if((p.saleIntermedMode||'valor')==='valor' && p.saleIntermed && (p.saleIntermedCurrency||'BRL')!=='BRL') curs.add(p.saleIntermedCurrency);
    if((p.saleTaxesMode||'valor')==='valor' && p.saleTaxes && (p.saleTaxesCurrency||'BRL')!=='BRL') curs.add(p.saleTaxesCurrency);
    note(p.start); note(p.end); note(p.exit);
  }
  if(!curs.size||!minISO) return;
  const startISO=_addDaysISO(minISO,-12);
  let endISO=maxISO||_todayISO(); if(endISO>_todayISO()) endISO=_todayISO();
  const res=await Promise.all([...curs].map(c=>loadBacenSeries(c,startISO,endISO)));
  if(res.some(Boolean)) safeRerenderAfterFx();
}

// Quais deduções podem entrar na base de cada uma (ordem definida pelo usuário)
const SALE_DEDUCTION_LABELS = {solidariedade:'Solidariedade',sellOn:'Sell-on fee',intermed:'Intermediação',taxes:'Impostos e taxas',acquisition:'Custo de aquisição'};
const FIXED_DEDUCTIONS = ['solidariedade','sellOn','intermed','taxes'];
const SALE_INCL_FIELD = {solidariedade:'solidariedadeIncl',sellOn:'sellOnIncl',intermed:'saleIntermedIncl',taxes:'saleTaxesIncl'};

function dedLabel(p, key){
  if (key==='acquisition') return SALE_DEDUCTION_LABELS.acquisition;
  if (key.startsWith('extra:')){
    const ex=(p.saleExtras||[]).find(x=>x.id===+key.slice(6));
    return ex?.label || 'Dedução';
  }
  return SALE_DEDUCTION_LABELS[key] || key;
}

// Ordem das deduções na seção de venda (reordenável). Inicializa lazy.
function getSaleOrder(p){
  if (!Array.isArray(p.saleDeductionOrder)) p.saleDeductionOrder=[];
  const ord = p.saleDeductionOrder;
  const seen = new Set(ord);
  for (const k of FIXED_DEDUCTIONS) if (!seen.has(k)) { ord.push(k); seen.add(k); }
  const validExtras = new Set((p.saleExtras||[]).map(x=>'extra:'+x.id));
  for (const ex of (p.saleExtras||[])){
    const k='extra:'+ex.id;
    if (!seen.has(k)) { ord.push(k); seen.add(k); }
  }
  // Remove referências a extras que não existem mais
  for (let i=ord.length-1;i>=0;i--){
    const k=ord[i];
    if (k.startsWith('extra:') && !validExtras.has(k)) ord.splice(i,1);
  }
  return ord;
}

function getSaleIncl(p, tag){
  if (tag.startsWith('extra:')){
    const eid=+tag.slice(6);
    const ex=(p.saleExtras||[]).find(x=>x.id===eid);
    if (!ex) return [];
    if (Array.isArray(ex.incl)) return ex.incl;
    ex.incl = ex.method==='bruto' ? ['solidariedade'] : ['solidariedade','acquisition'];
    return ex.incl;
  }
  const field = SALE_INCL_FIELD[tag];
  if (!field) return [];
  if (Array.isArray(p[field])) return p[field];
  // Padrões: solidariedade incide sobre receita bruta; demais herdam do método legado
  if (tag==='solidariedade'){ p[field]=[]; return p[field]; }
  const legacy = {sellOn:'sellOnMethod',intermed:'saleIntermedMethod',taxes:'saleTaxesMethod'}[tag];
  p[field] = p[legacy]==='bruto' ? ['solidariedade'] : ['solidariedade','acquisition'];
  return p[field];
}
function setSaleIncl(p, tag, arr){
  if (tag.startsWith('extra:')){
    const eid=+tag.slice(6);
    const ex=(p.saleExtras||[]).find(x=>x.id===eid);
    if (ex) ex.incl = arr;
    return;
  }
  const field = SALE_INCL_FIELD[tag];
  if (field) p[field] = arr;
}
// Itens disponíveis para a base de uma dedução: tudo que aparece antes dela na ordem atual
function availableBases(p, tag){
  const order = getSaleOrder(p);
  const list = [];
  for (const k of order){
    if (k===tag) break;
    list.push({key:k, label: dedLabel(p,k)});
  }
  list.push({key:'acquisition', label: SALE_DEDUCTION_LABELS.acquisition});
  return list;
}

function isEmptyPlayer(p){
  return !p.name && !p.start && !p.end && !p.exit
    && p.saleAmount==null && p.solidariedadePct==null && p.saleIntermed==null && p.saleIntermedPct==null && p.sellOnPct==null && p.saleTaxes==null && p.saleTaxesPct==null && p.salary==null && p.imageRights==null
    && !p.items.some(i=>i.amount)
    && !(p.saleExtras||[]).some(e=>e.label||e.val||e.pct);
}
// mantém os contadores de id acima de qualquer id já existente em S

    if(!Array.isArray(p.saleExtras)) p.saleExtras=[];
    for(const ex of p.saleExtras) if(ex.id>_eid)_eid=ex.id;
  }
}

// CALC
// ═══════════════════════════════════════════════════════════════════
function monthsInc(a,b){return (b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+1;}
function pDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function ymStr(dateStr){return dateStr?dateStr.substring(0,7):'';}

function getLatestYM() {
  if (LIVE_FX.date) return LIVE_FX.date.substring(0,7);
  return Object.keys(FX_HIST).sort().pop()??'';
}

// BRL amortization for one player in a specific calendar month using that month's PTAX
function monthlyAmortBRL(p, monthYM) {
  if (!p.start||!p.end) return 0;
  const contractMonths=monthsInc(pDate(p.start),pDate(p.end));
  if (contractMonths<=0) return 0;
  return p.items.reduce((sum,it)=>{
    const amt=it.amount??0;
    if (!amt) return sum;
    const monthlyFX=amt/contractMonths;
    if (it.currency==='BRL') return sum+monthlyFX;
    const {rate}=getRate(it.currency,monthYM);
    return sum+monthlyFX*rate;
  },0);
}

// Sum BRL amortizations over [startM, endM] (Date objects, first-of-month, inclusive)
function amortRange(p, startM, endM) {
  let total=0;
  let cur=new Date(startM);
  while (cur<=endM) {
    const ym=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');
    total+=monthlyAmortBRL(p,ym);
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return total;
}

// Build sorted array of first-of-month Dates spanning all players' ranges
function buildMonthRange(players) {
  let minD=null, maxD=null;
  for (const p of players) {
    if (!p.start) continue;
    const s=pDate(p.start);
    if (!minD||s<minD) minD=s;
    const eod=p.exit?pDate(p.exit):(p.end?pDate(p.end):null);
    if (eod&&(!maxD||eod>maxD)) maxD=eod;
  }
  if (!minD) return [];
  if (!maxD) maxD=new Date(minD.getFullYear()+2,minD.getMonth(),1);
  const months=[];
  let cur=new Date(minD.getFullYear(),minD.getMonth(),1);
  const limit=new Date(maxD.getFullYear(),maxD.getMonth()+1,1);
  let cnt=0;
  while(cur<limit&&cnt<72){months.push(new Date(cur));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);cnt++;}
  return months;
}

function calcPlayer(p) {
  if (!p.start || !p.end) return null;
  const startD=pDate(p.start), endD=pDate(p.end);
  if (endD<=startD) return null;
  const contractMonths=monthsInc(startD,endD);
  const startYM=ymStr(p.start);
  const startM=new Date(startD.getFullYear(),startD.getMonth(),1);
  const endM=new Date(endD.getFullYear(),endD.getMonth(),1);

  let exitMonths=null, exitD=null, exitM=null;
  if (p.exit){
    const ed=pDate(p.exit);
    // ignora datas parciais/fora do contrato (ex.: ano ainda incompleto durante digitação)
    if (!isNaN(ed) && ed>=startD && ed<=endD) {
      exitD=ed;
      exitMonths=Math.max(0,Math.min(contractMonths,monthsInc(startD,exitD)));
      exitM=new Date(exitD.getFullYear(),exitD.getMonth(),1);
    }
  }

  // Totals using actual monthly PTAX rates
  const totAct=amortRange(p,startM,endM);
  let totAmort=0;
  if (exitM) totAmort=amortRange(p,startM,exitM);
  const totResid=totAct-totAmort;

  const monthsRemaining=exitMonths!==null?contractMonths-exitMonths:null;
  // Monthly display at latest available PTAX
  const monthlyTotal=monthlyAmortBRL(p,getLatestYM());
  // Future amort avoided = sum of remaining months after exit using their PTAX
  let futureAmortAvoided=null;
  if (exitM) {
    const nextM=new Date(exitM.getFullYear(),exitM.getMonth()+1,1);
    futureAmortAvoided=nextM<=endM?amortRange(p,nextM,endM):0;
  }

  // Economia de folha pelos meses restantes após a saída.
  // Modelo simplificado: salário sem encargos; apenas o 13º (1 salário extra)
  // entra em dezembro. Direito de imagem é custo fixo mensal.
  const Sal=p.salary??0, Img=p.imageRights??0;
  const monthlyPayroll = Sal + Img;                      // mês padrão (jan–nov)
  let payrollSaved=null, payrollSalary=0, payrollImage=0;
  if (exitM){
    let cur=new Date(exitM.getFullYear(),exitM.getMonth()+1,1);
    while(cur<=endM){
      payrollSalary += Sal;
      if (cur.getMonth()===11) payrollSalary += Sal;  // 13º
      payrollImage += Img;
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
    payrollSaved = payrollSalary + payrollImage;
  }
  // Economia total projetada na venda = amortização evitada + folha evitada
  const totalEconomy=(exitMonths!==null)?((futureAmortAvoided??0)+(payrollSaved??0)):null;

  // Per-item detail at start-month rate (for display/export)
  const items=p.items.map(it=>{
    const amt=it.amount??0;
    const {rate,src}=getDayRate(it.currency,p.start);
    const totalBRL=amt*rate;
    const monthlyBRL=contractMonths>0?totalBRL/contractMonths:0;
    const amortBRL=exitMonths!==null?monthlyBRL*exitMonths:0;
    return {...it,rate,src,totalBRL,monthlyBRL,amortBRL,residBRL:totalBRL-amortBRL};
  });

  // Custo de aquisição em BRL ao câmbio da data de aquisição (booking)
  const acqBRL=items.reduce((s,it)=>s+it.totalBRL,0);

  let saleBRL=0,saleRate=1,saleSrc='',gain=null,solidariedadeBRL=0,sellOnFee=0,maisValia=0,saleIntermedBRL=0,saleTaxesBRL=0;
  let extras=[], saleExtrasBRL=0;
  if (p.saleAmount&&exitD){
    const {rate,src}=getDayRate(p.saleCurrency,p.exit);
    saleRate=rate; saleSrc=src;
    saleBRL=p.saleAmount*saleRate;

    // Base configurável por dedução: começa em saleBRL e subtrai cada item marcado.
    // Apenas itens já computados (anteriores na ordem) são subtraíveis.
    const computed={acquisition:totAct};
    const computeBase=(incl)=>{
      let base=saleBRL;
      for (const k of (incl||[])){
        if (computed[k]!=null) base -= computed[k];
      }
      return Math.max(0,base);
    };

    const order = getSaleOrder(p);
    for (const tag of order){
      if (tag==='solidariedade'){
        const base=computeBase(getSaleIncl(p,'solidariedade'));
        solidariedadeBRL=p.solidariedadePct?base*(p.solidariedadePct/100):0;
        computed.solidariedade=solidariedadeBRL;
      } else if (tag==='sellOn'){
        const base=computeBase(getSaleIncl(p,'sellOn'));
        sellOnFee=p.sellOnPct?base*(p.sellOnPct/100):0;
        computed.sellOn=sellOnFee;
      } else if (tag==='intermed'){
        if ((p.saleIntermedMode||'valor')==='pct'){
          const base=computeBase(getSaleIncl(p,'intermed'));
          saleIntermedBRL=p.saleIntermedPct?base*(p.saleIntermedPct/100):0;
        } else if (p.saleIntermed){
          const {rate:ir}=getDayRate(p.saleIntermedCurrency||'BRL',p.exit);
          saleIntermedBRL=p.saleIntermed*ir;
        }
        computed.intermed=saleIntermedBRL;
      } else if (tag==='taxes'){
        if ((p.saleTaxesMode||'valor')==='pct'){
          const base=computeBase(getSaleIncl(p,'taxes'));
          saleTaxesBRL=p.saleTaxesPct?base*(p.saleTaxesPct/100):0;
        } else if (p.saleTaxes){
          const {rate:tr}=getDayRate(p.saleTaxesCurrency||'BRL',p.exit);
          saleTaxesBRL=p.saleTaxes*tr;
        }
        computed.taxes=saleTaxesBRL;
      } else if (tag.startsWith('extra:')){
        const eid=+tag.slice(6);
        const ex=(p.saleExtras||[]).find(x=>x.id===eid);
        if (!ex) continue;
        let brl=0;
        if ((ex.mode||'valor')==='pct'){
          const base=computeBase(getSaleIncl(p,tag));
          brl=ex.pct?base*(ex.pct/100):0;
        } else if (ex.val){
          const {rate:er}=getDayRate(ex.currency||'BRL',p.exit);
          brl=ex.val*er;
        }
        computed[tag]=brl;
        extras.push({id:eid,label:ex.label||'Dedução',brl});
        saleExtrasBRL+=brl;
      }
    }

    // exposto p/ exibições legadas que mostravam "mais-valia"
    maisValia=Math.max(0,saleBRL-solidariedadeBRL-totAct);
    gain=saleBRL-solidariedadeBRL-sellOnFee-saleIntermedBRL-saleTaxesBRL-saleExtrasBRL-totResid;
  }

  return {contractMonths,exitMonths,monthsRemaining,monthlyTotal,futureAmortAvoided,monthlyPayroll,payrollSaved,payrollSalary,payrollImage,totalEconomy,items,totAct,acqBRL,totAmort,totResid,saleBRL,saleRate,saleSrc,gain,solidariedadeBRL,sellOnFee,maisValia,saleIntermedBRL,saleTaxesBRL,saleExtras:extras,saleExtrasBRL,pctAmort:totAct>0?totAmort/totAct*100:0};
}

// Versão do calcPlayer com corte de data (DRE até dia X). Quando cutoffISO é
// vazio, retorna o cálculo na totalidade (igual a calcPlayer).
function calcPlayerCutoff(p, cutoffISO){
  const base = calcPlayer(p);
  if (!base || !cutoffISO) return base;
  const cutoffD = pDate(cutoffISO);
  if (isNaN(cutoffD)) return base;
  const startD = pDate(p.start);
  const endD   = pDate(p.end);
  const startM = new Date(startD.getFullYear(), startD.getMonth(), 1);
  const endM   = new Date(endD.getFullYear(), endD.getMonth(), 1);
  const cutM   = new Date(cutoffD.getFullYear(), cutoffD.getMonth(), 1);
  const exitD  = p.exit ? pDate(p.exit) : null;
  const exitM  = (exitD && !isNaN(exitD)) ? new Date(exitD.getFullYear(), exitD.getMonth(), 1) : null;

  // Corte antes do início do contrato → nada aconteceu ainda
  if (cutM < startM) {
    return {...base,
      totAmort:0, totResid:0,
      saleBRL:0, solidariedadeBRL:0, sellOnFee:0, saleIntermedBRL:0, saleTaxesBRL:0,
      saleExtras:[], saleExtrasBRL:0, gain:null,
      futureAmortAvoided:null, payrollSaved:null, payrollSalary:0, payrollImage:0,
      totalEconomy:null, exitMonths:null, monthsRemaining:null};
  }

  const exitedByCutoff = !!(exitM && exitM <= cutM);

  // Amortização acumulada até min(saída,corte) ou min(fim,corte) se ainda não saiu
  const amortCap = exitedByCutoff ? exitM : (cutM < endM ? cutM : endM);
  const totAmort = amortRange(p, startM, amortCap);
  const totResid = exitedByCutoff ? Math.max(0, base.totAct - totAmort) : 0;

  // Venda/lucro só entram se a saída ocorreu até o corte
  const saleBRL          = exitedByCutoff ? base.saleBRL          : 0;
  const solidariedadeBRL = exitedByCutoff ? base.solidariedadeBRL : 0;
  const sellOnFee        = exitedByCutoff ? base.sellOnFee        : 0;
  const saleIntermedBRL  = exitedByCutoff ? base.saleIntermedBRL  : 0;
  const saleTaxesBRL     = exitedByCutoff ? base.saleTaxesBRL     : 0;
  const saleExtras       = exitedByCutoff ? base.saleExtras       : [];
  const saleExtrasBRL    = exitedByCutoff ? base.saleExtrasBRL    : 0;
  const gain             = exitedByCutoff ? base.gain             : null;

  // Amortização evitada / folha evitada: meses de (saída+1) até min(fim, corte)
  let futureAmortAvoided=null, payrollSaved=null, payrollSalary=0, payrollImage=0;
  if (exitedByCutoff){
    const nextM = new Date(exitM.getFullYear(), exitM.getMonth()+1, 1);
    const cap   = cutM < endM ? cutM : endM;
    futureAmortAvoided = nextM <= cap ? amortRange(p, nextM, cap) : 0;
    const Sal = p.salary??0, Img = p.imageRights??0;
    let cur = new Date(nextM);
    while (cur <= cap){
      payrollSalary += Sal;
      if (cur.getMonth() === 11) payrollSalary += Sal;   // 13º só no salário
      payrollImage  += Img;
      cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    }
    payrollSaved = payrollSalary + payrollImage;
  }
  const totalEconomy   = exitedByCutoff ? ((futureAmortAvoided??0)+(payrollSaved??0)) : null;
  const exitMonths     = exitedByCutoff ? base.exitMonths     : null;
  const monthsRemaining= exitedByCutoff ? base.monthsRemaining: null;

  return {...base, totAmort, totResid, saleBRL, solidariedadeBRL, sellOnFee,
    saleIntermedBRL, saleTaxesBRL, saleExtras, saleExtrasBRL, gain,
    futureAmortAvoided, payrollSaved, payrollSalary, payrollImage, totalEconomy,
    exitMonths, monthsRemaining};
}

// monthly amort for a player in a given month (Date object, first of month)
function monthAmort(p,month) {
  if (!p.start||!p.end) return {amort:0,status:'inactive'};
  const startD=pDate(p.start);
  const startM=new Date(startD.getFullYear(),startD.getMonth(),1);
  const endD=pDate(p.end);
  const endM=new Date(endD.getFullYear(),endD.getMonth(),1);
  if (month<startM||month>endM) return {amort:0,status:'inactive'};
  const ym=month.getFullYear()+'-'+String(month.getMonth()+1).padStart(2,'0');
  const amort=monthlyAmortBRL(p,ym);
  if (p.exit) {
    const exitD=pDate(p.exit);
    const exitM=new Date(exitD.getFullYear(),exitD.getMonth(),1);
    if (month.getTime()===exitM.getTime()) return {amort,status:'exit'};
    if (month>exitM) return {amort:0,status:'exited'};
  }
  return {amort,status:'active'};
}

// ═══════════════════════════════════════════════════════════════════
// LANÇAMENTOS (extrato — uma linha por parcela mensal de cada item)
// ═══════════════════════════════════════════════════════════════════
// Gera o "banco de dados" de parcelas: para cada atleta, cada item com valor,
// uma linha por mês de vigência do contrato. O valor mensal na moeda original
// = valor / meses de contrato; o R$ usa a PTAX de fechamento daquele mês
// (getRate cai para a última cotação disponível nos meses futuros).
function buildLedger(players) {
  const rows=[];
  for (const p of players) {
    if (!p.start||!p.end) continue;
    const startD=pDate(p.start), endD=pDate(p.end);
    if (endD<=startD) continue;
    const contractMonths=monthsInc(startD,endD);
    if (contractMonths<=0) continue;
    for (const it of p.items) {
      const amt=it.amount??0;
      if (!amt) continue;
      const monthlyCur=amt/contractMonths;
      let cur=new Date(startD.getFullYear(),startD.getMonth(),1);
      const endM=new Date(endD.getFullYear(),endD.getMonth(),1);
      while (cur<=endM) {
        const ym=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');
        const {rate,src}=getRate(it.currency,ym);
        rows.push({
          type:it.label||'—',
          player:p.name||'Sem nome',
          date:new Date(cur),
          month:cur.getMonth()+1,
          year:cur.getFullYear(),
          amountCur:monthlyCur,
          currency:it.currency,
          rate,src,
          brl:monthlyCur*rate,
        });
        cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
      }
    }
  }
  return rows;
}

function exportToExcel() {
  if (typeof XLSX==='undefined') {alert('Biblioteca XLSX não carregada');return;}
  const active=S.players.filter(p=>{const c=calcPlayer(p);return c&&c.totAct>0;});
  if (!active.length) {alert('Nenhum dado para exportar');return;}
  const wb=XLSX.utils.book_new();

  // Sheet 1: Resumo
  const resumoHeader=['Atleta','Início','Fim','Total Ativado (R$)','Amort. Mensal (R$)','Meses Contrato','Meses Amortizados','Baixa/Residual (R$)','Receita da Venda (R$)','Solidariedade (R$)','Sell-on Fee (R$)','Intermed. Venda (R$)','Impostos e Taxas (R$)','Outras Deduções (R$)','Lucro/Prejuízo (R$)','Amort. Evitada (R$)'];
  const resumoRows=active.map(p=>{
    const c=calcPlayer(p);
    return [
      p.name||'Sem nome',p.start,p.end,
      +c.totAct.toFixed(2),+c.monthlyTotal.toFixed(2),c.contractMonths,
      c.exitMonths??'',
      c.exitMonths!==null?+c.totResid.toFixed(2):'',
      c.saleBRL>0?+c.saleBRL.toFixed(2):'',
      c.solidariedadeBRL>0?+c.solidariedadeBRL.toFixed(2):'',
      c.sellOnFee>0?+c.sellOnFee.toFixed(2):'',
      c.saleIntermedBRL>0?+c.saleIntermedBRL.toFixed(2):'',
      c.saleTaxesBRL>0?+c.saleTaxesBRL.toFixed(2):'',
      c.saleExtrasBRL>0?+c.saleExtrasBRL.toFixed(2):'',
      c.gain!==null?+c.gain.toFixed(2):'',
      c.futureAmortAvoided!=null?+c.futureAmortAvoided.toFixed(2):'',
    ];
  });
  const calcsAll=active.map(p=>calcPlayer(p));
  resumoRows.push([
    'TOTAL','','',
    +calcsAll.reduce((s,c)=>s+c.totAct,0).toFixed(2),
    +calcsAll.reduce((s,c)=>s+c.monthlyTotal,0).toFixed(2),
    '','',
    +calcsAll.filter(c=>c.exitMonths!==null).reduce((s,c)=>s+c.totResid,0).toFixed(2),
    +calcsAll.filter(c=>c.saleBRL>0).reduce((s,c)=>s+c.saleBRL,0).toFixed(2),
    +calcsAll.reduce((s,c)=>s+(c.solidariedadeBRL||0),0).toFixed(2),
    +calcsAll.reduce((s,c)=>s+(c.sellOnFee||0),0).toFixed(2),
    +calcsAll.reduce((s,c)=>s+(c.saleIntermedBRL||0),0).toFixed(2),
    +calcsAll.reduce((s,c)=>s+(c.saleTaxesBRL||0),0).toFixed(2),
    +calcsAll.reduce((s,c)=>s+(c.saleExtrasBRL||0),0).toFixed(2),
    +calcsAll.filter(c=>c.gain!==null).reduce((s,c)=>s+c.gain,0).toFixed(2),
    +calcsAll.reduce((s,c)=>s+(c.futureAmortAvoided??0),0).toFixed(2),
  ]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([resumoHeader,...resumoRows]),'Resumo');

  // Sheet 2: Visão Mensal
  const months=buildMonthRange(active);
  if (months.length) {
    const moHeader=['Mês',...active.map(p=>p.name||'Atleta'),'Total (R$)'];
    const moRows=months.map(month=>{
      const moStr=MONTHS_PT[month.getMonth()]+'/'+month.getFullYear();
      const cells=active.map(p=>{
        const {amort,status}=monthAmort(p,month);
        return (status==='active'||status==='exit')?+amort.toFixed(2):'';
      });
      const rowTotal=cells.reduce((s,v)=>s+(typeof v==='number'?v:0),0);
      return [moStr,...cells,+rowTotal.toFixed(2)];
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([moHeader,...moRows]),'Visão Mensal');
  }

  // Sheet 3: Detalhe por atleta (itens ao câmbio de início do contrato)
  const detHeader=['Atleta','Item','Valor Original','Moeda','PTAX (início)','Valor BRL','Amort. Mensal BRL (início)'];
  const detRows=[];
  for (const p of active) {
    const c=calcPlayer(p);
    for (const it of c.items) {
      if (!it.amount) continue;
      detRows.push([
        p.name||'Sem nome',it.label,it.amount,it.currency,
        +it.rate.toFixed(4),+it.totalBRL.toFixed(2),+it.monthlyBRL.toFixed(2),
      ]);
    }
  }
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([detHeader,...detRows]),'Detalhe');

  // Sheet 4: Lançamentos (extrato — uma linha por parcela mensal)
  const ledger=buildLedger(active);
  if (ledger.length) {
    const ledHeader=['Tipo','Atleta','Data','Mês | Ano','Valor','Moeda','PTAX','R$'];
    const ledRows=ledger.map(r=>[
      r.type,r.player,
      `${String(r.date.getDate()).padStart(2,'0')}/${String(r.month).padStart(2,'0')}/${r.year}`,
      `${r.month} | ${r.year}`,
      +r.amountCur.toFixed(2),r.currency,
      +r.rate.toFixed(4),+r.brl.toFixed(2),
    ]);
    ledRows.push(['TOTAL','','','','','','',+ledger.reduce((s,r)=>s+r.brl,0).toFixed(2)]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([ledHeader,...ledRows]),'Lançamentos');
  }

  // Sheet 5: Resultado (matriz rubricas × atletas)
  const mtx=buildResultMatrix(active);
  if (mtx.rows.length){
    const mHeader=['Rubrica',...mtx.players.map(p=>p.name||'Atleta'),'Total *'];
    const mRows=mtx.rows.map(r=>[r.label,...r.cells.map(v=>v.r),r.total.r]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([mHeader,...mRows]),'Resultado');
  }

  XLSX.writeFile(wb,`BaixaIntangivel_${new Date().toISOString().substring(0,10)}.xlsx`);
}

// FORMAT
// ═══════════════════════════════════════════════════════════════════
const N  = v=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v??0);
const N0 = v=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}).format(v??0);
const N4 = v=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4}).format(v??0);
const esc= s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtD=s=>{if(!s||!s.includes('-'))return s||'';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`;};
const sym =c=>c==='EUR'?'€':c==='USD'?'US$':'R$';
const MONTHS_PT=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// ── Máscara de valores (milhar com . e decimal com ,) ───────────────
// valor numérico → string editável formatada
function moneyToInput(v){
  if(v==null||v==='') return '';
  return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(v);
}
// string digitada → número
function parseMoney(str){
  if(str==null) return null;
  let s=String(str).replace(/[^\d,]/g,'');
  const i=s.indexOf(',');
  if(i>=0) s=s.slice(0,i+1)+s.slice(i+1).replace(/,/g,'');
  if(s===''||s===',') return null;
  const [int,dec='']=s.split(',');
  const num=parseFloat((int||'0')+'.'+(dec||'0'));
  return isNaN(num)?null:num;
}
// string digitada → string formatada (preservando vírgula decimal em digitação)
function fmtMoneyTyping(str){
  let s=String(str).replace(/[^\d,]/g,'');
  const i=s.indexOf(',');
  if(i>=0) s=s.slice(0,i+1)+s.slice(i+1).replace(/,/g,'');
  let [int,dec]=s.split(',');
  int=(int||'').replace(/^0+(?=\d)/,'');
  const intFmt=int===''?'':new Intl.NumberFormat('pt-BR').format(Number(int));
  if(s.includes(',')) return (intFmt||'0')+','+(dec||'').slice(0,2);
  return intFmt;
}
// aplica máscara no input preservando a posição do cursor
function maskMoneyInput(el){
  const old=el.value, caret=el.selectionStart??old.length;
  const digitsBefore=(old.slice(0,caret).match(/\d/g)||[]).length;
  const disp=fmtMoneyTyping(old);
  el.value=disp;
  let pos=0, seen=0;
  while(pos<disp.length && seen<digitsBefore){ if(/\d/.test(disp[pos])) seen++; pos++; }
  if(el.setSelectionRange) try{ el.setSelectionRange(pos,pos); }catch(e){}
}

function hBullets() {
  const calcs=S.players.map(p=>({p,c:calcPlayer(p)})).filter(x=>x.c);
  if (!calcs.length) return '';
  const ativos=calcs.filter(x=>x.c.exitMonths===null);
  const saidos=calcs.filter(x=>x.c.exitMonths!==null);
  const bullets=[];
  bullets.push(`<strong>${calcs.length}</strong> atleta(s) na base · <strong>${ativos.length}</strong> ativo(s)${saidos.length?` · <strong>${saidos.length}</strong> com saída`:''}`);
  const topMo=[...calcs].sort((a,b)=>b.c.monthlyTotal-a.c.monthlyTotal)[0];
  if (topMo&&topMo.c.monthlyTotal>0) bullets.push(`Maior amortização mensal: <strong>${esc(topMo.p.name||'Sem nome')}</strong> — R$ ${N(topMo.c.monthlyTotal)}/mês`);
  if (saidos.length){
    const topResid=[...saidos].sort((a,b)=>b.c.totResid-a.c.totResid)[0];
    bullets.push(`Maior baixa a reconhecer: <strong>${esc(topResid.p.name||'Sem nome')}</strong> — R$ ${N(topResid.c.totResid)}`);
  }
  const avoid=saidos.reduce((s,x)=>s+(x.c.futureAmortAvoided??0),0);
  if (avoid>0) bullets.push(`Amortização evitada com as saídas: <strong class="b-pos">R$ ${N(avoid)}</strong> no P&L futuro`);
  const folha=saidos.reduce((s,x)=>s+(x.c.payrollSaved??0),0);

  let el=document.getElementById('toast');

// ── DEMONSTRATIVO DE RESULTADO (matriz rubricas × atletas) ──────────
// Linhas = rubricas; colunas = atletas + Total. Cada célula traz
// {d:texto formatado, r:valor numérico p/ Excel}.
function buildResultMatrix(players) {
  const calcs=players.map(p=>({p,c:calcPlayer(p)}));
  // união dos rótulos de itens (ordem de primeira aparição)
  const labels=[];
  for (const {p} of calcs) for (const it of p.items) if (it.amount){ const L=it.label||'—'; if(!labels.includes(L)) labels.push(L); }
  const acqCur=p=>{const cs=[...new Set(p.items.filter(i=>i.amount).map(i=>i.currency))];return cs.length===1?cs[0]:null;};
  const allAcq=[...new Set(players.flatMap(p=>p.items.filter(i=>i.amount).map(i=>i.currency)))];
  const gAcq=allAcq.length===1?allAcq[0]:null;
  const allSale=[...new Set(calcs.filter(x=>x.c.saleBRL>0).map(x=>x.p.saleCurrency))];
  const gSale=allSale.length===1?allSale[0]:null;

  const me =(amt,cur)=> amt==null?{d:'—',r:''}:{d:`${sym(cur)} ${N(amt)}`,r:+amt.toFixed(2)};
  const brl=v=> v==null?{d:'—',r:''}:{d:`R$ ${N(v)}`,r:+v.toFixed(2)};
  const neg=v=> !v?{d:'—',r:''}:{d:`-R$ ${N(v)}`,r:+(-v).toFixed(2)};

  const rows=[];
  const push=(label,type,cells,total)=>rows.push({label,type,cells,total});

  // rubricas de custo (em moeda original)
  for (const L of labels){
    const cells=calcs.map(({p})=>{const it=p.items.find(i=>(i.label||'—')===L&&i.amount);return it?me(it.amount,it.currency):{d:'—',r:''};});
    const total=gAcq?me(calcs.reduce((a,{p})=>{const it=p.items.find(i=>(i.label||'—')===L&&i.amount);return a+(it?it.amount:0);},0),gAcq):{d:'—',r:''};
    push(L,'item',cells,total);
  }
  // Custo de Aquisição (ME)
  push(`Custo de Aquisição (${gAcq||'ME'})`,'sub',
    calcs.map(({p})=>{const cur=acqCur(p);return cur?me(p.items.filter(i=>i.amount).reduce((a,i)=>a+i.amount,0),cur):{d:'—',r:''};}),
    gAcq?me(calcs.reduce((a,{p})=>a+p.items.filter(i=>i.amount).reduce((b,i)=>b+i.amount,0),0),gAcq):{d:'—',r:''});
  // Custo de Aquisição (BRL)
  push('Custo de Aquisição (BRL)','sub',
    calcs.map(({c})=>brl(c.acqBRL)),
    brl(calcs.reduce((a,{c})=>a+c.acqBRL,0)));
  // Valor de Venda (ME)
  push('Valor de Venda (ME)','sub',
    calcs.map(({p,c})=>(c.saleBRL>0&&p.saleCurrency!=='BRL')?me(p.saleAmount,p.saleCurrency):{d:'—',r:''}),
    (gSale&&gSale!=='BRL')?me(calcs.filter(x=>x.c.saleBRL>0).reduce((a,x)=>a+x.p.saleAmount,0),gSale):{d:'—',r:''});
  // Valor de Transferência (BRL)
  push('Valor de Transferência (BRL)','sub',
    calcs.map(({c})=>c.saleBRL>0?brl(c.saleBRL):{d:'—',r:''}),
    brl(calcs.reduce((a,{c})=>a+c.saleBRL,0)));
  // deduções
  const ded=(label,g)=>push(label,'ded',
    calcs.map(({c})=>{const v=g(c);return v>0?neg(v):{d:'—',r:''};}),
    neg(calcs.reduce((a,{c})=>a+(g(c)||0),0)));
  if (calcs.some(({c})=>c.solidariedadeBRL>0)) ded('Mecanismo de Solidariedade',c=>c.solidariedadeBRL);
  ded('Intermediação',c=>c.saleIntermedBRL);
  ded('Sell-on Fee',c=>c.sellOnFee);
  ded('Impostos e Taxas',c=>c.saleTaxesBRL);
  if (calcs.some(({c})=>c.saleExtrasBRL>0)) ded('Outras deduções',c=>c.saleExtrasBRL);
  const dedTot=c=>(c.solidariedadeBRL||0)+(c.saleIntermedBRL||0)+(c.sellOnFee||0)+(c.saleTaxesBRL||0)+(c.saleExtrasBRL||0);
  push('Total Deduções','sub',
    calcs.map(({c})=>c.saleBRL>0?neg(dedTot(c)):{d:'—',r:''}),
    neg(calcs.reduce((a,{c})=>a+dedTot(c),0)));
  // resultado antes
  push('Resultado antes de Amortização e Baixa','sub',
    calcs.map(({c})=>c.saleBRL>0?brl(c.saleBRL-dedTot(c)):{d:'—',r:''}),
    brl(calcs.reduce((a,{c})=>a+(c.saleBRL>0?c.saleBRL-dedTot(c):0),0)));
  // baixa de intangível
  push('Baixa de Intangível','ded',
    calcs.map(({c})=>c.exitMonths!==null?neg(c.totResid):{d:'—',r:''}),
    neg(calcs.reduce((a,{c})=>a+(c.exitMonths!==null?c.totResid:0),0)));
  // resultado líquido
  push('Resultado Líquido','head',
    calcs.map(({c})=>c.gain!=null?brl(c.gain):{d:'—',r:''}),
    brl(calcs.reduce((a,{c})=>a+(c.gain!=null?c.gain:0),0)));

  return {players:calcs.map(x=>x.p),rows};
}

// Economia mensal nos meses seguintes a cada venda (custo evitado)
function buildImpacto(players) {
  const info=[];
  for (const p of players){
    const c=calcPlayer(p);
    if(!c || c.exitMonths===null) continue;
    const exitD=pDate(p.exit), endD=pDate(p.end);
    const exitM=new Date(exitD.getFullYear(),exitD.getMonth(),1);
    const endM=new Date(endD.getFullYear(),endD.getMonth(),1);
    const firstM=new Date(exitM.getFullYear(),exitM.getMonth()+1,1);
    if(firstM>endM) continue;   // saída no fim do contrato → sem meses subsequentes
    info.push({p,firstM,endM});
  }
  if(!info.length) return {months:[]};
  let minM=null,maxM=null;
  for(const {firstM,endM} of info){ if(!minM||firstM<minM)minM=firstM; if(!maxM||endM>maxM)maxM=endM; }
  const months=[];
  let cur=new Date(minM), guard=0;
  while(cur<=maxM && guard<240){
    const ym=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');
    let amort=0, payroll=0, salary=0;
    for(const {p,firstM,endM} of info){
      if(cur<firstM||cur>endM) continue;
      amort += monthlyAmortBRL(p,ym);
      const Sal=p.salary??0, Img=p.imageRights??0;
      let salPart=Sal;
      if(cur.getMonth()===11) salPart+=Sal;   // 13º
      salary+=salPart;
      payroll+=salPart+Img;
    }
    months.push({date:new Date(cur),amort,payroll,salary,total:amort+payroll});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); guard++;
  }
  return {months};
}

  const players=S.players.filter(p=>calcPlayer(p));

  <div class="item-row" id="irow-${it.id}">

function hSaleBRL(p) {
  if (!p.saleAmount||!p.exit) return '';
  const {rate}=getDayRate(p.saleCurrency,p.exit);
  return p.saleCurrency!=='BRL'?`= R$ ${N(p.saleAmount*rate)}`:'';
}

function hSolidariedadeBRL(p) {
  if (!p.solidariedadePct||!p.saleAmount||!p.exit) return '';
  const c=calcPlayer(p);
  if (!c||!c.solidariedadeBRL) return '';
  return `− R$ ${N(c.solidariedadeBRL)}`;
}

function hPayrollEco(p) {
  if (!(p.salary||p.imageRights)) return '';
  if (!p.exit) return `<span style="font-size:10px;color:var(--ink-4)">informe a saída p/ ver a economia</span>`;
  const c=calcPlayer(p);
  if (!c||c.payrollSaved==null) return '';
  return `= R$ ${N(c.payrollSaved)} <span style="font-size:9px;opacity:.65">(${c.monthsRemaining} meses · salário R$ ${N(c.payrollSalary)} c/ 13º · imagem R$ ${N(c.payrollImage)})</span>`;
}

function hSellOnBRL(p) {
  if (!p.sellOnPct||!p.saleAmount||!p.exit) return '';
  const c=calcPlayer(p);
  if (!c||!c.saleBRL) return '';
  return `− R$ ${N(c.sellOnFee)}`;
}

function hIntermedBRL(p) {
  if (!p.exit) return '';
  if ((p.saleIntermedMode||'valor')==='pct') {
    if (!p.saleIntermedPct) return '';
    const c=calcPlayer(p);
    if (!c||!c.saleBRL) return '';
    return `− R$ ${N(c.saleIntermedBRL)}`;
  }
  if (!p.saleIntermed) return '';
  const cur=p.saleIntermedCurrency||'BRL';
  if (cur==='BRL') return '';
  const {rate}=getDayRate(cur,p.exit);
  return `− R$ ${N(p.saleIntermed*rate)}`;
}

function hTaxesBRL(p) {
  if (!p.exit) return '';
  if ((p.saleTaxesMode||'valor')==='pct') {
    if (!p.saleTaxesPct) return '';
    const c=calcPlayer(p);
    if (!c||!c.saleBRL) return '';
    return `− R$ ${N(c.saleTaxesBRL)}`;
  }
  if (!p.saleTaxes) return '';
  const cur=p.saleTaxesCurrency||'BRL';
  if (cur==='BRL') return '';
  const {rate}=getDayRate(cur,p.exit);
  return `− R$ ${N(p.saleTaxes*rate)}`;
}

// Dispatcher: empacota qualquer linha de dedução com handle de drag-and-drop
function hDeductionRow(p, key) {
  let inner='';
  if (key==='solidariedade') inner=hSolidRow(p);
  else if (key==='sellOn')   inner=hSellOnRow(p);
  else if (key==='intermed') inner=hPctValueRow(p,{label:'Intermediação',tag:'intermed',mode:p.saleIntermedMode||'valor',modeField:'saleIntermedMode',pct:p.saleIntermedPct,pctField:'saleIntermedPct',method:p.saleIntermedMethod||'maisValia',methodField:'saleIntermedMethod',val:p.saleIntermed,valField:'saleIntermed',cur:p.saleIntermedCurrency||'BRL',curField:'saleIntermedCur',brl:hIntermedBRL(p)});
  else if (key==='taxes')    inner=hPctValueRow(p,{label:'Impostos e taxas',tag:'taxes',mode:p.saleTaxesMode||'valor',modeField:'saleTaxesMode',pct:p.saleTaxesPct,pctField:'saleTaxesPct',method:p.saleTaxesMethod||'maisValia',methodField:'saleTaxesMethod',val:p.saleTaxes,valField:'saleTaxes',cur:p.saleTaxesCurrency||'BRL',curField:'saleTaxesCur',brl:hTaxesBRL(p)});
  else if (key.startsWith('extra:')){
    const ex=(p.saleExtras||[]).find(x=>x.id===+key.slice(6));
    if (!ex) return '';
    inner=hSaleExtraRow(p,ex);
  }
  return `
  <div class="dedu-wrap" data-pid="${p.id}" data-ded-key="${esc(key)}">
    <span class="drag-handle" title="Arraste para reordenar">⋮⋮</span>
    ${inner}
  </div>`;
}

// Botão + popover para configurar quais valores são subtraídos da base
function baseSummary(incl) {
  const arr=(incl||[]);
  if (arr.length===0) return 'Sobre receita';
  if (arr.length===1) return `Receita − ${arr.length} item`;
  return `Receita − ${arr.length} itens`;
}
function hBaseCfg(p, tag) {
  const incl = getSaleIncl(p, tag);
  const opts = availableBases(p, tag);
  const summary = baseSummary(incl);
  const optKeys = new Set(opts.map(o=>o.key));
  const hasSolid = optKeys.has('solidariedade');
  const hasAcq   = optKeys.has('acquisition');
  const isGross  = incl.length===0;
  const isBruto  = incl.length===1 && incl[0]==='solidariedade';
  const isMV     = incl.length===2 && incl.includes('solidariedade') && incl.includes('acquisition');
  const presets = (hasSolid || hasAcq) ? `
        <div class="bcfg-presets">
          <button type="button" class="bcfg-preset${isGross?' on':''}" data-action="base-preset" data-pid="${p.id}" data-tag="${tag}" data-preset="gross">Sobre receita</button>
          ${hasSolid?`<button type="button" class="bcfg-preset${isBruto?' on':''}" data-action="base-preset" data-pid="${p.id}" data-tag="${tag}" data-preset="bruto">Sobre bruto</button>`:''}
          ${hasSolid&&hasAcq?`<button type="button" class="bcfg-preset${isMV?' on':''}" data-action="base-preset" data-pid="${p.id}" data-tag="${tag}" data-preset="maisValia">Sobre mais-valia</button>`:''}
        </div>
        <div class="bcfg-divider"></div>` : '';
  return `
    <div class="base-cfg cur-toggle sale-tg-sec" data-base-cfg="${tag}" data-pid="${p.id}">
      <button type="button" class="base-cfg-btn" data-action="toggle-base-cfg" data-pid="${p.id}" data-tag="${tag}" title="Configurar base da dedução">${esc(summary)} ▾</button>
      <div class="base-cfg-pop" id="basepop-${p.id}-${tag.replace(':','-')}" style="display:none">
        ${presets}
        <div class="bcfg-hdr">Subtrair antes do cálculo</div>
        ${opts.map(o=>`<label><input type="checkbox" data-pid="${p.id}" data-incl-tag="${tag}" data-incl-key="${o.key}" ${incl.includes(o.key)?'checked':''}> ${esc(o.label)}</label>`).join('')}
      </div>
    </div>`;
}

function hResults(p) {
  const c=calcPlayer(p);
  const totalAct=p.items.reduce((s,it)=>{const{rate}=getDayRate(it.currency,p.start);return s+(it.amount??0)*rate;},0);
  if (!c || totalAct===0) {
    return `<div class="rs-empty">Preencha o contrato e os valores de aquisição para ver os resultados.</div>`;
  }
  const exitOk=c.exitMonths!==null;
  const hasSale=c.gain!==null;
  const eqDed=(lbl,v)=>v>0?`<span class="eq-op">−</span><div class="eq-cell"><span class="eq-lbl">${lbl}</span><span class="eq-val eq-neg">R$ ${N(v)}</span></div>`:'';
  const eq=hasSale?`<div class="venda-eq">
    <div class="eq-cell"><span class="eq-lbl">Receita</span><span class="eq-val">R$ ${N(c.saleBRL)}</span></div>
    ${eqDed('Solidariedade',c.solidariedadeBRL)}
    ${eqDed('Sell-on',c.sellOnFee)}
    ${eqDed('Intermediação',c.saleIntermedBRL)}
    ${eqDed('Impostos',c.saleTaxesBRL)}
    ${(c.saleExtras||[]).map(x=>eqDed(esc(x.label||'Dedução'),x.brl)).join('')}
    <span class="eq-op">−</span>
    <div class="eq-cell"><span class="eq-lbl">Baixa</span><span class="eq-val" style="color:#fbbf24">R$ ${N(c.totResid)}</span></div>
    <span class="eq-op">=</span>
    <div class="eq-cell"><span class="eq-lbl">Resultado</span><span class="eq-val ${c.gain>=0?'eq-pos':'eq-neg'}">${c.gain>=0?'+':''}R$ ${N(c.gain)}</span></div>
  </div>`:'';
  const eco=(exitOk&&c.totalEconomy>0)?`<div class="eco-note">Economia ao vender <span style="opacity:.7">(${c.monthsRemaining} meses restantes)</span>: ${c.futureAmortAvoided>0?`amortização evitada <strong>R$ ${N(c.futureAmortAvoided)}</strong>`:''}${c.payrollSaved>0?`${c.futureAmortAvoided>0?' · ':''}folha evitada <strong>R$ ${N(c.payrollSaved)}</strong>`:''} · total <span class="eco-tot">R$ ${N(c.totalEconomy)}</span></div>`:'';
  return `
  <div class="results-strip">
    <div class="rs-box">
      <span class="rs-lbl">Amortização mensal</span>
      <span class="rs-val rs-val-amber">R$ ${N(c.monthlyTotal)}</span>
      <span class="rs-sub">${c.contractMonths} meses de contrato</span>
    </div>
    <div class="rs-box">
      <span class="rs-lbl">Amort. acumulada</span>
      <span class="rs-val rs-val-amber">${exitOk?`R$ ${N(c.totAmort)}`:'—'}</span>
      <span class="rs-sub">${exitOk?`${N0(c.pctAmort)}% até a saída`:'saída pendente'}</span>
    </div>
    <div class="rs-box">
      <span class="rs-lbl">Baixa (residual)</span>
      <span class="rs-val rs-val-gold">${exitOk?`R$ ${N(c.totResid)}`:'—'}</span>
      <span class="rs-sub">${exitOk?'valor a reconhecer':'—'}</span>
    </div>
  </div>
  ${eq}
  ${eco}`;
}

// ── Summary table ──────────────────────────────────────────────────
function isIncluded(pid){ return !(CUT.exclude||[]).includes(pid); }
function hSummary() {
  const active=S.players.filter(p=>{const c=calcPlayer(p);return c&&c.totAct>0;});
  if (active.length===0) return `<div id="summary-section"></div>`;

  const dedFmt = v => v>0 ? `R$ ${N(v)}` : '—';
  const allOn  = active.every(p=>isIncluded(p.id));
  const someOn = active.some(p=>isIncluded(p.id));
  const includedCount = active.filter(p=>isIncluded(p.id)).length;

  // Constrói o painel-tooltip de Custos Venda no idioma visual da app
  const buildCustosTip = (parts, total, title) => {
    const rows = parts.map(([label,val]) => `<div class="cell-tip-row${val>0?'':' is-dim'}"><span>${esc(label)}</span><strong>${val>0?`− R$ ${N(val)}`:'—'}</strong></div>`).join('');
    return `<div class="cell-tip"><div class="cell-tip-hdr">${esc(title)}</div>${rows}<div class="cell-tip-total"><span>Total</span><strong>R$ ${N(total)}</strong></div></div>`;
  };

  const rows=active.map(p=>{
    const c=calcPlayerCutoff(p, CUT.date);
    const inc=isIncluded(p.id);
    const chipGain=c.gain!==null?(c.gain>=0?`<span class="chip-saída chip-pos">ganho</span>`:`<span class="chip-saída chip-neg">perda</span>`):'';
    const cutNote = CUT.date && p.exit && pDate(p.exit) > pDate(CUT.date) ? `<span class="chip-saída" style="opacity:.55" title="Saída após a data de corte">após corte</span>` : '';
    const exitLabel=c.exitMonths!==null?`${c.exitMonths}/${c.contractMonths} meses <span class="chip-saída">${fmtD(p.exit)}</span>`:(p.exit?`— ${cutNote}`:`— <span class="chip-saída" style="opacity:.4">sem data</span>`);
    const custosVenda=(c.solidariedadeBRL||0)+(c.sellOnFee||0)+(c.saleIntermedBRL||0)+(c.saleTaxesBRL||0)+(c.saleExtrasBRL||0);
    const parts = [
      ['Solidariedade',  c.solidariedadeBRL||0],
      ['Sell-on fee',    c.sellOnFee||0],
      ['Intermediação',  c.saleIntermedBRL||0],
      ['Impostos e taxas', c.saleTaxesBRL||0],
      ...((c.saleExtras||[]).filter(x=>x.brl>0).map(x=>[x.label||'Outra dedução', x.brl])),
    ];
    const custosTipHTML = custosVenda>0 ? buildCustosTip(parts, custosVenda, `Custos da venda · ${p.name||'atleta'}`) : '';
    return `<tr class="${inc?'':'row-excluded'}">
      <td><label class="cut-incl-row"><input type="checkbox" data-action="cut-incl" data-pid="${p.id}" ${inc?'checked':''}> <span>${esc(p.name||'Sem nome')}</span></label></td>
      <td class="td-dim">${fmtD(p.start)} → ${fmtD(p.end)}</td>
      <td class="td-warn">R$ ${N(c.totAct)}</td>
      <td class="td-amber">R$ ${N(c.monthlyTotal)}<span style="font-size:8px;color:var(--ink-4)">/mês</span></td>
      <td>${exitLabel}</td>
      <td class="td-dim">${(c.totAmort||0)>0?`R$ ${N(c.totAmort)}`:'—'}</td>
      <td class="td-gold">${c.exitMonths!==null?`R$ ${N(c.totResid)}`:'—'}</td>
      <td>${c.saleBRL>0?`R$ ${N(c.saleBRL)}`:'—'}</td>
      <td class="td-neg ${custosVenda>0?'has-tip':''}">${custosVenda>0?`R$ ${N(custosVenda)} <span class="tip-dot">ⓘ</span>${custosTipHTML}`:'—'}</td>
      <td class="${c.gain!==null?(c.gain>=0?'td-pos':'td-neg'):''}">${c.gain!==null?`${c.gain>=0?'+':''}R$ ${N(c.gain)} ${chipGain}`:'—'}</td>
      <td class="td-pos">${c.futureAmortAvoided!==null&&c.futureAmortAvoided>0?`R$ ${N(c.futureAmortAvoided)}`:'—'}</td>
      <td class="td-pos">${c.payrollSaved>0?`R$ ${N(c.payrollSaved)}`:'—'}</td>
    </tr>`;
  }).join('');

  // Totais usam apenas atletas marcados
  const calcs=active.filter(p=>isIncluded(p.id)).map(p=>calcPlayerCutoff(p, CUT.date));
  const tt={
    act:  calcs.reduce((s,c)=>s+c.totAct,0),
    mo:   calcs.reduce((s,c)=>s+c.monthlyTotal,0),
    amort:calcs.reduce((s,c)=>s+(c.totAmort||0),0),
    res:  calcs.filter(c=>c.exitMonths!==null).reduce((s,c)=>s+c.totResid,0),
    sale: calcs.filter(c=>c.saleBRL>0).reduce((s,c)=>s+c.saleBRL,0),
    custos:calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+(c.solidariedadeBRL||0)+(c.sellOnFee||0)+(c.saleIntermedBRL||0)+(c.saleTaxesBRL||0)+(c.saleExtrasBRL||0),0),
    solid:calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+(c.solidariedadeBRL||0),0),
    sellOn:calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+(c.sellOnFee||0),0),
    intermed:calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+(c.saleIntermedBRL||0),0),
    taxes:calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+(c.saleTaxesBRL||0),0),
    extras:calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+(c.saleExtrasBRL||0),0),
    gain: calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+c.gain,0),
    avoid:calcs.filter(c=>c.futureAmortAvoided!==null).reduce((s,c)=>s+(c.futureAmortAvoided??0),0),
    salary:calcs.filter(c=>c.exitMonths!==null).reduce((s,c)=>s+(c.payrollSaved??0),0),
  };
  const hasGain=calcs.some(c=>c.gain!==null);
  const totCustosTipHTML = tt.custos>0 ? buildCustosTip([
    ['Solidariedade',   tt.solid],
    ['Sell-on fee',     tt.sellOn],
    ['Intermediação',   tt.intermed],
    ['Impostos e taxas',tt.taxes],
    ...(tt.extras>0?[['Outras deduções', tt.extras]]:[]),
  ], tt.custos, 'Custos da venda · total') : '';

  const selStatus = allOn
    ? `<span class="cut-sel-status">Todos os ${active.length} atletas selecionados</span>`
    : `<span class="cut-sel-status">${includedCount} de ${active.length} selecionados</span>`;

  return `
  <div id="summary-section" class="section-card">
    <div class="sec-eyebrow" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span>Resumo Consolidado</span>

      ${someOn&&allOn?`<button class="mini-btn" data-action="cut-incl-all" data-mode="none">Desmarcar todos</button>`:''}

    <table class="stbl">
      <thead><tr>
        <th style="text-align:left"><span class="cut-incl-row"><input type="checkbox" data-action="cut-incl-all" data-mode="${allOn?'none':'all'}" ${allOn?'checked':''} title="Marcar/desmarcar todos"><span>Atleta</span></span></th>
        <th>Vigência</th>

        <th>Amort. Mensal</th>
        <th>Meses / Saída</th>

        <th>Amort. Evitada</th>
        <th>Economia Salário</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="tr-total">
        <td>Total${allOn?'':` (${includedCount}/${active.length})`}</td>
        <td class="td-dim">—</td>
        <td class="td-warn">R$ ${N(tt.act)}</td>
        <td class="td-amber">R$ ${N(tt.mo)}/mês</td>
        <td class="td-dim">—</td>
        <td class="td-dim">${tt.amort>0?`R$ ${N(tt.amort)}`:'—'}</td>
        <td class="td-gold">${tt.res>0?`R$ ${N(tt.res)}`:'—'}</td>
        <td>${tt.sale>0?`R$ ${N(tt.sale)}`:'—'}</td>
        <td class="td-neg ${tt.custos>0?'has-tip':''}">${tt.custos>0?`R$ ${N(tt.custos)} <span class="tip-dot">ⓘ</span>${totCustosTipHTML}`:'—'}</td>
        <td class="${hasGain?(tt.gain>=0?'td-pos':'td-neg'):''}">${hasGain?`${tt.gain>=0?'+':''}R$ ${N(tt.gain)}`:'—'}</td>

}

// ── Monthly view ───────────────────────────────────────────────────
function hMonthly() {
  const active=S.players.filter(p=>calcPlayer(p)&&(p.items.some(i=>i.amount)));
  if (active.length===0) return `<div id="monthly-section"></div>`;

  const months=buildMonthRange(active);
  if (!months.length) return `<div id="monthly-section"></div>`;

  // Per-month baseline: sum of all active players for that month (ignoring exits) using that month's PTAX
  function monthPeak(month) {
    return active.reduce((s,p)=>{
      if (!p.start||!p.end) return s;
      const startD=pDate(p.start);
      const startM=new Date(startD.getFullYear(),startD.getMonth(),1);
      const endD=pDate(p.end);
      const endM=new Date(endD.getFullYear(),endD.getMonth(),1);
      if (month<startM||month>endM) return s;
      const ym=month.getFullYear()+'-'+String(month.getMonth()+1).padStart(2,'0');
      return s+monthlyAmortBRL(p,ym);
    },0);
  }

  // Build table header
  const colNames=active.map(p=>esc(p.name||'Atleta'));
  const thead=`<tr>
    <th>Mês</th>
    ${colNames.map(n=>`<th>${n}</th>`).join('')}
    <th class="th-total">Total</th>
    <th class="th-total">Economia acum.</th>
  </tr>`;

  // Build rows
  let prevYear=null;
  let cumulativeSaved=0;
  const rows=months.map(month=>{
    const yr=month.getFullYear();
    let yearDivider='';
    if(yr!==prevYear){prevYear=yr;yearDivider=`<tr class="tr-divider"><td colspan="${active.length+3}">${yr}</td></tr>`;}

    const cells=active.map(p=>{
      const {amort,status}=monthAmort(p,month);
      let cls='', content='';
      if(status==='active'){cls='td-active';content=`R$ ${N(amort)}`;}
      else if(status==='exit'){cls='td-exit';content=`R$ ${N(amort)}<br><span style="font-size:7.5px;letter-spacing:.08em;font-family:'Inter',sans-serif">SAÍDA</span>`;}
      else if(status==='exited'){cls='td-exited';content='—';}
      else{cls='td-inactive';content='';}
      return `<td class="${cls}">${content}</td>`;
    }).join('');

    const rowTotal=active.reduce((s,p)=>{const{amort,status}=monthAmort(p,month);return s+(status==='active'||status==='exit'?amort:0);},0);
    const saved=monthPeak(month)-rowTotal;
    if(saved>0) cumulativeSaved+=saved;
    const peak=monthPeak(month);
    const totalCls=rowTotal<peak&&peak>0?'td-total td-total-drop':'td-total';
    const moStr=`${MONTHS_PT[month.getMonth()]}/${String(month.getFullYear()).slice(2)}`;
    const row=`<tr>
      <td>${moStr}</td>
      ${cells}
      <td class="${totalCls}">R$ ${N(rowTotal)}</td>
      <td class="td-total${cumulativeSaved>0?' td-total-drop':''}">${cumulativeSaved>0?`R$ ${N(cumulativeSaved)}`:'—'}</td>
    </tr>`;
    return yearDivider+row;
  }).join('');

  return `
  <div id="monthly-section" class="section-card">
    <div class="sec-eyebrow">Visão Mensal de Amortização</div>
    <div style="font-family:'Inter',sans-serif;font-size:9px;color:var(--ink-4);margin-bottom:10px;letter-spacing:.03em">
      Amortização mensal por atleta · após a data de saída o custo deixa de onerar o P&amp;L
    </div>
    <div class="monthly-scroll">
      <table class="monthly-tbl">
        <thead>${thead}</thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="monthly-legend">
      <div class="leg-item"><div class="leg-dot" style="background:rgba(217,119,6,.25)"></div>Amortização ativa</div>
      <div class="leg-item"><div class="leg-dot" style="background:rgba(190,140,74,.2);border:1px solid var(--gold-ring)"></div>Mês de saída</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--div)"></div>Após saída (sem custo)</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--pos-t);border:1px solid rgba(22,101,52,.2)"></div>Economia acumulada</div>
    </div>
  </div>`;
}
