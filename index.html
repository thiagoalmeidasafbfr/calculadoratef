<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baixa de Intangível — Glorioso Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --gold:#be8c4a;--gold-soft:#dcc89a;--gold-deep:#7a6244;
  --gold-tint:rgba(190,140,74,.12);--gold-ring:rgba(190,140,74,.22);
  --ink-1:#1a1410;--ink-2:#3a2e1c;--ink-4:rgba(26,20,16,.55);
  --cream-page:#f9f7f2;--cream-canvas:#f5f2eb;--cream-card:#fdfbf6;--cream-inset:#ece6d8;--tbl-head:#e7e5de;
  --dark:#1a1410;--on-dark:#f3eee2;--on-dark-d:rgba(243,238,226,.45);--on-dark-m:rgba(243,238,226,.28);
  --pos:#166534;--pos-t:#dcf0e4;--neg:#b91c1c;--neg-t:#fce8e8;
  --warn:#b88a2a;--amber:#d97706;
  --div:rgba(26,20,16,.08);--div-m:rgba(26,20,16,.13);
  --sh-h:0 1px 0 rgba(40,32,22,.04);--sh-l:0 1px 0 rgba(40,32,22,.04),0 4px 12px -8px rgba(40,32,22,.10);
  --r-xs:4px;--r-sm:8px;--r-md:10px;--r-lg:14px;--r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream-page);color:var(--ink-1);line-height:1.5;min-height:100vh;font-size:14px}

/* ── HERO ─────────────────────────────────────────────── */
.hero{background:var(--dark);border-radius:var(--r-lg);margin:14px 20px 0;padding:22px 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--on-dark-d);margin-bottom:6px}
.hero-title{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.4rem,4vw,2.4rem);font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--on-dark)}
.hero-title em{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;color:var(--gold)}
.hero-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--on-dark-d);letter-spacing:.04em;margin-top:8px}
.hero-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:2px}
.hero-btn{padding:7px 14px;border-radius:var(--r-pill);border:1px solid rgba(243,238,226,.18);background:rgba(243,238,226,.07);color:var(--on-dark);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.hero-btn:hover{background:rgba(243,238,226,.14)}
.ptax-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(243,238,226,.07);border:1px solid rgba(243,238,226,.12);border-radius:var(--r-pill);font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--on-dark-d)}
.ptax-chip strong{font-weight:600;color:var(--on-dark);font-size:9.5px}
.ptax-refresh{border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--on-dark-m);padding:0;transition:color .15s}
.ptax-refresh:hover{color:var(--gold)}

/* ── LAYOUT ───────────────────────────────────────────── */
.page-body{padding:16px 20px 32px}
.sec-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}

/* ── PLAYER GRID ──────────────────────────────────────── */
.players-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.add-player-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-pill);border:1.5px dashed var(--gold-deep);background:transparent;color:var(--gold-deep);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .15s;margin-bottom:20px}
.add-player-btn:hover{background:var(--gold-tint);border-color:var(--gold)}

/* ── COMPACT PLAYER CARD ──────────────────────────────── */
.pcard{background:var(--cream-card);border:1px solid var(--div);border-radius:var(--r-md);box-shadow:var(--sh-h);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s}
.pcard:hover{box-shadow:var(--sh-l)}

/* head */
.pcard-head{background:var(--dark);padding:10px 12px;display:flex;align-items:center;gap:10px}
.pcard-name{flex:1;min-width:0;background:rgba(243,238,226,.08);border:1px solid rgba(243,238,226,.13);border-radius:var(--r-xs);padding:5px 9px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--on-dark);outline:none;transition:border-color .15s}
.pcard-name:focus{border-color:var(--gold)}
.pcard-name::placeholder{color:var(--on-dark-m)}
.pcard-remove{border:none;background:rgba(185,28,28,.2);color:#f87171;font-size:9px;font-family:'IBM Plex Mono',monospace;font-weight:500;letter-spacing:.08em;padding:4px 8px;border-radius:var(--r-xs);cursor:pointer;white-space:nowrap;transition:background .15s;flex-shrink:0}
.pcard-remove:hover{background:rgba(185,28,28,.35)}

/* dates bar */
.pcard-dates{display:flex;gap:8px;padding:9px 12px;background:var(--cream-canvas);border-bottom:1px solid var(--div);align-items:center;flex-wrap:wrap}
.d-group{display:flex;flex-direction:column;gap:3px}
.d-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-deep)}
.d-inp{background:var(--cream-card);border:1px solid var(--div-m);border-radius:var(--r-xs);padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--ink-1);outline:none;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.d-inp:focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-ring)}
.d-sep{color:var(--ink-4);font-size:11px;padding-top:14px}
.d-divider{width:1px;background:var(--div);align-self:stretch;margin:0 2px;flex-shrink:0}

/* items */
.pcard-items{padding:10px 12px}
.items-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.items-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4)}
.add-item-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--div-m);border-radius:var(--r-pill);background:transparent;color:var(--gold-deep);font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .12s}
.add-item-btn:hover{background:var(--gold-tint);border-color:var(--gold)}

/* compact item row */
.item-row{display:grid;grid-template-columns:1fr 105px 80px 100px 22px;gap:5px;align-items:center;margin-bottom:5px}
.lbl-inp{background:var(--cream-canvas);border:1px solid var(--div);border-radius:var(--r-xs);padding:5px 8px;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;color:var(--ink-1);outline:none;width:100%;min-width:0;transition:border-color .15s}
.lbl-inp:focus{border-color:var(--gold)}
.amt-wrap{display:flex;align-items:center;background:var(--cream-canvas);border:1px solid var(--div);border-radius:var(--r-xs);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.amt-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-ring)}
.amt-inp{background:transparent;border:none;outline:none;padding:5px 6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-1);width:100%;text-align:right;min-width:0}
.cur-toggle{display:flex;background:var(--cream-inset);border:1px solid var(--div);border-radius:var(--r-xs);overflow:hidden}
.cur-btn{flex:1;padding:5px 0;border:none;background:transparent;color:var(--ink-4);font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:all .12s;min-width:24px}
.cur-btn.on{background:var(--dark);color:var(--gold-soft)}
.brl-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--warn);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.del-item-btn{width:22px;height:22px;border:none;background:transparent;color:var(--ink-4);font-size:13px;cursor:pointer;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.del-item-btn:hover{background:var(--neg-t);color:var(--neg)}

/* items total line */
.items-total{display:flex;justify-content:space-between;align-items:center;padding-top:7px;border-top:1px dashed var(--div);margin-top:3px}
.items-total-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
.items-total-val{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--warn)}

/* sale row */
.pcard-sale{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--div);background:var(--cream-canvas);flex-wrap:wrap}
.sale-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-deep);white-space:nowrap}
.sale-brl-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-4)}

/* mini results strip */
.pcard-results{border-top:2px solid var(--div-m)}
.results-strip{display:flex;border-top:none}
.rs-box{flex:1;padding:9px 10px;text-align:center;border-right:1px solid var(--div)}
.rs-box:last-child{border-right:none}
.rs-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4);display:block;margin-bottom:3px}
.rs-val{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.rs-sub{font-family:'IBM Plex Mono',monospace;font-size:7px;color:var(--ink-4);display:block;margin-top:2px;letter-spacing:.04em}
.rs-val-amber{color:var(--amber)!important}
.rs-val-neg{color:var(--neg)!important}
.rs-val-gold{color:var(--gold-deep)!important}
.rs-val-pos{color:var(--pos)!important}
.rs-empty{padding:14px 12px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-4);text-align:center;letter-spacing:.04em}

/* ── SUMMARY TABLE ────────────────────────────────────── */
.section-card{background:var(--cream-card);border:1px solid var(--div);border-radius:var(--r-md);box-shadow:var(--sh-h);padding:18px 20px;margin-bottom:16px;overflow-x:auto}
.stbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.stbl th{padding:8px 12px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);background:var(--tbl-head);border-bottom:2px solid var(--div-m);white-space:nowrap}
.stbl th:first-child{text-align:left;border-radius:var(--r-xs) 0 0 0}
.stbl th:last-child{border-radius:0 var(--r-xs) 0 0}
.stbl td{padding:9px 12px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-2);border-bottom:1px solid var(--div);white-space:nowrap}
.stbl td:first-child{text-align:left;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--ink-1)}
.stbl tr:last-child td{border-bottom:none}
.stbl tbody tr:hover td{background:var(--cream-inset)}
.stbl .tr-total td{background:var(--tbl-head);border-top:2px solid var(--div-m);font-weight:500}
.stbl .tr-total td:first-child{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep)}
.td-neg{color:var(--neg)!important}
.td-amber{color:var(--amber)!important}
.td-gold{color:var(--gold-deep)!important;font-weight:600!important}
.td-warn{color:var(--warn)!important}
.td-pos{color:var(--pos)!important}
.td-dim{color:var(--ink-4)!important}
.chip-saída{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-tint);color:var(--gold-deep);border:1px solid var(--gold-ring);padding:1px 5px;border-radius:var(--r-xs);vertical-align:middle;margin-left:4px}
.chip-pos{background:var(--pos-t);color:var(--pos);border-color:rgba(22,101,52,.2)}
.chip-neg{background:var(--neg-t);color:var(--neg);border-color:rgba(185,28,28,.2)}

/* ── MONTHLY VIEW ─────────────────────────────────────── */
.monthly-tbl{border-collapse:collapse;font-size:11px;min-width:100%}
.monthly-tbl th{position:sticky;top:0;z-index:1;padding:7px 10px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-deep);background:var(--tbl-head);border-bottom:2px solid var(--div-m);white-space:nowrap}
.monthly-tbl th:first-child{text-align:left;min-width:72px;position:sticky;left:0;z-index:2}
.monthly-tbl th.th-total{background:var(--cream-inset)}
.monthly-tbl td{padding:6px 10px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;border-bottom:1px solid var(--div);white-space:nowrap;color:var(--ink-2)}
.monthly-tbl td:first-child{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;color:var(--ink-4);letter-spacing:.04em;background:var(--cream-canvas);position:sticky;left:0;border-right:1px solid var(--div)}
.monthly-tbl .td-active{color:var(--amber)}
.monthly-tbl .td-exit{background:rgba(190,140,74,.1);color:var(--gold-deep);font-weight:500}
.monthly-tbl .td-exited{color:var(--div-m)}
.monthly-tbl .td-inactive{color:var(--div-m)}
.monthly-tbl .td-total{background:var(--cream-canvas);font-weight:500;color:var(--ink-2);border-left:1px solid var(--div-m)}
.monthly-tbl .td-total-drop{color:var(--pos)!important;font-weight:600!important}
.monthly-tbl tbody tr:hover td{filter:brightness(.97)}
.monthly-tbl .tr-divider td{background:var(--cream-inset);padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--div-m);border-bottom:1px solid var(--div-m)}
.monthly-scroll{overflow:auto;max-height:480px;border:1px solid var(--div);border-radius:var(--r-sm)}
.monthly-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--ink-4);letter-spacing:.06em}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ── TOTALS BAND ──────────────────────────────────────── */
.totals-band{background:var(--dark);border-radius:var(--r-lg);padding:16px 24px;margin-bottom:16px;display:flex;gap:0}
.tb-item{flex:1;padding:0 16px;text-align:center;border-right:1px solid rgba(243,238,226,.08)}
.tb-item:first-child{padding-left:0;text-align:left}
.tb-item:last-child{border-right:none}
.tb-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--on-dark-m);margin-bottom:5px}
.tb-value{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:var(--on-dark)}
.tb-sub{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--on-dark-m);margin-top:3px}
.tb-neg{color:#f9a0a0!important}.tb-pos{color:#86efac!important}.tb-gold{color:var(--gold-soft)!important}

/* ── FOOTER ───────────────────────────────────────────── */
.footer{text-align:center;padding:16px 20px;font-size:11px;color:var(--ink-4);border-top:1px solid var(--div)}

/* ── UTILS ────────────────────────────────────────────── */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--cream-canvas)}
::-webkit-scrollbar-thumb{background:var(--cream-inset);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-soft)}

@media(max-width:1100px){.players-grid{grid-template-columns:1fr}}
@media(max-width:700px){
  .item-row{grid-template-columns:1fr 90px 76px 90px 22px}
  .totals-band{flex-wrap:wrap}
  .tb-item{flex:1 1 40%;border-right:none;padding:0 0 10px}
  .tb-item:nth-child(2n+1){padding-left:0;text-align:left}
  .hero,.page-body{margin-left:12px;margin-right:12px}
}
@media(max-width:520px){
  .item-row{grid-template-columns:1fr 84px 72px 1fr 22px}
}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════════════════════════
const SUPA_URL   = 'https://upodpuuxpgjslzsjmznm.supabase.co';
const SUPA_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwb2RwdXV4cGdqc2x6c2ptem5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzMwNzcsImV4cCI6MjA5NDg0OTA3N30.gkFpm2qoYNvfxunfYuYiLz7yMcf-Zu1103Xa2uI4KrA';
const DB_TABLE   = 'tef_state';
const DB_ROW     = 'baixa_v1';

let _db        = null;
let _saveTimer = null;

function initDB() {
  if (typeof supabase === 'undefined') return;
  _db = supabase.createClient(SUPA_URL, SUPA_KEY);
}

function setStatus(s) {
  const el = document.getElementById('save-status');
  if (!el) return;
  const MAP = {
    loading: ['Carregando…',   'rgba(243,238,226,.38)'],
    saving:  ['Salvando…',     'rgba(243,238,226,.38)'],
    saved:   ['● Salvo',       '#86efac'],
    error:   ['● Erro ao salvar', '#f87171'],
    offline: ['● Offline',     'rgba(243,238,226,.25)'],
  };
  const [txt, clr] = MAP[s] ?? MAP.offline;
  el.textContent = txt;
  el.style.color = clr;
}

async function loadFromDB() {
  if (!_db) return;
  setStatus('loading');
  const { data, error } = await _db
    .from(DB_TABLE).select('state').eq('id', DB_ROW).maybeSingle();
  if (error) { console.error('Supabase load:', error); setStatus('error'); return; }
  if (data?.state) {
    const d = data.state;
    if (d.S?.players?.length) { S = d.S; _pid = d._pid || _pid; _iid = d._iid || _iid; }
    saveLocal();   // keep localStorage in sync
    renderAll();
  }
  setStatus('saved');
}

function saveToDB() {
  if (!_db) return;
  setStatus('saving');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    const { error } = await _db.from(DB_TABLE).upsert(
      { id: DB_ROW, state: { S, _pid, _iid }, updated_at: new Date().toISOString() },
      { onConflict: 'id' }
    );
    if (error) { console.error('Supabase save:', error); setStatus('error'); }
    else setStatus('saved');
  }, 700);
}

// ═══════════════════════════════════════════════════════════════════
// PTAX HISTÓRICO (xlsx Cotações, cotação mensal de fechamento)
// ═══════════════════════════════════════════════════════════════════
const FX_HIST = {
  '2024-01':{USD:4.9526,EUR:5.3567},'2024-02':{USD:4.9716,EUR:5.3708},
  '2024-03':{USD:5.0153,EUR:5.4120},'2024-04':{USD:5.1934,EUR:5.5382},
  '2024-05':{USD:5.2443,EUR:5.6853},'2024-06':{USD:5.5925,EUR:5.9912},
  '2024-07':{USD:5.6500,EUR:6.1161},'2024-08':{USD:5.6103,EUR:6.1977},
  '2024-09':{USD:5.4482,EUR:6.0677},'2024-10':{USD:5.7867,EUR:6.2977},

let LIVE_FX = {USD:null,EUR:null,date:''};

async function fetchLivePTAX() {
  try {
    const r = await fetch('https://economia.awesomeapi.com.br/json/last/EUR-BRL,USD-BRL');
    const j = await r.json();
    if (j.EURBRL) LIVE_FX.EUR = parseFloat(j.EURBRL.bid);
    if (j.USDBRL) LIVE_FX.USD = parseFloat(j.USDBRL.bid);
    if (j.EURBRL?.create_date) {
      const d = j.EURBRL.create_date.split(' ')[0];
      LIVE_FX.date = d;
      const ym = d.substring(0,7);
      if (!FX_HIST[ym]) FX_HIST[ym] = {USD:LIVE_FX.USD, EUR:LIVE_FX.EUR};
    }
  } catch(e) { console.warn('PTAX err:', e); }
  updatePTAXChip();
}

function updatePTAXChip() {
  const el = document.getElementById('ptax-chip');
  if (!el) return;
  const fE = LIVE_FX.EUR ? LIVE_FX.EUR.toFixed(4) : '—';
  const fU = LIVE_FX.USD ? LIVE_FX.USD.toFixed(4) : '—';
  el.innerHTML = `<span>EUR</span><strong>${fE}</strong><span style="opacity:.3">|</span><span>USD</span><strong>${fU}</strong>${LIVE_FX.date?`<span style="font-size:8px">${fmtD(LIVE_FX.date)}</span>`:''}<button class="ptax-refresh" onclick="fetchLivePTAX()">↻</button>`;
}

function getRate(currency, ym) {
  if (currency==='BRL') return {rate:1,src:'BRL'};
  if (ym && FX_HIST[ym]) return {rate:FX_HIST[ym][currency],src:`PTAX ${ym}`};
  if (ym) {
    const keys = Object.keys(FX_HIST).sort();
    for (const k of [...keys].reverse()) { if (k<=ym) return {rate:FX_HIST[k][currency],src:`PTAX ${k}*`}; }
  }
  if (LIVE_FX[currency]) return {rate:LIVE_FX[currency],src:'PTAX live'};
  return {rate:1,src:'?'};
}

// CALC
// ═══════════════════════════════════════════════════════════════════
function monthsInc(a,b){return (b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+1;}
function pDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function ymStr(dateStr){return dateStr?dateStr.substring(0,7):'';}

function calcPlayer(p) {
  if (!p.start || !p.end) return null;
  const startD=pDate(p.start), endD=pDate(p.end);
  if (endD<=startD) return null;
  const contractMonths=monthsInc(startD,endD);
  const startYM=ymStr(p.start);

  let exitMonths=null, exitD=null;
  if (p.exit){exitD=pDate(p.exit); exitMonths=Math.max(0,Math.min(contractMonths,monthsInc(startD,exitD)));}

  const items = p.items.map(it => {
    const amt=it.amount??0;
    const {rate,src}=getRate(it.currency,startYM);
    const totalBRL=amt*rate, monthlyBRL=contractMonths>0?totalBRL/contractMonths:0;
    const amortBRL=exitMonths!==null?monthlyBRL*exitMonths:0;
    return {...it,rate,src,totalBRL,monthlyBRL,amortBRL,residBRL:totalBRL-amortBRL};
  });

  const totAct  = items.reduce((s,i)=>s+i.totalBRL,0);
  const totAmort = items.reduce((s,i)=>s+i.amortBRL,0);
  const totResid = items.reduce((s,i)=>s+i.residBRL,0);
  const monthlyTotal = items.reduce((s,i)=>s+i.monthlyBRL,0);
  const monthsRemaining = exitMonths!==null ? contractMonths-exitMonths : null;
  const futureAmortAvoided = monthsRemaining!==null ? monthlyTotal*monthsRemaining : null;

  let saleBRL=0,saleRate=1,saleSrc='',gain=null;
  if (p.saleAmount && exitD) {
    const {rate,src}=getRate(p.saleCurrency,ymStr(p.exit));
    saleRate=rate; saleSrc=src;
    saleBRL=p.saleAmount*saleRate;
    gain=saleBRL-totResid;
  }

  return {contractMonths,exitMonths,monthsRemaining,monthlyTotal,futureAmortAvoided,items,totAct,totAmort,totResid,saleBRL,saleRate,saleSrc,gain,pctAmort:totAct>0?totAmort/totAct*100:0};
}

// monthly amort for a player in a given month (Date object, first of month)
function monthAmort(p,month) {
  const c=calcPlayer(p);
  if (!c||!p.start) return {amort:0,status:'inactive'};
  const startD=pDate(p.start);
  const startM=new Date(startD.getFullYear(),startD.getMonth(),1);
  const endD=pDate(p.end);
  const endM=new Date(endD.getFullYear(),endD.getMonth(),1);
  if (month<startM||month>endM) return {amort:0,status:'inactive'};
  if (p.exit) {
    const exitD=pDate(p.exit);
    const exitM=new Date(exitD.getFullYear(),exitD.getMonth(),1);
    if (month.getTime()===exitM.getTime()) return {amort:c.monthlyTotal,status:'exit'};
    if (month>exitM) return {amort:0,status:'exited'};
  }
  return {amort:c.monthlyTotal,status:'active'};
}

// ── Monthly view ───────────────────────────────────────────────────
function hMonthly() {
  const active=S.players.filter(p=>calcPlayer(p)&&(p.items.some(i=>i.amount)));
  if (active.length===0) return `<div id="monthly-section"></div>`;

  // Build month range
  let minD=null, maxD=null;
  for (const p of active) {
    if (!p.start) continue;
    const s=pDate(p.start);
    if (!minD||s<minD) minD=s;
    const eod=p.exit?pDate(p.exit):(p.end?pDate(p.end):null);
    if (eod&&(!maxD||eod>maxD)) maxD=eod;
  }
  if (!minD) return `<div id="monthly-section"></div>`;
  if (!maxD) maxD=new Date(minD.getFullYear()+2,minD.getMonth(),1);

  const months=[];
  let cur=new Date(minD.getFullYear(),minD.getMonth(),1);
  const limit=new Date(maxD.getFullYear(),maxD.getMonth()+1,1);
  let cnt=0;
  while(cur<limit&&cnt<72){months.push(new Date(cur));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);cnt++;}

  // Peak total (before any exit)
  const peakTotal=active.reduce((s,p)=>{const c=calcPlayer(p);return s+(c?c.monthlyTotal:0);},0);

  // Build table header
  const colNames=active.map(p=>esc(p.name||'Atleta'));
  const thead=`<tr>
    <th>Mês</th>
    ${colNames.map(n=>`<th>${n}</th>`).join('')}
    <th class="th-total">Total</th>
    <th class="th-total">Economia acum.</th>
  </tr>`;

  // Build rows
  let prevYear=null;
  let cumulativeSaved=0;
  const rows=months.map(month=>{
    const yr=month.getFullYear();
    let yearDivider='';
    if(yr!==prevYear){prevYear=yr;yearDivider=`<tr class="tr-divider"><td colspan="${active.length+3}">${yr}</td></tr>`;}

    const cells=active.map(p=>{
      const {amort,status}=monthAmort(p,month);
      let cls='', content='';
      if(status==='active'){cls='td-active';content=`R$ ${N(amort)}`;}
      else if(status==='exit'){cls='td-exit';content=`R$ ${N(amort)}<br><span style="font-size:7.5px;letter-spacing:.08em;font-family:'IBM Plex Mono',monospace">SAÍDA</span>`;}
      else if(status==='exited'){cls='td-exited';content='—';}
      else{cls='td-inactive';content='';}
      return `<td class="${cls}">${content}</td>`;
    }).join('');

    const rowTotal=active.reduce((s,p)=>{const{amort,status}=monthAmort(p,month);return s+(status==='active'||status==='exit'?amort:0);},0);
    const saved=peakTotal-rowTotal;
    if(saved>0) cumulativeSaved+=saved;
    const totalCls=rowTotal<peakTotal&&peakTotal>0?'td-total td-total-drop':'td-total';
    const moStr=`${MONTHS_PT[month.getMonth()]}/${String(month.getFullYear()).slice(2)}`;
    const row=`<tr>
      <td>${moStr}</td>
      ${cells}
      <td class="${totalCls}">R$ ${N(rowTotal)}</td>
      <td class="td-total${cumulativeSaved>0?' td-total-drop':''}">${cumulativeSaved>0?`R$ ${N(cumulativeSaved)}`:'—'}</td>
    </tr>`;
    return yearDivider+row;
  }).join('');

  return `
  <div id="monthly-section" class="section-card">
    <div class="sec-eyebrow">Visão Mensal de Amortização</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-4);margin-bottom:10px;letter-spacing:.03em">
      Amortização mensal por atleta · após a data de saída o custo deixa de onerar o P&amp;L
    </div>
    <div class="monthly-scroll">
      <table class="monthly-tbl">
        <thead>${thead}</thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="monthly-legend">
      <div class="leg-item"><div class="leg-dot" style="background:rgba(217,119,6,.25)"></div>Amortização ativa</div>
      <div class="leg-item"><div class="leg-dot" style="background:rgba(190,140,74,.2);border:1px solid var(--gold-ring)"></div>Mês de saída</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--div)"></div>Após saída (sem custo)</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--pos-t);border:1px solid rgba(22,101,52,.2)"></div>Economia acumulada</div>
    </div>
  </div>`;
}

// ── Totals band ────────────────────────────────────────────────────
function hTotalsBand() {
  const active=S.players.filter(p=>{const c=calcPlayer(p);return c&&c.totAct>0;});
  if(active.length===0) return `<div id="totals-band"></div>`;
  const calcs=active.map(p=>calcPlayer(p));
  const totAct   =calcs.reduce((s,c)=>s+c.totAct,0);
  const totMo    =calcs.reduce((s,c)=>s+c.monthlyTotal,0);
  const totResid =calcs.filter(c=>c.exitMonths!==null).reduce((s,c)=>s+c.totResid,0);
  const totGain  =calcs.filter(c=>c.gain!==null).reduce((s,c)=>s+c.gain,0);
  const hasResid =calcs.some(c=>c.exitMonths!==null);
  const hasGain  =calcs.some(c=>c.gain!==null);
  return `
  <div id="totals-band" class="totals-band">
    <div class="tb-item"><div class="tb-eyebrow">Total Ativado</div><div class="tb-value">R$ ${N(totAct)}</div><div class="tb-sub">${active.length} atleta${active.length>1?'s':''}</div></div>
    <div class="tb-item"><div class="tb-eyebrow">Amort. Mensal Total</div><div class="tb-value tb-neg">R$ ${N(totMo)}</div><div class="tb-sub">enquanto todos ativos</div></div>
    <div class="tb-item"><div class="tb-eyebrow">Baixa Total</div><div class="tb-value ${hasResid?'tb-gold':''}">${hasResid?`R$ ${N(totResid)}`:'—'}</div><div class="tb-sub">valor residual na venda</div></div>
    <div class="tb-item"><div class="tb-eyebrow">Ganho Econômico Total</div><div class="tb-value ${hasGain?(totGain>=0?'tb-pos':'tb-neg'):''}">${hasGain?`${totGain>=0?'+':''}R$ ${N(totGain)}`:'—'}</div><div class="tb-sub">receita − baixa (total)</div></div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════════
function bindEvents() {
  document.getElementById('btn-add-player')?.addEventListener('click',()=>{S.players.push(newPlayer());saveLocal();renderAll();});

  document.addEventListener('click', e => {
    const t=e.target.closest('[data-action]');
    if(!t) return;
    const {action,pid,iid}={action:t.dataset.action,pid:+t.dataset.pid,iid:+t.dataset.iid};

    if(action==='remove-player'){
      if(S.players.length===1){S.players=[newPlayer()];saveLocal();renderAll();return;}
      S.players=S.players.filter(p=>p.id!==pid);
      saveLocal();renderAll();
    }
    if(action==='add-item'){
      const p=S.players.find(x=>x.id===pid);
      if(p){p.items.push(newItem(''));saveLocal();renderAll();}
    }
    if(action==='remove-item'){
      const p=S.players.find(x=>x.id===pid);
      if(p){
        p.items=p.items.filter(i=>i.id!==iid);
        if(!p.items.length) p.items.push(newItem(''));
        saveLocal();renderAll();
      }
    }
  }, true);

  document.addEventListener('click', e => {
    // Currency toggles
    const t=e.target.closest('[data-field="itemCur"],[data-field="saleCur"]');
    if(!t) return;
    const pid=+t.dataset.pid, iid=t.dataset.iid?+t.dataset.iid:null;
    const p=S.players.find(x=>x.id===pid);
    if(!p) return;

    if(t.dataset.field==='itemCur'&&iid) {
      const it=p.items.find(i=>i.id===iid);
      if(!it) return;
      it.currency=t.dataset.v;
      saveLocal();
      refreshItemRow(pid,iid);
      refreshResults(pid);
    }
    if(t.dataset.field==='saleCur') {
      p.saleCurrency=t.dataset.v;
      saveLocal();
      // update toggle active state
      document.querySelectorAll(`[data-field="saleCur"][data-pid="${pid}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===p.saleCurrency));
      document.getElementById(`sale-brl-${pid}`).textContent=hSaleBRL(p);
      refreshResults(pid);
    }
  });

  document.addEventListener('input', e => {
    const t=e.target;
    const field=t.dataset.field;
    if(!field) return;
    const pid=+t.dataset.pid, iid=t.dataset.iid?+t.dataset.iid:null;
    const p=S.players.find(x=>x.id===pid);
    if(!p) return;

    if(iid) {
      const it=p.items.find(i=>i.id===iid);
      if(!it) return;
      if(field==='label')  it.label =t.value;
      if(field==='amount') it.amount=t.value===''?null:parseFloat(t.value);
    } else {
      if(field==='name')       p.name=t.value;
      if(field==='saleAmount') p.saleAmount=t.value===''?null:parseFloat(t.value);
    }
    saveLocal();

    if(field==='amount'&&iid) {
      // update BRL display in row without full re-render
      const it=p.items.find(i=>i.id===iid);
      if(it){
        const {rate}=getRate(it.currency,ymStr(p.start));
        const brl=(it.amount??0)*rate;
        const row=document.getElementById(`irow-${iid}`);
        const brlSpan=row?.querySelector('.brl-val');
        if(brlSpan) brlSpan.textContent=`R$ ${N(brl)}`;
        // update items total
        const totalAct=p.items.reduce((s,i)=>{const{rate:r}=getRate(i.currency,ymStr(p.start));return s+(i.amount??0)*r;},0);
        const totEl=document.querySelector(`#card-${pid} .items-total-val`);
        if(totEl) totEl.textContent=`R$ ${N(totalAct)}`;
      }
    }
    if(field==='saleAmount') {
      const brlEl=document.getElementById(`sale-brl-${pid}`);
      if(brlEl) brlEl.textContent=hSaleBRL(p);
    }
    refreshResults(pid);
  });

  document.addEventListener('change', e => {
    const t=e.target;
    const field=t.dataset.field;
    if(!['start','end','exit'].includes(field)) return;
    const pid=+t.dataset.pid;
    const p=S.players.find(x=>x.id===pid);
    if(!p) return;
    p[field]=t.value;
    saveLocal();
    if(field==='start') {
      // rates change, rebuild all item rows
      const container=document.getElementById(`items-${pid}`);
      if(container) container.innerHTML=p.items.map(it=>hItemRow(pid,it)).join('');
    }
    const brlEl=document.getElementById(`sale-brl-${pid}`);
    if(brlEl) brlEl.textContent=hSaleBRL(p);
    refreshResults(pid);
  });
}

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
async function init() {
  initDB();

  // Show something immediately from localStorage while DB loads
  if (!loadLocal()) S.players = [newPlayer()];
  renderAll();

  const tasks = [fetchLivePTAX()];
  if (_db) {
    setStatus('loading');
    tasks.push(loadFromDB());
  } else {
    setStatus('offline');
  }
  await Promise.all(tasks);
}
init();
</script>
