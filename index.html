<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora TEF — Glorioso Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── DESIGN TOKENS ── */
        :root {
            --gold:          #be8c4a;
            --gold-soft:     #dcc89a;
            --gold-deep:     #7a6244;
            --gold-tint:     rgba(190,140,74,0.12);
            --gold-ring:     rgba(190,140,74,0.22);
            --ink-primary:   #1a1410;
            --ink-secondary: #3a2e1c;
            --ink-4:         rgba(26,20,16,0.55);
            --cream-page:    #f9f7f2;
            --cream-canvas:  #f5f2eb;
            --cream-card:    #fdfbf6;
            --cream-inset:   #ece6d8;
            --tbl-head:      #e7e5de;
            --on-dark:       #f3eee2;
            --on-dark-dim:   rgba(243,238,226,0.45);
            --on-dark-muted: rgba(243,238,226,0.28);
            --var-pos:       #166534;
            --var-pos-tint:  #dcf0e4;
            --var-neg:       #b91c1c;
            --var-neg-tint:  #fce8e8;
            --warn:          #b88a2a;
            --divider:       rgba(26,20,16,0.08);
            --divider-mid:   rgba(26,20,16,0.13);
            --shadow-hair:   0 1px 0 rgba(40,32,22,0.04);
            --shadow-lift:   0 1px 0 rgba(40,32,22,0.04), 0 4px 12px -8px rgba(40,32,22,0.10);
            --r-xs: 4px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--cream-page);
            color: var(--ink-primary);
            line-height: 1.5;
            min-height: 100vh;
            font-size: 15px;
        }

        /* ── PAGE HERO ── */
        .page-hero {
            background: var(--ink-primary);
            border-radius: var(--r-lg);
            margin: 16px 24px 0;
            padding: clamp(20px, 3vw, 32px) clamp(20px, 3vw, 36px);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .hero-left {}
        .hero-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--on-dark-dim);
            margin-bottom: 8px;
        }
        .hero-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(1.6rem, 4.5vw, 3rem);
            font-weight: 700;
            line-height: 1.08;
            letter-spacing: -0.025em;
            color: var(--on-dark);
        }
        .hero-title em {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 600;
            color: var(--gold);
        }
        .hero-sub {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--on-dark-dim);
            letter-spacing: 0.04em;
            margin-top: 10px;
        }
        .hero-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 4px;
        }
        .hero-btn {
            padding: 9px 18px;
            border-radius: var(--r-pill);
            border: 1px solid rgba(243,238,226,0.18);
            background: rgba(243,238,226,0.07);
            color: var(--on-dark);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s;
        }
        .hero-btn:hover { background: rgba(243,238,226,0.13); }

        /* ── WRAPPER ── */
        .page-body { padding: 20px 24px 32px; }

        /* ── SECTION LABEL ── */
        .section-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
        }

        /* ── CONFIG STRIP ── */
        .config-strip {
            background: var(--cream-card);
            border: 1px solid var(--divider);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-hair);
            padding: 18px 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
        }
        .config-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .config-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold-deep);
            white-space: nowrap;
        }
        .aliq-slider {
            -webkit-appearance: none;
            width: 200px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--gold) 0%, var(--gold) var(--pct, 25%), var(--cream-inset) var(--pct, 25%), var(--cream-inset) 100%);
            outline: none;
            cursor: pointer;
        }
        .aliq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--cream-card);
            border: 2px solid var(--gold);
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(40,32,22,0.18);
        }
        .aliq-slider::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--cream-card);
            border: 2px solid var(--gold);
            cursor: pointer;
        }
        .field-wrap {
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--cream-card);
            border: 1px solid var(--divider-mid);
            border-radius: var(--r-sm);
            overflow: hidden;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-ring);
        }
        .field-prefix {
            padding: 8px 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            color: var(--gold-deep);
            background: var(--cream-inset);
            border-right: 1px solid var(--divider);
            white-space: nowrap;
            letter-spacing: 0.05em;
        }
        .field-inp {
            background: transparent;
            border: none;
            outline: none;
            padding: 8px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-primary);
            min-width: 0;
        }
        .aliq-big {
            font-size: 22px;
            font-weight: 500;
            width: 72px;
            text-align: right;
            color: var(--gold-deep);
        }
        .field-suffix {
            padding: 8px 10px 8px 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--ink-4);
        }
        .config-divider {
            width: 1px;
            height: 32px;
            background: var(--divider);
            flex-shrink: 0;
        }
        .config-fx { margin-left: auto; }

        /* ── PLAYER GRID ── */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 20px;
            align-items: start;
        }

        /* ── PLAYER CARD ── */
        .player-card {
            background: var(--cream-card);
            border: 1px solid var(--divider);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-hair);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.18s;
        }
        .player-card:hover { box-shadow: var(--shadow-lift); }

        .player-head {
            background: var(--ink-primary);
            padding: 12px 14px 11px;
        }
        .player-num {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--on-dark-muted);
            margin-bottom: 6px;
        }
        .player-name-inp {
            width: 100%;
            background: rgba(243,238,226,0.08);
            border: 1px solid rgba(243,238,226,0.14);
            border-radius: var(--r-xs);
            padding: 7px 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--on-dark);
            outline: none;
            transition: border-color 0.15s, background 0.15s;
        }
        .player-name-inp:focus {
            border-color: var(--gold);
            background: rgba(243,238,226,0.13);
        }
        .player-name-inp::placeholder { color: var(--on-dark-muted); }

        .player-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }

        /* value field */
        .f-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold-deep);
            display: block;
            margin-bottom: 5px;
        }
        .gross-field { margin-bottom: 14px; }
        .gross-field .field-inp { font-size: 15px; font-weight: 500; width: 100%; }

        /* deductions */
        .ded-block {
            border-top: 1px solid var(--divider);
            padding-top: 12px;
            margin-bottom: 14px;
        }
        .ded-block-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-4);
            margin-bottom: 10px;
        }
        .ded-row {
            display: grid;
            grid-template-columns: 15px 1fr 58px 13px;
            align-items: center;
            gap: 6px;
            margin-bottom: 7px;
        }
        .ded-chk {
            width: 14px; height: 14px;
            accent-color: var(--gold);
            cursor: pointer;
            margin: 0;
        }
        .ded-name {
            font-size: 12px;
            color: var(--ink-secondary);
            cursor: help;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ded-row.off .ded-name { color: var(--ink-4); }
        .ded-rate-inp {
            background: var(--cream-canvas);
            border: 1px solid var(--divider);
            border-radius: var(--r-xs);
            padding: 3px 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 400;
            color: var(--ink-primary);
            text-align: right;
            width: 100%;
            outline: none;
            transition: border-color 0.15s;
        }
        .ded-rate-inp:focus { border-color: var(--gold); }
        .ded-row.off .ded-rate-inp { opacity: 0.30; pointer-events: none; }
        .ded-unit {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--ink-4);
        }

        /* Results */
        .results-block { border-top: 1px solid var(--divider); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }

        /* value summary lines */
        .vsummary { margin-bottom: 4px; }
        .vrow {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .vrow .vl { color: var(--ink-4); }
        .vrow .vv {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
        }
        .vrow.ded-line .vl { font-size: 11px; color: var(--ink-4); padding-left: 10px; }
        .vrow.ded-line .vv { font-size: 11px; color: var(--var-neg); }
        .v-gross { color: var(--warn); }
        .v-ded   { color: var(--var-neg); }
        .v-net   { color: var(--var-pos); font-size: 13px !important; }
        .vsep { border: none; border-top: 1px dashed var(--divider); margin: 7px 0; }

        /* scenario cards */
        .scard {
            border-radius: var(--r-sm);
            padding: 11px 12px;
        }
        .scard-c1   { background: var(--var-neg-tint); border: 1px solid rgba(185,28,28,0.14); }
        .scard-c2   { background: var(--var-pos-tint); border: 1px solid rgba(22,101,52,0.14); }
        .scard-sav  { background: var(--gold-tint);    border: 1px solid rgba(190,140,74,0.22); }

        .sc-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 8.5px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .sc-eyebrow-c1  { color: var(--var-neg); }
        .sc-eyebrow-c2  { color: var(--var-pos); }
        .sc-eyebrow-sav { color: var(--gold-deep); }

        .sc-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11.5px;
            margin-bottom: 4px;
        }
        .sc-line .sl { color: var(--ink-4); }
        .sc-line .sv {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            font-weight: 400;
            color: var(--ink-secondary);
        }
        .sc-sep { border: none; border-top: 1px solid rgba(26,20,16,0.07); margin: 6px 0; }
        .sc-line.main .sl { font-weight: 600; color: var(--ink-secondary); font-size: 12px; }
        .sc-line.main .sv { font-size: 13px; font-weight: 500; }
        .sv-c1  { color: var(--var-neg) !important; }
        .sv-c2  { color: var(--var-pos) !important; }
        .sv-sav { color: var(--gold-deep) !important; font-size: 14px !important; font-weight: 600 !important; }

        .player-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 12px;
            font-size: 12px;
            color: var(--ink-4);
            text-align: center;
            font-style: italic;
        }

        /* ── TOTALS BAND ── */
        .totals-band {
            background: var(--ink-primary);
            border-radius: var(--r-lg);
            padding: 20px 28px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0;
        }
        .tb-item {
            padding: 0 20px;
            text-align: center;
        }
        .tb-item + .tb-item { border-left: 1px solid rgba(243,238,226,0.08); }
        .tb-item:first-child { padding-left: 0; text-align: left; }
        .tb-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 8.5px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--on-dark-muted);
            margin-bottom: 6px;
        }
        .tb-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 500;
            color: var(--on-dark);
            line-height: 1.1;
        }
        .tb-sub {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            color: var(--on-dark-muted);
            margin-top: 4px;
        }
        .tb-value-neg  { color: #f9a0a0; }
        .tb-value-pos  { color: #86efac; }
        .tb-value-gold { color: var(--gold-soft); }

        /* ── SUMMARY TABLE ── */
        .summary-section {
            background: var(--cream-card);
            border: 1px solid var(--divider);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-hair);
            padding: 20px 24px;
            margin-bottom: 24px;
            overflow-x: auto;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }
        .summary-table th {
            padding: 9px 14px;
            background: var(--tbl-head);
            text-align: right;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 8.5px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gold-deep);
            border-bottom: 2px solid var(--divider-mid);
            white-space: nowrap;
        }
        .summary-table th:first-child { text-align: left; border-radius: var(--r-xs) 0 0 0; }
        .summary-table th:last-child  { border-radius: 0 var(--r-xs) 0 0; }
        .summary-table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--divider);
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--ink-secondary);
            white-space: nowrap;
        }
        .summary-table td:first-child {
            text-align: left;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-primary);
        }
        .summary-table tr:last-child td { border-bottom: none; }
        .summary-table tbody tr:hover td { background: var(--cream-inset); }
        .summary-table .total-row td {
            background: var(--tbl-head);
            border-top: 2px solid var(--divider-mid);
            font-weight: 500;
            color: var(--ink-primary);
        }
        .summary-table .total-row td:first-child {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold-deep);
        }
        .td-neg  { color: var(--var-neg) !important; }
        .td-pos  { color: var(--var-pos) !important; }
        .td-gold { color: var(--gold-deep) !important; font-weight: 600 !important; }
        .td-warn { color: var(--warn) !important; }

        /* chip */
        .chip {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: var(--r-xs);
        }
        .chip-pos { background: var(--var-pos-tint); color: var(--var-pos); }
        .chip-neg { background: var(--var-neg-tint); color: var(--var-neg); }
        .chip-gold { background: var(--gold-tint); color: var(--gold-deep); }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            padding: 20px 24px;
            font-size: 11.5px;
            color: var(--ink-4);
            border-top: 1px solid var(--divider);
        }

        /* ── UTILS ── */
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--cream-canvas); }
        ::-webkit-scrollbar-thumb { background: var(--cream-inset); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-soft); }

        @media (max-width: 1400px) {
            .players-grid { grid-template-columns: repeat(3, 1fr); }
            .totals-band  { grid-template-columns: repeat(3, 1fr); }
            .tb-item + .tb-item { border-left: none; }
            .tb-item:nth-child(3n+1) { padding-left: 0; text-align: left; }
        }
        @media (max-width: 900px)  { .players-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px)  {
            .players-grid { grid-template-columns: 1fr; }
            .totals-band  { grid-template-columns: repeat(2, 1fr); }
            .page-hero, .page-body { margin-left: 12px; margin-right: 12px; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
// ================================================================
// STATE
// ================================================================
const S = {
    aliq:    5.00,
    fxRate:  5.80,
    players: Array.from({ length: 5 }, (_, i) => ({
        name: `Jogador ${i + 1}`,
        gross: 0,
        deds: {
            intermediacao: { on: false, rate: 5,   label: 'Intermediação',      tip: 'Comissão do agente/intermediário' },
            sellon:        { on: false, rate: 0,   label: 'Sell-on Fee',        tip: 'Cláusula de revenda — % para o clube anterior' },
            solidarity:    { on: false, rate: 5,   label: 'Solidariedade FIFA', tip: 'Art. 21 RSTP — 5% para clubes formadores' },
            agenteBuyer:   { on: false, rate: 0,   label: 'Agente Comprador',   tip: 'Comissão do agente do clube comprador' },
            outros1:       { on: false, rate: 0,   label: 'Outras taxas 1',     tip: 'Deduções adicionais' },
            outros2:       { on: false, rate: 0,   label: 'Outras taxas 2',     tip: 'Deduções adicionais' },
        }
    }))
};

// ================================================================
// CALC
// ================================================================
function calcPlayer(p) {
    const gross = p.gross || 0;
    let totalDed = 0;
    const dedBreak = {};
    for (const [k, d] of Object.entries(p.deds)) {
        const v = d.on ? gross * d.rate / 100 : 0;
        dedBreak[k] = v;
        totalDed += v;
    }
    const net   = gross - totalDed;
    const taxC1 = gross * S.aliq / 100;
    const taxC2 = net   * S.aliq / 100;
    return { gross, net, totalDed, dedBreak, taxC1, taxC2,
             savings: taxC1 - taxC2, netFinalC1: gross - taxC1, netFinalC2: net - taxC2 };
}

// ================================================================
// FORMAT
// ================================================================
const N  = v => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v || 0);
const P  = v => (v || 0).toFixed(2).replace('.', ',') + '%';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ================================================================
// FOCUS PRESERVATION
// ================================================================
let _fk = null, _fsel = [0, 0];
function saveFocus() {
    const el = document.activeElement;
    if (!el || el === document.body) { _fk = null; return; }
    _fk = JSON.stringify(el.dataset);
    try { _fsel = [el.selectionStart, el.selectionEnd]; } catch(e) { _fsel = [0,0]; }
}
function restoreFocus() {
    if (!_fk) return;
    const ds = JSON.parse(_fk);
    const parts = Object.entries(ds).map(([k,v]) => `[data-${k}="${CSS.escape(v)}"]`).join('');
    if (!parts) return;
    const el = document.querySelector(parts);
    if (el) { el.focus(); try { el.setSelectionRange(_fsel[0], _fsel[1]); } catch(e){} }
}

// ================================================================
// RENDER
// ================================================================
function render() {
    saveFocus();
    document.getElementById('app').innerHTML = buildHTML();
    bindEvents();
    restoreFocus();
}

function buildHTML() {
    const active = S.players.filter(p => p.gross > 0);
    return `
        ${hHero()}
        <div class="page-body">
            ${hConfig()}
            <div class="section-eyebrow">Simulação por Atleta</div>
            <div class="players-grid">${S.players.map((p,i) => hCard(p,i)).join('')}</div>
            ${active.length ? hTotalsBand(active) : ''}
            ${active.length ? hSummary(active) : ''}
        </div>
        <div class="footer">Calculadora TEF · Glorioso Finance · Para fins de planejamento tributário — consulte um especialista fiscal antes de decisões</div>
    `;
}

// ── Hero ──
function hHero() {
    return `
        <div class="page-hero">
            <div class="hero-left">
                <div class="hero-eyebrow">Glorioso Finance · Departamento Jurídico-Tributário</div>
                <h1 class="hero-title">Calculadora <em>TEF</em></h1>
                <div class="hero-sub">Tributação Específica em Transferências de Atletas de Futebol</div>
            </div>
            <div class="hero-right">
                <button class="hero-btn" onclick="window.print()">Imprimir</button>
            </div>
        </div>
    `;
}

// ── Config strip ──
function hConfig() {
    const min = 0, max = 20;
    const pct = ((S.aliq - min) / (max - min) * 100).toFixed(1);
    return `
        <div class="config-strip">
            <div class="config-label">Alíquota</div>
            <div class="config-group">
                <input class="aliq-slider" type="range" id="aliq-slider"
                    min="${min}" max="${max}" step="0.1" value="${S.aliq}"
                    style="--pct:${pct}%">
                <div class="field-wrap">
                    <input class="field-inp aliq-big" type="number" id="aliq-inp"
                        min="${min}" max="${max}" step="0.1" value="${S.aliq}">
                    <span class="field-suffix">%</span>
                </div>
            </div>
            <div class="config-divider"></div>
            <div class="config-label config-fx">Câmbio EUR → BRL</div>
            <div class="field-wrap">
                <span class="field-prefix">R$ / €</span>
                <input class="field-inp" type="number" id="fx-inp"
                    value="${S.fxRate}" min="0" step="0.01" style="width:80px">
            </div>
        </div>
    `;
}

// ── Player card ──
function hCard(p, pi) {
    const c = calcPlayer(p);
    return `
        <div class="player-card">
            <div class="player-head">
                <div class="player-num">Atleta ${pi + 1}</div>
                <input class="player-name-inp" type="text"
                    data-pi="${pi}" data-field="name"
                    value="${esc(p.name)}" placeholder="Nome do atleta">
            </div>
            <div class="player-body">
                <label class="f-label">Valor de Transferência (Bruto)</label>
                <div class="field-wrap gross-field">
                    <span class="field-prefix">€</span>
                    <input class="field-inp" type="number"
                        data-pi="${pi}" data-field="gross"
                        value="${p.gross || ''}" placeholder="0,00"
                        min="0" step="500000" style="width:100%">
                </div>

                <div class="ded-block">
                    <div class="ded-block-title">Deduções</div>
                    ${Object.entries(p.deds).map(([dk, d]) => `
                        <div class="ded-row${d.on ? '' : ' off'}">
                            <input class="ded-chk" type="checkbox"
                                data-pi="${pi}" data-dk="${dk}" data-field="dedOn"
                                ${d.on ? 'checked' : ''}>
                            <span class="ded-name" title="${esc(d.tip)}">${esc(d.label)}</span>
                            <input class="ded-rate-inp" type="number"
                                data-pi="${pi}" data-dk="${dk}" data-field="dedRate"
                                value="${d.rate}" min="0" max="100" step="0.1"
                                ${d.on ? '' : 'tabindex="-1"'}>
                            <span class="ded-unit">%</span>
                        </div>
                    `).join('')}
                </div>

                ${p.gross > 0 ? hResults(c, p) : `<div class="player-empty">Insira o valor de transferência</div>`}
            </div>
        </div>
    `;
}

// ── Results per player ──
function hResults(c, p) {
    const { gross, net, totalDed, dedBreak, taxC1, taxC2, savings, netFinalC1, netFinalC2 } = c;
    const activeDeds = Object.entries(p.deds).filter(([k,d]) => d.on && dedBreak[k] > 0);

    return `
        <div class="results-block">
            <div class="vsummary">
                <div class="vrow">
                    <span class="vl">Valor Bruto</span>
                    <span class="vv v-gross">€ ${N(gross)}</span>
                </div>
                ${activeDeds.map(([k,d]) => `
                    <div class="vrow ded-line">
                        <span class="vl">(−) ${esc(d.label)}</span>
                        <span class="vv v-ded">€ ${N(dedBreak[k])}</span>
                    </div>
                `).join('')}
                ${activeDeds.length ? `
                    <div class="vrow">
                        <span class="vl">Total Deduções</span>
                        <span class="vv v-ded">€ ${N(totalDed)}</span>
                    </div>
                ` : ''}
                <hr class="vsep">
                <div class="vrow">
                    <span class="vl" style="font-weight:600;color:var(--ink-secondary)">Valor Líquido</span>
                    <span class="vv v-net">€ ${N(net)}</span>
                </div>
            </div>

            <div class="scard scard-c1">
                <div class="sc-eyebrow sc-eyebrow-c1">Cenário 1 — Trib. sobre o Bruto</div>
                <div class="sc-line">
                    <span class="sl">Base de cálculo</span>
                    <span class="sv">€ ${N(gross)}</span>
                </div>
                <div class="sc-line">
                    <span class="sl">Alíquota</span>
                    <span class="sv">${P(S.aliq)}</span>
                </div>
                <div class="sc-sep"></div>
                <div class="sc-line main">
                    <span class="sl">Tributo</span>
                    <span class="sv sv-c1">€ ${N(taxC1)}</span>
                </div>
                <div class="sc-line">
                    <span class="sl">Líquido após tributo</span>
                    <span class="sv">€ ${N(netFinalC1)}</span>
                </div>
            </div>

            <div class="scard scard-c2">
                <div class="sc-eyebrow sc-eyebrow-c2">Cenário 2 — Trib. sobre o Líquido</div>
                <div class="sc-line">
                    <span class="sl">Base de cálculo</span>
                    <span class="sv">€ ${N(net)}</span>
                </div>
                <div class="sc-line">
                    <span class="sl">Alíquota</span>
                    <span class="sv">${P(S.aliq)}</span>
                </div>
                <div class="sc-sep"></div>
                <div class="sc-line main">
                    <span class="sl">Tributo</span>
                    <span class="sv sv-c2">€ ${N(taxC2)}</span>
                </div>
                <div class="sc-line">
                    <span class="sl">Líquido após trib. + ded.</span>
                    <span class="sv">€ ${N(netFinalC2)}</span>
                </div>
            </div>

            <div class="scard scard-sav">
                <div class="sc-eyebrow sc-eyebrow-sav">Economia Tributária</div>
                <div class="sc-line">
                    <span class="sl">C1 − C2</span>
                    <span class="sv sv-sav">${savings>=0?'+':''}€ ${N(savings)}</span>
                </div>
                <div class="sc-line">
                    <span class="sl">Redução</span>
                    <span class="sv" style="color:var(--gold-deep)">${taxC1 > 0 ? P(savings/taxC1*100) : '—'}</span>
                </div>
            </div>
        </div>
    `;
}

// ── Totals band ──
function hTotalsBand(active) {
    const cs  = active.map(p => calcPlayer(p));
    const g   = cs.reduce((s,c) => s+c.gross,    0);
    const ded = cs.reduce((s,c) => s+c.totalDed,  0);
    const net = cs.reduce((s,c) => s+c.net,       0);
    const t1  = cs.reduce((s,c) => s+c.taxC1,     0);
    const t2  = cs.reduce((s,c) => s+c.taxC2,     0);
    const sav = cs.reduce((s,c) => s+c.savings,   0);
    return `
        <div class="totals-band">
            <div class="tb-item">
                <div class="tb-eyebrow">Total Bruto</div>
                <div class="tb-value">€ ${N(g)}</div>
                <div class="tb-sub">${active.length} atleta${active.length>1?'s':''} · R$ ${N(g*S.fxRate)}</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Total Deduções</div>
                <div class="tb-value tb-value-neg">€ ${N(ded)}</div>
                <div class="tb-sub">${g>0?P(ded/g*100):'—'} do bruto</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Total Líquido</div>
                <div class="tb-value">€ ${N(net)}</div>
                <div class="tb-sub">${g>0?P(net/g*100):'—'} do bruto</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Tributos — C1 Bruto</div>
                <div class="tb-value tb-value-neg">€ ${N(t1)}</div>
                <div class="tb-sub">Alíq. ${P(S.aliq)} s/ bruto</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Tributos — C2 Líquido</div>
                <div class="tb-value tb-value-pos">€ ${N(t2)}</div>
                <div class="tb-sub">Alíq. ${P(S.aliq)} s/ líquido</div>
            </div>
            <div class="tb-item">
                <div class="tb-eyebrow">Economia Total</div>
                <div class="tb-value tb-value-gold">€ ${N(sav)}</div>
                <div class="tb-sub">${t1>0?P(sav/t1*100):'—'} de redução</div>
            </div>
        </div>
    `;
}

// ── Summary table ──
function hSummary(active) {
    const rows = active.map(p => {
        const c = calcPlayer(p);
        const savSign = c.savings >= 0 ? '+' : '';
        return `
            <tr>
                <td>${esc(p.name)}</td>
                <td class="td-warn">€ ${N(c.gross)}</td>
                <td class="td-neg">−€ ${N(c.totalDed)}</td>
                <td>€ ${N(c.net)}</td>
                <td class="td-neg">€ ${N(c.taxC1)}</td>
                <td class="td-neg">${P(S.aliq)}</td>
                <td class="td-pos">€ ${N(c.taxC2)}</td>
                <td class="td-pos">${P(S.aliq)}</td>
                <td class="td-gold">${savSign}€ ${N(c.savings)}</td>
                <td>R$ ${N(c.gross*S.fxRate)}</td>
            </tr>
        `;
    }).join('');

    const cs  = active.map(p => calcPlayer(p));
    const g   = cs.reduce((s,c) => s+c.gross,   0);
    const ded = cs.reduce((s,c) => s+c.totalDed, 0);
    const net = cs.reduce((s,c) => s+c.net,      0);
    const t1  = cs.reduce((s,c) => s+c.taxC1,    0);
    const t2  = cs.reduce((s,c) => s+c.taxC2,    0);
    const sav = cs.reduce((s,c) => s+c.savings,  0);

    return `
        <div class="summary-section">
            <div class="section-eyebrow">Resumo Comparativo</div>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th style="text-align:left">Atleta</th>
                        <th>Valor Bruto (€)</th>
                        <th>Deduções (€)</th>
                        <th>Valor Líquido (€)</th>
                        <th>Tributo C1</th>
                        <th>Alíq. C1</th>
                        <th>Tributo C2</th>
                        <th>Alíq. C2</th>
                        <th>Economia (€)</th>
                        <th>Bruto (R$)</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows}
                    <tr class="total-row">
                        <td>Total</td>
                        <td class="td-warn">€ ${N(g)}</td>
                        <td class="td-neg">−€ ${N(ded)}</td>
                        <td>€ ${N(net)}</td>
                        <td class="td-neg">€ ${N(t1)}</td>
                        <td class="td-neg">${P(S.aliq)}</td>
                        <td class="td-pos">€ ${N(t2)}</td>
                        <td class="td-pos">${P(S.aliq)}</td>
                        <td class="td-gold">+€ ${N(sav)}</td>
                        <td>R$ ${N(g*S.fxRate)}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    `;
}

// ================================================================
// EVENTS
// ================================================================
function bindEvents() {
    const slider = document.getElementById('aliq-slider');
    const inp    = document.getElementById('aliq-inp');

    if (slider) slider.addEventListener('input', e => {
        S.aliq = parseFloat(e.target.value) || 0;
        if (inp) inp.value = S.aliq;
        updateSlider(slider);
        render();
    });
    if (inp) inp.addEventListener('input', e => {
        S.aliq = parseFloat(e.target.value) || 0;
        if (slider) { slider.value = S.aliq; updateSlider(slider); }
        render();
    });

    const fx = document.getElementById('fx-inp');
    if (fx) fx.addEventListener('input', e => { S.fxRate = parseFloat(e.target.value) || 1; render(); });

    document.querySelectorAll('[data-field="name"]').forEach(el => {
        el.addEventListener('input', e => { S.players[+e.target.dataset.pi].name = e.target.value; });
        el.addEventListener('blur', () => render());
    });

    document.querySelectorAll('[data-field="gross"]').forEach(el => {
        el.addEventListener('input', e => {
            S.players[+e.target.dataset.pi].gross = parseFloat(e.target.value) || 0;
            render();
        });
    });

    document.querySelectorAll('[data-field="dedOn"]').forEach(el => {
        el.addEventListener('change', e => {
            S.players[+e.target.dataset.pi].deds[e.target.dataset.dk].on = e.target.checked;
            render();
        });
    });

    document.querySelectorAll('[data-field="dedRate"]').forEach(el => {
        el.addEventListener('input', e => {
            S.players[+e.target.dataset.pi].deds[e.target.dataset.dk].rate = parseFloat(e.target.value) || 0;
            render();
        });
    });
}

function updateSlider(slider) {
    const pct = ((+slider.value - +slider.min) / (+slider.max - +slider.min) * 100).toFixed(1);
    slider.style.setProperty('--pct', pct + '%');
}

// ================================================================
// INIT
// ================================================================
render();
</script>
</body>
</html>
